<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MIPS Microprocessor Simulator — Beamer+</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* MIPS-instruction sidebar addition only — styles.css itself stays
     shared and unmodified with circuit_widget.html */
  .mips-submit-btn { width:100%; justify-content:center; margin-top:8px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script src="modules.js"></script>

<!--
  Read-only fork of circuit_widget.html: same engine and module system, but
  the canvas module below only supports pan/zoom/select (no add/move/delete
  of components or wires, no toggling values), the properties panels are
  gone, and the palette module is replaced by a MIPS instruction input box.
  quine_mccluskey.js isn't loaded here since the Equation feature that used
  it doesn't exist in this fork.

  See circuit_widget.html's own load-order comment for why gates/canvas/
  mipsInput/app have to stay inline instead of becoming their own files
  (Babel standalone can't XHR-fetch external script files under file://).
-->
<script src="state.js"></script>
<script src="engine-core.js"></script>
<script src="engine-geometry.js"></script>
<script src="engine-routing.js"></script>
<script src="engine-circuit.js"></script>
<script src="engine.js"></script>

<script type="text/babel">
/* ═══ GATES ════════════════════════════════════════════════════════════════
   Unchanged from circuit_widget.html — gate/component visuals aren't part
   of this read-only-shell pass. New microprocessor-specific visuals (ALU,
   control unit, ...) are future work. */
defineModule('gates', ['engine'], (engine) => {
  'use strict';
  const {
    GATE_DEFS,
    muxGeometry, splitGeometry, bitsRowWidth, inputOutputGeometry, constGeometry,
    BIT_CELL_W, BIT_GAP, BIT_PAD,
    rotationCenter,
  } = engine;

  const FAMILY_FILL = { and:'#fffae3', or:'#e8f5ee', not:'#ede8f7', xor:'#e4eef8', mux: '#fff1e3', seq:'#fce8ee', io:'#fefce8', misc:'#ede8f7' };
  const VIS = {};
  const W=80,H=80,BX=12,YT=20,YB=60,YO=40,BT=6,BB=74;

  // The bar showing the progress for a gate delay, filling in left-to-right
  function PendingBar({pendingStart, delay, value}) {
    const [now, setNow] = React.useState(performance.now());
    React.useEffect(()=>{
      let r; const l=()=>{setNow(performance.now()); r=requestAnimationFrame(l);};
      r=requestAnimationFrame(l); return ()=>cancelAnimationFrame(r);
    }, []);
    const t = delay>0 ? Math.min(1,(now-(pendingStart||now))/delay) : 1;
    return <rect x="20" y="-5" width={40*t} height="5" fill={value ? "var(--high)" : "var(--low)"}/>;
  }

  // Renders a PendingBar above a gate's shape during gate delay
  function pendingBar(comp) {
    return comp.pendingOutputVals && comp.pendingOutputVals[0]!==undefined &&
      <PendingBar pendingStart={comp.pendingOutputStart[0]} delay={comp.delay||0} value={comp.pendingOutputVals[0]}/>;
  }

  // Basic logic gates
  VIS.AND  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} H ${W*.5} a ${(BB-BT)/2} ${(BB-BT)/2} 0 0 1 0 ${BB-BT} H ${BX} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
    </g> };
  VIS.OR   = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.5} ${BB}, ${W-2} ${YO} Q ${W*.5} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
    </g> };
  VIS.NOT  = { w:80,h:40, inputs:[{x:0,y:20}], outputs:[{x:80,y:20}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d="M 12 6 L 60 20 L 12 34 Z" fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx="66" cy="20" r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  VIS.NAND = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} H ${W*.45} a ${(BB-BT)/2} ${(BB-BT)/2} 0 0 1 0 ${BB-BT} H ${BX} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx={W-7} cy={YO} r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  VIS.NOR  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.45} ${BB}, ${W-12} ${YO} Q ${W*.45} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx={W-7} cy={YO} r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  VIS.XOR  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX-6} ${BT} Q ${BX+8} ${YO}, ${BX-6} ${BB}`} fill="none" stroke="var(--ink)" strokeWidth="2"/>
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.5} ${BB}, ${W-2} ${YO} Q ${W*.5} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
    </g> };
  VIS.XNOR = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX-6} ${BT} Q ${BX+8} ${YO}, ${BX-6} ${BB}`} fill="none" stroke="var(--ink)" strokeWidth="2"/>
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.45} ${BB}, ${W-12} ${YO} Q ${W*.45} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx={W-7} cy={YO} r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };

  // MUX's pin locations and shape come from muxGeometry in engine-geometry.js
  // This just draws the mux body, and caches each unique shape
  function buildMuxVis(n, bottom) {
    const geo = muxGeometry(n, bottom ? 'bottom' : 'top');
    return { ...geo,
      body:(f, comp)=><g>
        {pendingBar(comp)}
        <path d={`M ${BX} ${geo.bt} L ${W - BX} ${geo.rt} V ${geo.rb} L ${BX} ${geo.bb} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      </g> };
  }
  const muxVisCache = {};
  function muxVis(n, selectLocation) {
    const count = Math.max(2, Math.min(4, n|0||2));
    const bottom = selectLocation==='bottom';
    const key = count+(bottom?'b':'t');
    return muxVisCache[key] || (muxVisCache[key] = buildMuxVis(count, bottom));
  }
  VIS.MUX = muxVis(2);

  // SPLIT's pin locations and shape come from splitGeometry in engine-geometry.js
  // THis just draws the body (trunk, diagonal, labels) and caches each unique shape
  function buildSplitVis(pinWidths, space, merge) {
    const geo = splitGeometry(pinWidths.length, space, merge ? 'merge' : 'split');
    // Each tap's label is its bit range (or just its bit, if only one) as indices in the array
    let offset = 0;
    const labels = pinWidths.map(width => {
      const lo = offset; offset += width;
      return width>1 ? `${lo}-${offset-1}` : String(lo);
    });
    return { ...geo,
      body:()=><g>
        {/* Invisible fat hit-area to compensate for the low-width body-tea trunk */}
        <rect x="0" y="0" width={geo.w} height={geo.lastY} fill="transparent"/>
        <line x1={geo.trunkX} y1={geo.topY} x2={geo.diagX} y2="0" stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>
        <line x1={geo.trunkX} y1={geo.topY} x2={geo.trunkX} y2={geo.lastY} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>
        {geo.taps.map((p,i)=>(
          <g key={i}>
            <line x1={geo.trunkX} y1={p.y} x2={merge ? geo.trunkX-8 : geo.trunkX+8} y2={p.y} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>
            <text x={merge ? geo.trunkX+6 : geo.trunkX-6} y={p.y+3} textAnchor={merge ? 'start' : 'end'}
                  fontFamily="var(--mono)" fontSize="8" fontWeight="600" fill="var(--ink)" opacity="0.6">{labels[i]}</text>
          </g>
        ))}
      </g> };
  }
  const splitVisCache = {};
  // `n` is either a plain tap count (regular) or an array of per-pin bit widths (custom)
  // both normalize to a pinWidths array so buildSplitVis only ever deals with the array shape
  function splitVis(n, space, type) {
    const pinWidths = Array.isArray(n)
      ? n.map(w=>Math.max(1,Math.min(32,w|0||1)))
      : Array(Math.max(2, Math.min(32, n|0||2))).fill(1);
    const sp = Math.max(1, Math.min(16, space|0||1));
    const merge = type==='merge';
    const key = pinWidths.join(',')+'_'+sp+'_'+(merge?'m':'s');
    return splitVisCache[key] || (splitVisCache[key] = buildSplitVis(pinWidths, sp, merge));
  }
  VIS.SPLIT = splitVis(2, 1, 'split');

  // Single-bit INPUT
  VIS.INPUT = { w:60,h:40, inputs:[], outputs:[{x:60,y:20}],
    body:(f,comp)=>{
      const on=comp.state.value;
      return <g>
        <rect x="4" y="4" width="52" height="32" rx="16" fill={on?'#fef3c7':'#f3f3f1'} stroke="var(--ink)" strokeWidth="2"/>
        {/* data-knob marks switch's knob as the click-to-toggle target */}
        <circle cx={on?40:20} cy="20" r="11" fill="white" stroke="var(--ink)" strokeWidth="1.5" data-knob="1" style={{cursor:'pointer'}}/>
      </g>;
    },
    // Rendered directly by GateBody instead of through vis.body
    // since many facing:'left' INPUTs can become expensive with
    // unmirrorText's recursive walk-and-clone cost across its whole body
    mirrorTexts:(comp)=>{
      const on=comp.state.value;
      return [
        {x:on?18:38, y:24, anchor:'middle', fontSize:11, opacity:0.45, text:on?'1':'0'},
        {x:-15, y:26, anchor:'end', fontSize:16, opacity:0.8, text:comp.label},
      ];
    },
  };

  // Single-bit OUTPUT
  VIS.OUTPUT = { w:40,h:40, inputs:[{x:0,y:20}], outputs:[],
    body:(f,comp)=>{
      const on=comp.inputVals[0];
      return <g>
        {on?<circle cx="22" cy="20" r="20" fill="#fef3c7" opacity="0.55"/>:null}
        <circle cx="22" cy="20" r="13" fill={on?'#fde68a':'#f3f3f1'} stroke="var(--ink)" strokeWidth="2"/>
        <path d="M 17 26 L 17 30 L 27 30 L 27 26" fill="none" stroke="var(--ink)" strokeWidth="1.5" strokeLinecap="round"/>
        {on?<g stroke="#d97706" strokeWidth="1.5" strokeLinecap="round">
          <line x1="22" y1="3"  x2="22" y2="6"/><line x1="37" y1="20" x2="40" y2="20"/>
          <line x1="4"  y1="20" x2="7"  y2="20"/><line x1="33" y1="9"  x2="35" y2="7"/>
          <line x1="11" y1="9"  x2="9"  y2="7"/>
        </g>:null}
      </g>;
    },
    mirrorTexts:(comp)=>{
      const on=comp.inputVals[0];
      return [
        {x:55, y:26, anchor:'start', fontSize:16, opacity:0.8, text:comp.label},
        {x:22, y:24, anchor:'middle', fontSize:11, opacity:0.45, text:on?'1':'0'},
      ];
    },
  };

  // Multi-bit INPUT/OUTPUT
  // One cell per bit
  const BIT_CELL_H=24; // BIT_CELL_W/BIT_GAP/BIT_PAD (and bitsRowWidth) come from engine
  function BitCells({ n, value, editable }) {
    const cy=20;
    return Array.from({length:n},(_,i)=>{
      const bit=n-1-i;
      const on=(value>>>bit)&1;
      const cx=BIT_PAD+i*(BIT_CELL_W+BIT_GAP);
      return <g key={bit}>
        <rect x={cx} y={cy-BIT_CELL_H/2} width={BIT_CELL_W} height={BIT_CELL_H} rx="4"
              data-bit={editable?bit:undefined}
              fill={on?'#fef3c7':'#f3f3f1'} stroke="var(--low)" strokeWidth="1.5"
              style={editable?{cursor:'pointer'}:undefined}/>
        <text x={cx+BIT_CELL_W/2} y={cy+4} textAnchor="middle" fontFamily="var(--mono)" fontSize="12"
              fontWeight="600" fill="var(--ink)" opacity="0.55" pointerEvents="none">{on?'1':'0'}</text>
      </g>;
    });
  }
  // One cell per hex digit (4 bits/cell)
  // Clicking on an editable cell increments the nibble
  function HexCells({ n, value, editable }) {
    const cy=20, text=regValueText(value, n, 'hex'), digits=text.length;
    return text.split('').map((ch,i)=>{
      const shift=(digits-1-i)*4;
      const cx=BIT_PAD+i*(BIT_CELL_W+BIT_GAP);
      return <g key={i}>
        <rect x={cx} y={cy-BIT_CELL_H/2} width={BIT_CELL_W} height={BIT_CELL_H} rx="4"
              data-shift={editable?shift:undefined}
              fill="#f3f3f1" stroke="var(--low)" strokeWidth="1.5"
              style={editable?{cursor:'pointer'}:undefined}/>
        <text x={cx+BIT_CELL_W/2} y={cy+4} textAnchor="middle" fontFamily="var(--mono)" fontSize="12"
              fontWeight="600" fill="var(--ink)" opacity="0.55" pointerEvents="none">{ch}</text>
      </g>;
    });
  }
  // Tagged data-stable so unmirrorText, which would counter-mirror every text it finds in a left-facing component,
  // will ignore BitCells/HexCells which need to maintain a MSB-leftmost/LSB-rightmost order no matter the orientation
  function stableBlock(comp, w, children) {
    return comp.facing==='left'
      ? <g data-stable="true" transform={`translate(${w} 0) scale(-1 1)`}>{children}</g>
      : <g>{children}</g>;
  }

  // Cell count and thus width differs based on hex mode or bin mode
  // Thus cached per bitWidth and mode
  function buildInputVis(n, hex) {
    const {w, h, inputs, outputs} = inputOutputGeometry(n, hex ? 'hex' : 'bin', false);
    return { w, h, inputs, outputs,
      body:(f,comp)=><g>
        <rect x="2" y="4" width={w-4} height="32" rx="8" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
        {stableBlock(comp, w, hex ? HexCells({n, value:comp.state.value||0, editable:true}) : BitCells({n, value:comp.state.value||0, editable:true}))}
      </g>,
      mirrorTexts:(comp)=>[{x:-15, y:26, anchor:'end', fontSize:16, opacity:0.8, text:comp.label}],
    };
  }
  // The input pin sits at x=0 regardless, so resizing never moves a wire
  function buildOutputVis(n, hex) {
    const {w, h, inputs, outputs} = inputOutputGeometry(n, hex ? 'hex' : 'bin', true);
    return { w, h, inputs, outputs,
      body:(f,comp)=><g>
        <rect x="2" y="4" width={w-4} height="32" rx="8" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
        {stableBlock(comp, w, hex ? HexCells({n, value:comp.inputVals[0]||0}) : BitCells({n, value:comp.inputVals[0]||0, editable:false}))}
      </g>,
      mirrorTexts:(comp)=>[{x:w+15, y:26, anchor:'start', fontSize:16, opacity:0.8, text:comp.label}],
    };
  }
  const inputVisCache={}, outputVisCache={};
  function inputVis(bw, mode) {
    const n=Math.max(1,Math.min(32,bw|0||1));
    if (n<=1) return VIS.INPUT;
    const hex = mode==='hex';
    const key = n+(hex?'h':'b');
    return inputVisCache[key] || (inputVisCache[key]=buildInputVis(n, hex));
  }
  function outputVis(bw, mode) {
    const n=Math.max(1,Math.min(32,bw|0||1));
    if (n<=1) return VIS.OUTPUT;
    const hex = mode==='hex';
    const key = n+(hex?'h':'b');
    return outputVisCache[key] || (outputVisCache[key]=buildOutputVis(n, hex));
  }


  // Single-bit CONST
  VIS.CONST = { w:40,h:40, inputs:[], outputs:[{x:40,y:20}],
    body:(f,comp)=>{
      const on=comp.state.value;
      return <g>
        <circle cx="18" cy="20" r="13" fill={on==1?'#fde68a':'#f3f3f1'} stroke="var(--ink)" strokeWidth="2"/>
        <text x="18" y="26" fontFamily="var(--mono)" fontSize="16" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity="0.8">{comp.state.value}</text>
      </g>;
    }
  };

  // Multi-bit CONST, differentiated from input/output by displaying a single string rather than cells
  // Digit count and thus width depends only on n/hex, so width is calculated here
  function buildConstVis(n, hex) {
    const {w, h, inputs, outputs} = constGeometry(n, hex ? 'hex' : 'bin');
    return { w, h, inputs, outputs,
      body:(f,comp)=>{
        const text = regValueText(comp.state.value||0, n, hex?'hex':'bin');
        return <g>
          <rect x="2" y="7" width={w-4} height="26" rx="10" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
          <text x={w/2} y="26" fontFamily="var(--mono)" fontSize="16" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity="0.8">{text}</text>
        </g>;
      }
    };
  }
  const constVisCache={};
  function constVis(bw, mode) {
    const n=Math.max(1,Math.min(32,bw|0||1));
    if (n<=1) return VIS.CONST;
    const hex = mode==='hex';
    const key = n+(hex?'h':'b');
    return constVisCache[key] || (constVisCache[key]=buildConstVis(n, hex));
  }

  VIS.CLOCK = { w:60,h:40, inputs:[], outputs:[{x:60,y:20}],
    body:(f,comp)=>{
      const on=comp.state.value, paused=comp.state.paused;
      return <g>
        <rect x="4" y="4" width="52" height="32" rx="8" fill={paused?'#f3f3f1':'#fefce8'} stroke="var(--ink)" strokeWidth="2"/>
        {paused ? <>
          <rect x="20" y="13" width="6" height="14" rx="2" fill="var(--ink)" opacity="0.3"/>
          <rect x="30" y="13" width="6" height="14" rx="2" fill="var(--ink)" opacity="0.3"/>
        </> : <path d="M 12 28 L 18 28 L 18 14 L 28 14 L 28 28 L 38 28 L 38 14 L 44 14"
              fill="none" stroke={on?'var(--high)':'var(--ink)'}
              strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
      </g>;
    }
  };

  VIS.SEVEN = { w:W*1.25, h:H*1.75, inputs:[{x:W*0.25,y:0,dir:'up'}, {x:W*0.5,y:0,dir:'up'}, {x:W*0.75,y:0,dir:'up'}, {x:W,y:0,dir:'up'}, {x:W*0.25,y:H*1.75,dir:'down'}, {x:W*0.5,y:H*1.75,dir:'down'}, {x:W*0.75,y:H*1.75,dir:'down'}], outputs:[],
    body:(f,comp)=><g>
        <rect x="10" y="10" width="80" height="120" rx="7" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
        <rect x="27" y="16" width="46" height="8" fill={comp.inputVals[2]?'#ff3333':'#aeaeae'}/>
        <rect x="27" y="66" width="46" height="8" fill={comp.inputVals[0]?'#ff3333':'#aeaeae'}/>
        <rect x="27" y="116" width="46" height="8" fill={comp.inputVals[5]?'#ff3333':'#aeaeae'}/>
        <rect x="16" y="22" width="8" height="46" fill={comp.inputVals[1]?'#ff3333':'#aeaeae'}/>
        <rect x="16" y="72" width="8" height="46" fill={comp.inputVals[4]?'#ff3333':'#aeaeae'}/>
        <rect x="76" y="22" width="8" height="46" fill={comp.inputVals[3]?'#ff3333':'#aeaeae'}/>
        <rect x="76" y="72" width="8" height="46" fill={comp.inputVals[6]?'#ff3333':'#aeaeae'}/>
      </g>
  };

  function ffRect(f,h){return<rect x="6" y="6" width="68" height={h-12} rx="7" fill={f} stroke="var(--ink)" strokeWidth="2"/>;}
  const ffTxt=(x,y,t)=><text x={x} y={y} fontFamily="var(--mono)" fontSize="12" fill="var(--ink)">{t}</text>;
  const ffSub=(t)=><text x="40" y="70" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">{t}</text>;

  VIS.DFF  = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}],            outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,80)}{ffTxt(14,24,'D')}{ffTxt(14,64,'▷')}{ffTxt(62,44,'Q')}{ffSub('D')}</g>};
  VIS.TFF  = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}],            outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,80)}{ffTxt(14,24,'T')}{ffTxt(14,64,'▷')}{ffTxt(62,44,'Q')}{ffSub('T')}</g>};
  VIS.SRFF = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}],            outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,80)}{ffTxt(14,24,'S')}{ffTxt(14,64,'R')}{ffTxt(62,44,'Q')}{ffSub('SR')}</g>};
  VIS.JKFF = {w:80,h:120, inputs:[{x:0,y:20},{x:0,y:60},{x:0,y:100}],outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,120)}{ffTxt(14,24,'J')}{ffTxt(14,64,'K')}{ffTxt(14,104,'▷')}{ffTxt(62,44,'Q')}<text x="40" y="110" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">JK</text></g>};

  // REG's D input and Q output are the only pins that scale with bitWidth
  // Only the little value readout above the box resizes, the box itself and its pin layout stay fixed
  function regValueText(value, bitWidth, mode) {
    const v = (value||0) >>> 0;
    if (mode === 'hex') return v.toString(16).toUpperCase().padStart(Math.ceil(bitWidth/4), '0');
    return v.toString(2).padStart(bitWidth, '0');
  }
  const REG_CHAR_W=7, REG_VAL_PAD=6;
  VIS.REG =  {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:40},{x:0,y:60},{x:40,y:84,dir:'down'}], outputs:[{x:80,y:40}],
    body:(f,comp)=>{
      const bw=comp.bitWidth||1, text=regValueText(comp.state.q, bw, comp.displayMode||'bin');
      const valW=Math.max(12, text.length*REG_CHAR_W + REG_VAL_PAD*2);
      return <g>
        {pendingBar(comp)}
        {ffRect(f,80)}
        {ffTxt(10,24,'D')}
        {ffTxt(10,44,'EN')}
        {ffTxt(10,64,'▷')}
        {ffTxt(36,70,'R')}
        {ffTxt(64,44,'Q')}
        <rect x={40-valW/2} y="-14" width={valW} height="16" rx="2" fill="var(--low)" opacity="0.75"/>
        <text x="40" y="-2" fontFamily="var(--mono)" fontSize="11" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity="0.45">{text}</text>
        <text x="40" y="44" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">REG</text>
      </g>;
    }};

  VIS.SHFT = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
      body:(f,comp)=>{
        return <g>
          {ffRect(f,80)}
          <text x="40" y="44" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">SHIFT</text>
          {comp.shiftMode === "right" ? <path d="M 46 65 L 40 61 L 40 63 L 34 63 L 34 67 L 40 67 L 40 69 Z" fill="var(--ink)" opacity="0.85"/>
            : comp.shiftMode === "arith" ? <g><path d="M 46 65 L 40 61 L 40 63 L 38 63 L 38 67 L 40 67 L 40 69 Z" fill="var(--ink)" opacity="0.85"/><path d="M 37 63 L 37 67 L 34 67 L 34 63 Z" fill="var(--ink)" opacity="0.85"/></g>
            : <path d="M 34 65 L 40 61 L 40 63 L 46 63 L 46 67 L 40 67 L 40 69 Z" fill="var(--ink)" opacity="0.85"/>
          }

        </g>;
      }};

  VIS.EXTND = {w:80,h:80,  inputs:[{x:0,y:40}], outputs:[{x:80,y:40}],
      body:(f,comp)=>{
        return <g>
          {ffRect(f,80)}
          <text x="40" y="44" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">EXTEND</text>
          <path d="M 32 65 L 37 61 L 37 63 L 43 63 L 43 61 L 48 65 L 43 69 L 43 67 L 37 67 L 37 69 Z" fill="var(--ink)" opacity="0.85"/>
        </g>;
      }};

  // Draws a little line between the pin and a component's body
  // Each input usually points left and output right, but pins can override this
  // with `dir` ('left'|'right'|'up'|'down')
  const PIN_DIR_VEC = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] };
  function pinStub(p, defaultDir) {
    const [dx,dy] = PIN_DIR_VEC[p.dir||defaultDir];
    return { x1:p.x-dx*12, y1:p.y-dy*12, x2:p.x, y2:p.y };
  }

  // For facing 'left' components (excluding INPUT/OUTPUT), unmirrors the would-be facing-left text
  // Recursively searches the body's element tree for <text>s, ignoring real components like PendingBar since they don't exist until render
  // textAnchor position is also flipped so that labels anchored to grow rightward will grow leftward when mirrored
  function unmirrorText(node) {
    if (Array.isArray(node)) return node.map(unmirrorText);
    if (!React.isValidElement(node)) return node;
    // Already self-corrected (see stableBlock)
    if (node.props?.['data-stable']) return node;
    if (node.type === 'text') {
      const x = node.props.x || 0;
      const anchor = node.props.textAnchor;
      const flipped = anchor==='start' ? 'end' : anchor==='end' ? 'start' : anchor;
      // Carries the original element's key onto this wrapper
      return <g key={node.key} transform={`translate(${x} 0) scale(-1 1) translate(${-x} 0)`}>
        {React.cloneElement(node, {textAnchor: flipped})}
      </g>;
    }
    if ((typeof node.type === 'string' || node.type === React.Fragment) && node.props?.children != null) {
      const processed = unmirrorText(node.props.children);
      // Spread array children back into positional args — passing a bare
      // array as the sole child triggers React's "list needs keys" check
      // (it assumes a .map() result), which the original static JSX
      // children list never hit
      return Array.isArray(processed)
        ? React.cloneElement(node, {}, ...processed)
        : React.cloneElement(node, {}, processed);
    }
    return node;
  }

  // Returns the SVG for this component
  function visForComp(comp) {
    if (comp.kind==='INPUT') return inputVis(comp.bitWidth, comp.displayMode);
    if (comp.kind==='OUTPUT') return outputVis(comp.bitWidth, comp.displayMode);
    if (comp.kind==='CONST') return constVis(comp.bitWidth, comp.displayMode);
    if (comp.kind==='MUX') return muxVis(comp.muxInputs, comp.muxSelectLocation);
    if (comp.kind==='SPLIT') {
      const custom = comp.layout==='custom' && Array.isArray(comp.pinBits) && comp.pinBits.length;
      return splitVis(custom ? comp.pinBits : comp.bits, comp.space, comp.splitType);
    }
    return VIS[comp.kind];
  }

  function GateBody({ comp }) {
    const def=GATE_DEFS[comp.kind], vis=visForComp(comp);
    if (!vis) return null;
    const fill=FAMILY_FILL[def.family]||'#fff';
    const mirrored = comp.facing==='left';
    const body = <>
      {vis.body(fill,comp)}
      {['AND','OR','NAND','NOR','XOR','XNOR','MUX'].includes(comp.kind)&&
        <text x={vis.w/2+2} y={vis.h/2+4} textAnchor="middle" fontFamily="var(--mono)" fontSize="10" fontWeight="600" fill="var(--ink)" opacity="0.35" pointerEvents="none">{def.label}</text>}
    </>;
    const rc = rotationCenter(vis);
    return <g transform={mirrored
                          ? `translate(${vis.w} 0) scale(-1 1)`
                          : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${rc.cx} ${rc.cy})`}>
      {vis.inputs.map((p,i)=>{if(p.noStub) return null; const s=pinStub(p,'left');return <line key={'i'+i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>;})}
      {vis.outputs.map((p,i)=>{if(p.noStub) return null; const s=pinStub(p,'right');return <line key={'o'+i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>;})}
      {mirrored ? unmirrorText(body) : body}
      {/* Same glyphs-upright trick unmirrorText uses, but authored directly
          for these known, fixed-position texts instead of discovered by
          recursively walking and cloning the whole body every frame — see
          vis.mirrorTexts on VIS.INPUT/VIS.OUTPUT/buildInputVis/
          buildOutputVis, the kinds dense enough (one per bus bit, often
          all facing left for a tidy layout) for that walk's cost to
          actually add up frame over frame. When facing isn't 'left'
          there's nothing to correct — GateBody's outer transform is a
          rotation there, not a mirror — so the text renders plain. */}
      {vis.mirrorTexts && vis.mirrorTexts(comp).map((t,i)=>{
        const text = <text x={t.x} y={t.y}
              textAnchor={mirrored ? (t.anchor==='start'?'end':t.anchor==='end'?'start':t.anchor) : t.anchor}
              fontFamily="var(--mono)" fontSize={t.fontSize} fontWeight={t.fontWeight||600}
              fill="var(--ink)" opacity={t.opacity}>{t.text}</text>;
        return mirrored
          ? <g key={i} transform={`translate(${t.x} 0) scale(-1 1) translate(${-t.x} 0)`}>{text}</g>
          : <React.Fragment key={i}>{text}</React.Fragment>;
      })}
    </g>;
  }

  // Registers a saved circuit as a placeable gate
  // The visual is a simple white rounded box sized to fit its inputs (left) / outputs (right)
  // Simulated by running a private nested circuit to settling on every compute() call
  const CUSTOM_PIN_MARGIN = 20, CUSTOM_PIN_GAP = 40;
  function customPinYs(n, h) {
    if (n <= 1) return [h/2];
    const usable = h - CUSTOM_PIN_MARGIN*2;
    return Array.from({length:n}, (_,i)=>CUSTOM_PIN_MARGIN + usable*i/(n-1));
  }
  // Greedy word-wrap for the gate-name label
  // A single word longer than the line is hard-broken
  function wrapLabel(text, maxChars) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur+' '+w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; } else { cur = test; }
    }
    if (cur) lines.push(cur);
    return lines.flatMap(line => {
      if (line.length <= maxChars) return [line];
      const chunks = [];
      for (let i=0;i<line.length;i+=maxChars) chunks.push(line.slice(i,i+maxChars));
      return chunks;
    });
  }
  function registerCustomGate(name, data) {
    const kindKey = 'CUSTOM:'+name;
    const tmp = engine.createCircuit();
    tmp.load(data);
    // Ordered by y so the vis's pin stack matches how the inputs/outputs
    // outputs were laid out top-to-bottom in the saved circuit
    const ins  = [...tmp.ioComponents.values()].filter(c=>c.kind==='INPUT').sort((a,b)=>a.y-b.y);
    const outs = [...tmp.ioComponents.values()].filter(c=>c.kind==='OUTPUT').sort((a,b)=>a.y-b.y);
    const inIds=ins.map(c=>c.ioId), outIds=outs.map(c=>c.ioId);
    const inLabels=ins.map(c=>c.label), outLabels=outs.map(c=>c.label);
    // Each port's width comes straight off the INPUT/OUTPUT it was built from
    // Widths recorded per-pin on the def itself since pinBitWidthAt (engine-core)
    // has no other per-instance place to read a custom gate's widths from
    const inWidths=ins.map(c=>c.bitWidth||1), outWidths=outs.map(c=>c.bitWidth||1);
    // Whether this gate's own output can drift over time even while its inputVals stay fixed
    // Applies if its sub-circuit contains a live CLOCK, directly or recursively
    // Used by step()'s dirty-check
    const alwaysRecompute = [...tmp.components.values()].some(c => {
      const d = GATE_DEFS[c.kind];
      return d && d.alwaysRecompute;
    });

    const h = Math.max(H, CUSTOM_PIN_MARGIN*2 + (Math.max(inIds.length,outIds.length,1)-1)*CUSTOM_PIN_GAP);
    const inYs = customPinYs(inIds.length, h), outYs = customPinYs(outIds.length, h);

    const nameLines = wrapLabel(name, Math.max(3, Math.floor((W-16)/6)));
    const nameLineH = 12;
    const nameStartY = h/2 - (nameLines.length-1)*nameLineH/2 + 4;

    GATE_DEFS[kindKey] = {
      kind:kindKey, label:name, inputs:inIds.length, outputs:outIds.length, family:'custom',
      inWidths, outWidths, alwaysRecompute,
      compute(inputVals, state) {
        if (!state.sub) { state.sub = engine.createCircuit(); state.sub.load(data); }
        const sub = state.sub;
        // markComponentDirty: an INPUT has zero inputVals, so step()'s dirty-check
        // would otherwise see this port as unchanged on every call
        inIds.forEach((ioId,i)=>{ const c=sub.ioComponents.get(ioId); if (c) { c.state.value = inputVals[i]||0; sub.markComponentDirty(c.id); } });
        for (let i=0;i<10;i++) sub.step(performance.now(), 0, true);
        return outIds.map(ioId=>{ const c=sub.ioComponents.get(ioId); return c ? (c.inputVals[0]||0) : 0; });
      }
    };

    const pinLabel = (lbl, w) => w>1 ? `${lbl}` : lbl;

    VIS[kindKey] = {
      w:W, h,
      inputs: inYs.map(y=>({x:0,y})),
      outputs: outYs.map(y=>({x:W,y})),
      body:(f,comp)=><g>
        <rect x="0" y="0" width={W} height={h} rx="6" fill="#fff" stroke="var(--ink)" strokeWidth="2"/>
        <text x={W/2} textAnchor="middle" fontFamily="var(--mono)" fontSize="10" fontWeight="600" fill="var(--ink)" opacity="0.6">
          {nameLines.map((line,i)=><tspan key={i} x={W/2} y={nameStartY+i*nameLineH}>{line}</tspan>)}
        </text>
        {inLabels.map((lbl,i)=><text key={'i'+i} x="8" y={inYs[i]+4} fontFamily="var(--mono)" fontSize="10" fill="var(--ink)" opacity="0.7">{pinLabel(lbl,inWidths[i])}</text>)}
        {outLabels.map((lbl,i)=><text key={'o'+i} x={W-8} y={outYs[i]+4} textAnchor="end" fontFamily="var(--mono)" fontSize="10" fill="var(--ink)" opacity="0.7">{pinLabel(lbl,outWidths[i])}</text>)}
      </g>
    };

    return kindKey;
  }

  return { GATE_VIS: VIS, FAMILY_FILL, GateBody, registerCustomGate, visForComp };
});
</script>

<script type="text/babel">
/* ═══ CANVAS (read-only) ══════════════════════════════════════════════════
   Fork of circuit_widget.html's canvas module: pan, zoom, and click-to-
   select (component or wire segment) still work exactly as before, but
   every structural edit — add/move/delete component, add/move/delete wire,
   wire/branch/waypoint dragging, copy/paste, and toggling an INPUT/CLOCK's
   simulated value by clicking it — has been removed, along with the four
   properties panels (nothing here can be edited, so there's nothing to
   show). See the plan this file was built from for the line-by-line
   mapping back to circuit_widget.html's canvas module. */
defineModule('canvas', ['state', 'engine', 'gates'], (state, engine, gates) => {
'use strict';
const { useState, useEffect, useRef, useCallback } = React;
const { GateBody, visForComp } = gates;
const {
  terminalCoords, wireKnots, wirePath,
  sampleWire, splitWirePathAtSegment, splitWirePath, wireKnotDistances, findNearestWirePoint,
  pinAbs, wireDelayForLength, rotationCenter,
} = engine;

// A selected wire segment is identified by a composite string distinct from any component id
// so it can travel through the same single selectedId/onSelect prop components already use without the two ever colliding
const segSelId = (wireId, segIndex) => `${wireId}#seg${segIndex}`;

const GRID = 20;

function Canvas({ circuit, onSelect, selectedId }) {
  const svgRef = useRef(null);
  const [view, setView] = useState({x:0,y:0,zoom:1});
  const [isPanning, setIsPanning] = useState(false);

  const panRef  = useRef(null); // {sx,sy,vx,vy}
  const viewRef = useRef(view);
  useEffect(()=>{viewRef.current=view;},[view]);

  // Re-render every frame for live simulation display
  const [, tick] = useState(0);
  useEffect(()=>{let r; const l=()=>{tick(n=>n+1);r=requestAnimationFrame(l);}; r=requestAnimationFrame(l); return()=>cancelAnimationFrame(r);},[]);

  const screenToWorld = useCallback((sx,sy)=>{
    const r=svgRef.current.getBoundingClientRect(),v=viewRef.current;
    return{x:(sx-r.left)/v.zoom-v.x, y:(sy-r.top)/v.zoom-v.y};
  },[]);

  // Global mouse move / up — pan only, nothing else on the canvas is editable
  useEffect(()=>{
    const onMove=(e)=>{
      if (panRef.current) {
        const p=panRef.current;
        setView(v=>({...v, x:p.vx+(e.clientX-p.sx)/v.zoom, y:p.vy+(e.clientY-p.sy)/v.zoom}));
      }
    };
    const onUp=()=>{
      panRef.current=null;
      setIsPanning(false);
    };
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[]);

  // Scroll to zoom
  useEffect(()=>{
    const el = svgRef.current;
    if (!el) return;
    const onWheel=(e)=>{
      e.preventDefault();
      const r=el.getBoundingClientRect(),v=viewRef.current;
      const cx=(e.clientX-r.left)/v.zoom-v.x, cy=(e.clientY-r.top)/v.zoom-v.y;
      const nz=Math.max(.3,Math.min(2.5,v.zoom*Math.exp(-e.deltaY*.0015)));
      setView(()=>({x:(e.clientX-r.left)/nz-cx, y:(e.clientY-r.top)/nz-cy, zoom:nz}));
    };
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[]);

  const onMouseDownBg=(e)=>{
    if(e.button!==0&&e.button!==1)return;
    if(e.target!==svgRef.current&&!e.target.classList?.contains('canvas-bg'))return;
    panRef.current={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    setIsPanning(true); onSelect(null);
  };

  const onCompSelect=(e,comp)=>{
    e.stopPropagation(); if(e.button!==0)return;
    onSelect(comp.id);
  };
  // Selects whichever segment of the wire the click landed nearest to —
  // same segSelId scheme circuit_widget.html's onWireEdgeDown uses, minus
  // everything about starting a branch/segment drag.
  const onWireSelect=(e,wire)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    const nearest=findNearestWirePoint(wire,w.x,w.y,circuit);
    onSelect(segSelId(wire.id, nearest.index));
  };

  const components=[...circuit.components.values()];
  const wires=[...circuit.wires.values()];
  const tx=view.x*view.zoom, ty=view.y*view.zoom;

  // Per-wire signal-arrival info, computed once and shared by the wire
  // path/particle rendering below AND the separate waypoint-handle pass
  // further down, which doesn't otherwise have easy access to this wire's
  // shape or pending state — so a waypoint, junction, or free endpoint
  // lights up the moment the signal actually reaches IT, not whenever the
  // whole wire finishes settling. `distances[i]` is knot i's (wireKnots
  // order: from, then every waypoint, then to) distance from `from`, so a
  // waypoint at index `idx` in `wire.points` sits at `distances[idx+1]`.
  const wireProgress = new Map();
  for (const w of wires) {
    const a = terminalCoords(w.from,circuit), b = terminalCoords(w.to,circuit);
    const distances = wireKnotDistances(a.x,a.y,b.x,b.y,w.points||[]);
    const wireLen = distances[distances.length-1];
    const pending = !w.bitMismatch && typeof w.pendingValue!=='undefined';
    let pendingT=0, wireDelay=0;
    if (pending) {
      // wireOwnDelay: in component mode, a branch commits sooner than the
      // flat wireDelayForLength(wireLen) would suggest — it gets credit
      // for however much of its budget its own parent already spent
      // reaching the branchpoint (see engine-circuit.js). Animating the
      // pulse against the un-credited flat delay would have it crawl at
      // the wrong (slower) rate and then jump the rest of the way instantly
      // the moment the wire actually commits underneath it.
      wireDelay = circuit.wireOwnDelay(w, wireDelayForLength(wireLen, state.widgetState.delayMs));
      pendingT = Math.min(1, (performance.now()-(w.pendingStart||performance.now()))/wireDelay);
    }
    wireProgress.set(w.id, {
      pending, pendingT, wireDelay, wireLen, distances,
      reachedDist: pendingT*wireLen,
      value: w.value, pendingValue: w.pendingValue,
    });
  }
  // Whether the point `dist` away from a wire's own `.from` is CURRENTLY
  // showing as high — the whole wire's settled value normally, or, mid-
  // transition, whichever side of the signal's current position it falls
  // on (see splitWirePathAtSegment/splitWirePath — whichever is active for
  // the current propagationStyle — which do the same thing for the wire's
  // own drawn path).
  const isWireHighAt = (progress, dist) =>
    progress.pending ? (dist<=progress.reachedDist ? progress.pendingValue>0 : progress.value>0)
                      : progress.value>0;

  return <svg ref={svgRef} className="canvas"
       style={{width:'100%',height:'100%',cursor:isPanning?'grabbing':'default',background:'transparent'}}
       onMouseDown={onMouseDownBg}
       onContextMenu={e=>e.preventDefault()}>
    <defs>
      <pattern id="grid-dots" x="0" y="0" width={GRID} height={GRID} patternUnits="userSpaceOnUse">
        <circle cx={GRID/2} cy={GRID/2} r="1" fill="var(--grid)"/>
      </pattern>
    </defs>
    <rect className="canvas-bg" x="-5000" y="-5000" width="10000" height="10000"
          fill="url(#grid-dots)"
          transform={`translate(${tx},${ty}) scale(${view.zoom})`}/>

    <g transform={`translate(${tx},${ty}) scale(${view.zoom})`}>
      {/* Wires */}
      {wires.map(w=>{
        const a=terminalCoords(w.from,circuit), b=terminalCoords(w.to,circuit);
        const pts=w.points||[];
        const path=wirePath(a.x,a.y,b.x,b.y,pts);
        const high=w.value>0;
        const mismatch=w.bitMismatch;
        // A wire mid-transition lights up as the signal actually reaches each point along it
        // pending/wireDelay/pendingT come from wireProgress (above), shared with the free-endpoint/waypoint lighting
        // and the traveling InflightPulse dot below so all of them track the same progress
        const progress = wireProgress.get(w.id);
        const {pending, wireDelay, pendingT} = progress;
        const split = pending
          ? (state.widgetState.propagationStyle==='discrete'
              ? splitWirePathAtSegment(a.x,a.y,b.x,b.y,pts,pendingT)
              : splitWirePath(a.x,a.y,b.x,b.y,pts,pendingT))
          : null;
        // Which of this wire's segments (if any) selectedId names
        const selPrefix = w.id+'#seg';
        const selSeg = selectedId && selectedId.startsWith(selPrefix) ? Number(selectedId.slice(selPrefix.length)) : null;
        const selKnots = selSeg!=null ? wireKnots(a.x,a.y,b.x,b.y,pts) : null;
        const selA = selKnots && selKnots[selSeg], selB = selKnots && selKnots[selSeg+1];
        return <g key={w.id}>
          {/* Selection bounding box, padded around the selected segment*/}
          {selA && selB && <rect
                x={Math.min(selA.x,selB.x)-8} y={Math.min(selA.y,selB.y)-8}
                width={Math.abs(selB.x-selA.x)+16} height={Math.abs(selB.y-selA.y)+16}
                rx="6" fill="none" stroke="var(--ink)" strokeWidth="1.5"
                strokeDasharray="4 3" opacity="0.35"/>}
          {/* Shadow */}
          <path d={path} fill="none" stroke="var(--ink)" strokeWidth="3.5"
                strokeLinejoin="round" strokeLinecap="round" opacity="0.07"/>
          {/* Signal color — red instead of low/high when the pins on either end disagree on bit width
              Mid-transition (split!=null), drawn as one on stroke and one off stroke instead of one*/}
          {split
            ? <>
                <path d={split.before} fill="none" stroke={w.pendingValue>0?'var(--high)':'var(--low)'}
                      strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                <path d={split.after} fill="none" stroke={high?'var(--high)':'var(--low)'}
                      strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
              </>
            : <path d={path} fill="none"
                    stroke={mismatch?'var(--err)':(high?'var(--high)':'var(--low)')}
                    strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"
                    strokeDasharray={mismatch?'5 4':undefined}
                    style={{transition:'stroke 100ms ease'}}/>}
          {/* Fat hit target — click to select the nearest segment */}
          <path d={path} fill="none" stroke="transparent" strokeWidth="16"
                style={{cursor:'pointer'}}
                onMouseDown={e=>onWireSelect(e,w)}/>
          {/* Particles, confined to whichever part of the wire is actually high*/}
          {pending
            ? (w.pendingValue>0
                ? <ParticleStream a={a} b={b} pts={pts} range={[0,pendingT]}/>
                : high && <ParticleStream a={a} b={b} pts={pts} range={[pendingT,1]}/>)
            : high && <ParticleStream a={a} b={b} pts={pts}/>}
          {/* In-flight pulse: under "discrete" propagationStyle, this runs a bit ahead of the segment coloring above,
              which only ever stops at a real corner, while under "continuous" the two always agree exactly */}
          {pending&&<InflightPulse a={a} b={b} pts={pts} pendingValue={w.pendingValue}
                                pendingStart={w.pendingStart} delayMs={wireDelay}/>}
          {/* Free endpoint handles: purely visual here (light up with their wire like a pin does) —
              nothing to drag or delete in a read-only view.
              `from` sits at distance 0 (where the signal originates) and `to` at the full wireLen */}
          {!w.from.compId&&<circle cx={a.x} cy={a.y} r="6"
                    fill={isWireHighAt(progress,0)?'var(--high)':'white'}
                    stroke="var(--border-md)" strokeWidth="1.5"
                    style={{transition:'fill 100ms ease'}}/>}
          {!w.to.compId&&<circle cx={b.x} cy={b.y} r="6"
                    fill={isWireHighAt(progress,progress.wireLen)?'var(--high)':'white'}
                    stroke="var(--border-md)" strokeWidth="1.5"
                    style={{transition:'fill 100ms ease'}}/>}
        </g>;
      })}

      {/* Waypoint handles: a separate pass over every wire, rendered over every wire's free-endpoint handles.
          Purely visual here — every corner lights up the same way a pin does: bg when idle, --high when its host wire carries a signal */}
      {wires.map(w=>(w.points||[]).map((pt,idx)=>{
        // Lights up the moment the signal reaches this corner, same as the free endpoints and the wire's path
        const progress = wireProgress.get(w.id);
        const pointHigh = isWireHighAt(progress, progress.distances[idx+1]);
        return <circle key={w.id+'_wp'+idx} cx={pt.x} cy={pt.y} r="5"
                fill={pointHigh?'var(--high)':'var(--bg)'}
                stroke="var(--border-md)" strokeWidth="1.5"
                style={{transition:'fill 100ms ease'}}/>;
      }))}

      {/* Components */}
      {components.map(comp=>{
        const vis=visForComp(comp),isSel=selectedId===comp.id;
        return <g key={comp.id} transform={`translate(${comp.x},${comp.y})`}
                  onMouseDown={e=>onCompSelect(e,comp)}
                  style={{cursor:'pointer'}}>
          {isSel&&<rect x="-6" y="-6" width={vis.w+12} height={vis.h+12} rx="10"
                        fill="none" stroke="var(--ink)" strokeWidth="1.5"
                        strokeDasharray="4 3" opacity="0.35"
                        transform={comp.facing==='left'
                        ? `translate(${vis.w} 0) scale(-1 1)`
                        : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${rotationCenter(vis).cx} ${rotationCenter(vis).cy})`}/>}
          <GateBody comp={comp}/>
          {vis.inputs.map((_,i)=>{
            const abs=pinAbs(comp,'in',i);
            const px=abs.x-comp.x, py=abs.y-comp.y;
            return <circle key={'in'+i} cx={px} cy={py} r="6"
                    fill={comp.inputVals[i]?'var(--high)':'var(--bg)'}
                    stroke="var(--border-md)" strokeWidth="1.5"/>;
          })}
          {vis.outputs.map((_,i)=>{
            const abs=pinAbs(comp,'out',i);
            const px=abs.x-comp.x, py=abs.y-comp.y;
            return <circle key={'out'+i} cx={px} cy={py} r="6"
                    fill={comp.outputVals[i]?'var(--high)':'var(--bg)'}
                    stroke="var(--border-md)" strokeWidth="1.5"/>;
          })}
        </g>;
      })}
    </g>
  </svg>;
}

// `range` (default [0,1]) confines the particles to whichever fraction of the wire is currently actually high
function ParticleStream({a,b,pts=[],range}) {
  const [t,setT]=useState(0);
  useEffect(()=>{let r,l=performance.now();const fn=(now)=>{setT(p=>(p+(now-l)*.0006)%1);l=now;r=requestAnimationFrame(fn);};r=requestAnimationFrame(fn);return()=>cancelAnimationFrame(r);},[]);
  const N=state.widgetState.particleDensity??4; if(N===0)return null;
  const [t0,t1]=range||[0,1];
  return <g pointerEvents="none">{Array.from({length:N},(_,i)=>{
    const tt=(t+i/N)%1,[x,y]=sampleWire(a.x,a.y,b.x,b.y,pts,t0+tt*(t1-t0));
    return <circle key={i} cx={x} cy={y} r="2.4" fill="var(--high)" opacity=".8"/>;
  })}</g>;
}
function InflightPulse({a,b,pts=[],pendingValue,pendingStart,delayMs}) {
  const [now,setNow]=useState(performance.now());
  useEffect(()=>{let r;const l=()=>{setNow(performance.now());r=requestAnimationFrame(l);};r=requestAnimationFrame(l);return()=>cancelAnimationFrame(r);},[]);
  const t=Math.min(1,(now-(pendingStart||now))/delayMs);
  const[x,y]=sampleWire(a.x,a.y,b.x,b.y,pts,t);
  const col=pendingValue>0?'var(--high)':'var(--low-p)';
  return <g pointerEvents="none"><circle cx={x} cy={y} r="7" fill={col} opacity=".22"/><circle cx={x} cy={y} r="3.5" fill={col}/></g>;
}

return { Canvas };
});
</script>

<script type="text/babel">
/* ═══ MIPS INPUT ═══════════════════════════════════════════════════════════
   Replaces circuit_widget.html's palette (drag-to-place gates) with a
   single-instruction entry box, since components can no longer be added to
   the canvas by hand here. Submit is currently a stub — parsing/executing
   MIPS assembly against the datapath circuit is future work; the exact UI
   of this area may change once that's designed. */
defineModule('mipsInput', [], () => {
'use strict';
const { useState } = React;

function MipsInput({ onSubmit }) {
  const [text, setText] = useState('');
  const submit = () => {
    const instr = text.trim();
    if (!instr) return;
    onSubmit(instr);
    setText('');
  };
  return <div className="palette">
    <div className="pal-group">
      <div className="pal-group-title">Instruction</div>
      <input className="text-input" placeholder="e.g. add $t0, $t1, $t2"
             value={text}
             onChange={e=>setText(e.target.value)}
             onKeyDown={e=>e.key==='Enter'&&submit()}/>
      <button className="btn primary mips-submit-btn" onClick={submit}>Submit</button>
    </div>
  </div>;
}

return { MipsInput };
});
</script>

<script type="text/babel">
/* ═══ APP ══════════════════════════════════════════════════════════════════
   Fork of circuit_widget.html's app module: same toolbar shell minus
   Save/Load/Clear/Equation/Settings (and their dialogs/keyboard shortcuts),
   propagation delay kept, palette swapped for MipsInput, and the
   keyboard-delete effect dropped along with everything else editing-related. */
defineModule('app', ['state', 'engine', 'canvas', 'mipsInput'], (state, engine, canvas, mipsInput) => {
'use strict';
const{useState,useEffect,useCallback}=React;
const{createCircuit}=engine;
const{Canvas}=canvas;
const{MipsInput}=mipsInput;

function App(){
  const [circuit] = useState(() => {
    const c = createCircuit();
    // TODO: load the real MIPS datapath here once it's designed, e.g.
    //   c.load(MIPS_DATAPATH_DATA);
    // (or it may arrive at runtime via the Beamer+ 'widget-set-state'
    // postMessage handler below — see the WIDGET_CONFIG effect.)
    return c;
  });
  state.widgetState.circuit = circuit;
  const [,tick] = useState(0);
  const refresh = useCallback(()=>tick(n=>n+1),[]);
  const [selectedId,setSelectedId] = useState(null);
  const [delayMs,setDelayMs] = useState(600);

  state.widgetState.delayMs = delayMs;
  state.widgetState.propagationMode = "length";
  // "continuous": wires light up as the pulse passes; "discrete": segments
  // only light up once fully crossed — no Settings dialog to change this
  // here, so it's just fixed at the original default.
  state.widgetState.propagationStyle = "continuous";
  state.widgetState.particleDensity = 4;

  // Sim loop
  useEffect(()=>{
    let r;const l=()=>{circuit.step(performance.now(),delayMs);r=requestAnimationFrame(l);};
    r=requestAnimationFrame(l);return()=>cancelAnimationFrame(r);
  },[delayMs]);

  // Beamer+ state persistence protocol — also how the real MIPS datapath
  // circuit can be delivered into this widget at runtime by its host
  useEffect(()=>{
    const cfg = window.WIDGET_CONFIG || {};
    const wid = cfg.id || 'microprocessor-sim';
    const handler=(e)=>{
      if(!e.data) return;
      if(e.data.type==='widget-get-state'){
        window.parent.postMessage({type:'widget-state',widgetId:wid,state:circuit.serialize()},'*');
      } else if(e.data.type==='widget-set-state' && e.data.state){
        circuit.load(e.data.state);refresh();
      }
    };
    window.addEventListener('message',handler);
    return()=>window.removeEventListener('message',handler);
  },[]);

  // TODO: parse and execute the submitted MIPS assembly instruction once
  // the real datapath circuit (see the createCircuit() comment above) exists.
  const handleMipsSubmit = (instructionText) => {
    console.log('[microprocessor_widget] submitted instruction (not yet implemented):', instructionText);
  };

  const n=circuit.components.size;

  return <div className="app">
    <div className="tb">
      <span className="tb-title">MIPS Microprocessor Simulator</span>
      {/* Propagation delay */}
      <div className="tb-delay">
        <span>Propagation Delay</span>
        <input type="range" min="0" max="2000" step="10" value={delayMs}
               onChange={e=>setDelayMs(Number(e.target.value))}/>
        <span className="tb-delay-val">{delayMs}ms</span>
      </div>
    </div>

    <div className="main">
      <MipsInput onSubmit={handleMipsSubmit}/>
      <div className="canvas-wrap">
        <Canvas circuit={circuit}
                selectedId={selectedId}
                onSelect={setSelectedId}/>
        <div className="fc">
          <span className="fc-n">{n}</span><span className="fc-lbl">gates</span>
          <span className="fc-div"/>
          <span className="fc-n">{circuit.wires.size}</span><span className="fc-lbl">wires</span>
        </div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body>
</html>
