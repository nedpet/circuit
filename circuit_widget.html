        wiringFromRef.current=null;
        onComponentChanged?.(); setWiringFrom(null); return;
      }
    }
    if (wf.type==='endpoint' && wf.side==='to') {
      const wire=circuit.wires.get(wf.wireId);
      if (wire) {
        wire.to={compId:comp.id,pin:idx,type:'in'};
        if (endpointDragRef.current) finalizeEndpointRoute(wire, endpointDragRef.current, terminalCoords(wire.to,circuit), circuit);
        endpointDragRef.current=null;
        wiringFromRef.current={...wf, handled:true};
        onComponentChanged?.(); setWiringFrom(null); return;
      }
    }
    if (wf.type==='endpoint' && wf.side==='from') {
      const wire=circuit.wires.get(wf.wireId);
      if (wire) {
        wire.from={compId:comp.id,pin:idx,type:'out'};
        if (endpointDragRef.current) finalizeEndpointRoute(wire, endpointDragRef.current, terminalCoords(wire.from,circuit), circuit);
        endpointDragRef.current=null;
        wiringFromRef.current={...wf, handled:true};
        onComponentChanged?.(); setWiringFrom(null); return;
      }
    }
    if (wf.type==='pin') {
      const wire = circuit.addWire({compId:wf.compId,pin:wf.pin,type:'out'},{compId:comp.id,pin:idx,type:'in'});
      if (wire) wire.points = routeManhattanPoints(terminalCoords(wire.from,circuit),terminalCoords(wire.to,circuit),wf.dir||'h');
      wiringFromRef.current=null;
      onComponentChanged?.(); setWiringFrom(null);
    }
  };
  const onOutputPinUp=(e,comp,idx)=>{
    e.stopPropagation();
    const wf = wiringFromRef.current;
    if (!wf) return;
      if (wf.type==='endpoint' && wf.side==='from') {
        const wire=circuit.wires.get(wf.wireId);
        if (wire) {
          wire.from={compId:comp.id,pin:idx,type:'out'};
          if (endpointDragRef.current) finalizeEndpointRoute(wire, endpointDragRef.current, terminalCoords(wire.from,circuit), circuit);
          endpointDragRef.current=null;
          wiringFromRef.current={...wf, handled:true};
          onComponentChanged?.(); setWiringFrom(null); return;
        }
      }
  };
  const onWireEdgeDown=(e,wire)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    // Unlike a component (which selects immediately on mousedown, drag or
    // not), a segment only selects once the press goes back up as a plain
    // click — see the wf.type==='branch' (no dist>6) case in onUp below —
    // so a drag that turns into a branch doesn't also select the segment
    // it came from. The one exception is a SECOND press on an ALREADY
    // selected segment: that starts a move immediately (constrained to
    // its own perpendicular axis), same as before.
    //
    // "Already selected" is checked against the SELECTED segment's own
    // line (within the same ~8px margin its fat hit-target already
    // affords everywhere else on the wire), not by re-deriving "the
    // nearest segment to THIS click" from scratch and requiring it to
    // come back equal. A second press essentially never lands on the
    // exact same pixel as the first, and right near the corner where two
    // segments meet, that fresh "nearest" answer can flip to the
    // NEIGHBORING segment from a difference of one or two pixels — so
    // requiring an exact match there meant a second click aimed at
    // continuing to grab the segment you'd just selected would, at the
    // slightest drift, silently fall through to branch-creation instead:
    // if that drag then exceeded the 6px threshold, it left a real stray
    // waypoint (a junction where the accidental branch meets the wire)
    // sitting right at that corner — exactly where the segment being
    // moved touches its neighbor.
    const selPrefix = wire.id+'#seg';
    const selectedSegIndex = selectedId && selectedId.startsWith(selPrefix)
      ? Number(selectedId.slice(selPrefix.length)) : null;
    if (selectedSegIndex!=null) {
      const snapshot = segmentMoveSnapshot(wire, selectedSegIndex, circuit);
      if (snapshot) {
        const a=snapshot.knots[snapshot.segIndex], b=snapshot.knots[snapshot.segIndex+1];
        if (distToSeg(w.x,w.y,a.x,a.y,b.x,b.y) <= 8) {
          segDragRef.current={snapshot, startWX:w.x, startWY:w.y};
          return;
        }
      }
    }
    const nearest=findNearestWirePoint(wire,w.x,w.y,circuit);
    const segIndex=nearest.index;
    const wf={type:'branch',wireId:wire.id,segIndex,x:nearest.point.x,y:nearest.point.y,startX:w.x,startY:w.y,startSX:e.clientX,startSY:e.clientY};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onWireEndpointMouseDown=(e,wire,side,pt)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    // Snapshot the wire's shape *before* this drag touches it — see
    // computeEndpointRoute's comment for what neighbor/axis/basePoints mean.
    const otherSide = side==='to' ? 'from' : 'to';
    const basePoints = wire.points ? [...wire.points] : [];
    const neighbor = basePoints.length
      ? (side==='to' ? basePoints[basePoints.length-1] : basePoints[0])
      : terminalCoords(wire[otherSide], circuit);
    const axis = Math.abs(pt.y-neighbor.y) < 1e-6 ? 'h' : (Math.abs(pt.x-neighbor.x) < 1e-6 ? 'v' : 'h');
    endpointDragRef.current={wireId:wire.id,side,ox:pt.x-w.x,oy:pt.y-w.y,neighbor,axis,basePoints};
    const wf={type:'endpoint',wireId:wire.id,side,x:pt.x,y:pt.y,startX:pt.x,startY:pt.y};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onWireClick=(e,wire)=>{
    // Only add waypoint if we're not coming from a pan
    if(isPanning) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    const a=terminalCoords(wire.from,circuit),b=terminalCoords(wire.to,circuit);
    insertBranchPoint(wire,snap(w.x,snapGrid),snap(w.y,snapGrid));
    onComponentChanged?.();
  };
  const onWaypointMouseDown=(e,wire,idx,pt)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    // A corner is never draggable-to-relocate anymore, junction or not —
    // dragging one instead starts a NEW branch from it, same as dragging
    // off a wire's body via onWireEdgeDown, just already pinned exactly to
    // this corner instead of needing findNearestWirePoint to locate it.
    // Leaves this point (and anything already branching from it, if it's
    // already a junction) exactly where it is; insertBranchPoint (run at
    // drop) won't insert a duplicate waypoint here since one already
    // exists.
    const wf={type:'branch',wireId:wire.id,x:pt.x,y:pt.y,startX:w.x,startY:w.y,startSX:e.clientX,startSY:e.clientY};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onWaypointContext=(e,wire,idx)=>{
    e.preventDefault(); e.stopPropagation();
    // A corner can no longer be picked off by itself — junction or plain —
    // right-clicking its dot now falls through to the same "delete the
    // whole wire (and every branch off of it)" action as right-clicking
    // anywhere else on the wire's body, rather than singling out just this
    // point. A junction, in particular, only ever goes away as a side
    // effect of removing whatever made it one — every branch reading from
    // it going with it here (removeWireCascading), this wire itself going
    // away, or a wire's own endpoint getting dragged back onto one
    // (computeEndpointRoute/finalizeEndpointRoute) — never by itself.
    removeWireCascading(wire.id, circuit); onComponentChanged?.();
  };

  const components=[...circuit.components.values()];
  const wires=[...circuit.wires.values()];
  const tx=view.x*view.zoom, ty=view.y*view.zoom;

  // Per-wire signal-arrival info, computed once and shared by the wire
  // path/particle rendering below AND the separate waypoint-handle pass
  // further down, which doesn't otherwise have easy access to this wire's
  // shape or pending state — so a waypoint, junction, or free endpoint
  // lights up the moment the signal actually reaches IT, not whenever the
  // whole wire finishes settling. `distances[i]` is knot i's (wireKnots
  // order: from, then every waypoint, then to) distance from `from`, so a
  // waypoint at index `idx` in `wire.points` sits at `distances[idx+1]`.
  const wireProgress = new Map();
  for (const w of wires) {
    const a = terminalCoords(w.from,circuit), b = terminalCoords(w.to,circuit);
    const distances = wireKnotDistances(a.x,a.y,b.x,b.y,w.points||[]);
    const wireLen = distances[distances.length-1];
    const pending = !w.bitMismatch && typeof w.pendingValue!=='undefined';
    let pendingT=0, wireDelay=0;
    if (pending) {
      // wireOwnDelay: in component mode, a branch commits sooner than the
      // flat wireDelayForLength(wireLen) would suggest — it gets credit
      // for however much of its budget its own parent already spent
      // reaching the branchpoint (see engine-circuit.js). Animating the
      // pulse against the un-credited flat delay would have it crawl at
      // the wrong (slower) rate and then jump the rest of the way instantly
      // the moment the wire actually commits underneath it.
      wireDelay = circuit.wireOwnDelay(w, wireDelayForLength(wireLen, state.widgetState.delayMs));
      pendingT = Math.min(1, (performance.now()-(w.pendingStart||performance.now()))/wireDelay);
    }
    wireProgress.set(w.id, {
      pending, pendingT, wireDelay, wireLen, distances,
      reachedDist: pendingT*wireLen,
      value: w.value, pendingValue: w.pendingValue,
    });
  }
  // Whether the point `dist` away from a wire's own `.from` is CURRENTLY
  // showing as high — the whole wire's settled value normally, or, mid-
  // transition, whichever side of the signal's current position it falls
  // on (see splitWirePathAtSegment/splitWirePath — whichever is active for
  // the current propagationStyle — which do the same thing for the wire's
  // own drawn path).
  const isWireHighAt = (progress, dist) =>
    progress.pending ? (dist<=progress.reachedDist ? progress.pendingValue>0 : progress.value>0)
                      : progress.value>0;

  // While a segment drag is moving a branch's own anchor — its end reads
  // from a DIFFERENT wire's junction, see clampSegmentMoveDelta /
  // attachBranchToJunction — that junction doesn't actually move until
  // drop; only this branch's own line does, live, every frame. Nothing
  // here changes circuit.junctions or the parent's own `.points`; this
  // just tells the waypoint pass below to skip drawing the one dot that's
  // still sitting at the anchor's pre-drag position on the PARENT wire,
  // purely so it doesn't look like a stray leftover while the branch's
  // line has already visibly pulled away from it.
  const draggedBranchAnchor = (() => {
    const d = segDragRef.current;
    if (!d) return null;
    const {snapshot} = d;
    const n = snapshot.knots.length;
    const ends = [
      {pos: snapshot.knots[snapshot.segIndex],   pinned: snapshot.startPinned, side: snapshot.segIndex===0     ? 'from' : null},
      {pos: snapshot.knots[snapshot.segIndex+1], pinned: snapshot.endPinned,   side: snapshot.segIndex+1===n-1 ? 'to'   : null},
    ];
    for (const end of ends) {
      if (end.pinned || !end.side) continue;
      for (const j of circuit.junctions) {
        if (j.sourceWireId!==snapshot.wireId && Math.abs(j.x-end.pos.x)<1e-6 && Math.abs(j.y-end.pos.y)<1e-6) {
          return {x: end.pos.x, y: end.pos.y, parentWireId: j.sourceWireId};
        }
      }
    }
    return null;
  })();

  // Clock overlay
  const selComp = selectedId ? circuit.components.get(selectedId) : null;
  const clockPanel = selComp?.kind==='CLOCK' ? (()=>{
    const vis=GATE_VIS.CLOCK;
    const sx=(selComp.x+vis.w/2+view.x)*view.zoom;
    const sy=(selComp.y+vis.h+10+view.y)*view.zoom;
    return (
      <div className="clk-panel" style={{left:sx,top:sy}}
           onMouseDown={e=>e.stopPropagation()}>
        <div className="clk-header">
          <span className="clk-label">Clock</span>
          <span className="clk-status">{selComp.state.paused?'paused':`${selComp.state.period}ms`}</span>
        </div>
        <div className="clk-period">
          <span style={{fontSize:10.5,color:'var(--ink-3)',fontFamily:'var(--mono)'}}>100</span>
          <input type="range" min="100" max="4000" step="100"
                 value={selComp.state.period}
                 onChange={e=>{circuit.setClockPeriod(selComp.id,Number(e.target.value));onComponentChanged?.();}}/>
          <span className="clk-period-val">{selComp.state.period}ms</span>
        </div>
      </div>
    );
  })() : null;
  // INPUT/OUTPUT/CONST share the same Bits/Format/Facing controls (CONST
  // is bit-width-aware for the same reason INPUT is), and differ only in
  // their very first row: INPUT/OUTPUT are named circuit ports (Label),
  // while CONST is a fixed, unnamed tie-in value (Value) — everything else
  // is identical, so one panel covers all three instead of two
  // near-duplicates drifting apart.
  const ioPanel = selComp?.kind==='INPUT' || selComp?.kind==='OUTPUT' || selComp?.kind==='CONST' ? (()=>{
    const isConst = selComp.kind==='CONST';
    const maxVal = (selComp.bitWidth||1) >= 32 ? 0xFFFFFFFF : (2**(selComp.bitWidth||1) - 1);
    return (
      <div className="prop-panel" onMouseDown={e=>e.stopPropagation()}>
        <div className="prop-title">{isConst ? 'Constant' : selComp.kind} Properties</div>
        {isConst ? (
          <div className="prop-option">
            <span className="prop-label">Value</span>
            <NumberField className="prop-input" min={0} max={maxVal}
                    value={selComp.state.value||0}
                    onCommit={n=>{circuit.setConstValue(selComp.id,n);onComponentChanged?.();}}/>
          </div>
        ) : (
          <div className="prop-option">
            <span className="prop-label">Label</span>
            <input  className="prop-input"
                    value={selComp.label}
                    onChange={e=>{circuit.setIOLabel(selComp.id,e.target.value);onComponentChanged?.();}}/>
          </div>
        )}
        <div className="prop-option">
          <span className="prop-label">Bits</span>
          <NumberField className="prop-input" min={1} max={32}
                  value={selComp.bitWidth||1}
                  onCommit={n=>{circuit.setBitWidth(selComp.id,n);onComponentChanged?.();}}/>
        </div>
        <div className="prop-option">
          <span className="prop-label">Format</span>
          <select className="prop-input"
                  value={selComp.displayMode||'bin'}
                  onChange={e=>{circuit.setDisplayMode(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="bin">Binary</option>
            <option value="hex">Hexadecimal</option>
          </select>
        </div>
        <div className="prop-option">
          <span className="prop-label">Facing</span>
          <select className="prop-input"
                  value={selComp.facing}
                  onChange={e=>{circuit.setFacing(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="right">Right</option>
            <option value="left">Left</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
          </select>
        </div>
      </div>
    )
  })() : null;
  const gatePanel = ['NOT', 'AND','OR','NAND','NOR','XOR','XNOR','MUX','SHFT','EXTND','SPLIT'].includes(selComp?.kind) ? (()=>{
    return (
      <div className="prop-panel" onMouseDown={e=>e.stopPropagation()}>
        <div className="prop-title">{selComp.kind} Properties</div>
        {selComp.kind==='EXTND' ? <>
          <div className="prop-option">
            <span className="prop-label">Bits In</span>
            <NumberField className="prop-input" min={1} max={32}
                    value={selComp.bitWidthIn||1}
                    onCommit={n=>{circuit.setExtBitWidthIn(selComp.id,n);onComponentChanged?.();}}/>
          </div>
          <div className="prop-option">
            <span className="prop-label">Bits Out</span>
            <NumberField className="prop-input" min={1} max={32}
                    value={selComp.bitWidthOut||1}
                    onCommit={n=>{circuit.setExtBitWidthOut(selComp.id,n);onComponentChanged?.();}}/>
          </div>
        </> : selComp.kind==='SPLIT' ? <>
          <div className="prop-option">
            <span className="prop-label">Type</span>
            <select className="prop-input"
                    value={selComp.splitType||'split'}
                    onChange={e=>{circuit.setSplitType(selComp.id,e.target.value);onComponentChanged?.();}}>
              <option value="split">Split</option>
              <option value="merge">Merge</option>
            </select>
          </div>
          <div className="prop-option">
            <span className="prop-label">Bits</span>
            <NumberField className="prop-input" min={2} max={8}
                    value={selComp.bits||2}
                    onCommit={n=>{circuit.setSplitBits(selComp.id,n);onComponentChanged?.();}}/>
          </div>
          <div className="prop-option">
            <span className="prop-label">Space</span>
            <NumberField className="prop-input" min={1} max={8}
                    value={selComp.space||1}
                    onCommit={n=>{circuit.setSplitSpace(selComp.id,n);onComponentChanged?.();}}/>
          </div>
        </> : <div className="prop-option">
          <span className="prop-label">Bits</span>
          <NumberField className="prop-input" min={1} max={32}
                  value={selComp.bitWidth||1}
                  onCommit={n=>{circuit.setBitWidth(selComp.id,n);onComponentChanged?.();}}/>
        </div>}
        {selComp.kind==='MUX' && <div className="prop-option">
          <span className="prop-label">Inputs</span>
          <select className="prop-input"
                  value={selComp.muxInputs||2}
                  onChange={e=>{circuit.setMuxInputs(selComp.id,Number(e.target.value));onComponentChanged?.();}}>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>}
        {selComp.kind==='MUX' && <div className="prop-option">
          <span className="prop-label">Select</span>
          <select className="prop-input"
                  value={selComp.muxSelectLocation||'top'}
                  onChange={e=>{circuit.setMuxSelectLocation(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
          </select>
        </div>}
        {selComp.kind==='SHFT' && <div className="prop-option">
          <span className="prop-label">Mode</span>
          <select className="prop-input"
                  value={selComp.shiftMode||'left'}
                  onChange={e=>{circuit.setShiftMode(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="left">Logical Left</option>
            <option value="right">Logical Right</option>
            <option value="arith">Arithmetic Right</option>
          </select>
        </div>}
        <div className="prop-option">
          <span className="prop-label">Facing</span>
          <select className="prop-input"
                  value={selComp.facing}
                  onChange={e=>{circuit.setFacing(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="right">Right</option>
            <option value="left">Left</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
          </select>
        </div>
        {selComp.kind!=='SPLIT' && <div className="prop-option">
          <span className="prop-label">Delay</span>
          <div className="prop-range">
            <input type="range" min="0" max="2000" step="100"
                   value={selComp.delay}
                   onChange={e=>{circuit.setDelay(selComp.id,Number(e.target.value));onComponentChanged?.();}}/>
            <span className="tb-delay-val">{selComp.delay}ms</span>
          </div>
        </div>}
      </div>
    )
  })() : null;
  const regPanel = selComp?.kind==='REG' ? (()=>{
    return (
      <div className="prop-panel" onMouseDown={e=>e.stopPropagation()}>
        <div className="prop-title">REG Properties</div>
        <div className="prop-option">
          <span className="prop-label">Bits</span>
          <NumberField className="prop-input" min={1} max={32}
                  value={selComp.bitWidth||1}
                  onCommit={n=>{circuit.setBitWidth(selComp.id,n);onComponentChanged?.();}}/>
        </div>
        <div className="prop-option">
          <span className="prop-label">Format</span>
          <select className="prop-input"
                  value={selComp.displayMode||'bin'}
                  onChange={e=>{circuit.setDisplayMode(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="bin">Binary</option>
            <option value="hex">Hexadecimal</option>
          </select>
        </div>
      </div>
    )
  })() : null;

  return <>
    <svg ref={svgRef} className="canvas"
         style={{width:'100%',height:'100%',cursor:isPanning?'grabbing':'default',background:'transparent'}}
         onMouseDown={onMouseDownBg}
         onContextMenu={e=>e.preventDefault()}>
      <defs>
        <pattern id="grid-dots" x="0" y="0" width={GRID} height={GRID} patternUnits="userSpaceOnUse">
          <circle cx={GRID/2} cy={GRID/2} r="1" fill="var(--grid)"/>
        </pattern>
      </defs>
      <rect className="canvas-bg" x="-5000" y="-5000" width="10000" height="10000"
            fill="url(#grid-dots)"
            transform={`translate(${tx},${ty}) scale(${view.zoom})`}/>

      <g transform={`translate(${tx},${ty}) scale(${view.zoom})`}>
        {/* Wires */}
        {wires.map(w=>{
          const a=terminalCoords(w.from,circuit), b=terminalCoords(w.to,circuit);
          const pts=w.points||[];
          const path=wirePath(a.x,a.y,b.x,b.y,pts);
          const high=w.value>0;
          const mismatch=w.bitMismatch;
          // A wire mid-transition lights up as the signal actually reaches
          // each point along it, rather than the whole wire holding its
          // old color until the full wire delay elapses — pending/
          // wireDelay/pendingT come from wireProgress (above), shared with
          // the free-endpoint/waypoint lighting and the traveling
          // InflightPulse dot below so all of them track the exact same
          // progress, computed once instead of several times. Which of
          // the two split functions actually draws the lit boundary is
          // the one thing that depends on propagationStyle — see the
          // "Signal color" comment just below for what each one looks
          // like; everything downstream of pendingT (particles, waypoint
          // and endpoint lighting) doesn't care which one ran.
          const progress = wireProgress.get(w.id);
          const {pending, wireDelay, pendingT} = progress;
          const split = pending
            ? (state.widgetState.propagationStyle==='discrete'
                ? splitWirePathAtSegment(a.x,a.y,b.x,b.y,pts,pendingT)
                : splitWirePath(a.x,a.y,b.x,b.y,pts,pendingT))
            : null;
          // Which of this wire's segments (if any) selectedId names — a
          // composite id ('<wireId>#seg<index>', see segSelId), distinct
          // from any component id, so it rides the same selectedId prop
          // components use without colliding with one.
          const selPrefix = w.id+'#seg';
          const selSeg = selectedId && selectedId.startsWith(selPrefix) ? Number(selectedId.slice(selPrefix.length)) : null;
          const selKnots = selSeg!=null ? wireKnots(a.x,a.y,b.x,b.y,pts) : null;
          const selA = selKnots && selKnots[selSeg], selB = selKnots && selKnots[selSeg+1];
          return <g key={w.id}>
            {/* Selection bounding box — same dashed-rect language as a
                selected component, padded around just the one selected
                segment (not the whole wire) since selection is per-segment. */}
            {selA && selB && <rect
                  x={Math.min(selA.x,selB.x)-8} y={Math.min(selA.y,selB.y)-8}
                  width={Math.abs(selB.x-selA.x)+16} height={Math.abs(selB.y-selA.y)+16}
                  rx="6" fill="none" stroke="var(--ink)" strokeWidth="1.5"
                  strokeDasharray="4 3" opacity="0.35"/>}
            {/* Shadow */}
            <path d={path} fill="none" stroke="var(--ink)" strokeWidth="3.5"
                  strokeLinejoin="round" strokeLinecap="round" opacity="0.07"/>
            {/* Signal color — red instead of low/high when the pins on
                either end disagree on bit width; the signal is held at 0
                rather than crossing, so `high` is never true here too.
                Mid-transition (split!=null), drawn as two strokes instead
                of one: the part already reached, in the color it's
                arriving AT, and the rest, still in the color it's coming
                FROM. Where exactly the cut falls depends on
                propagationStyle: "discrete" (splitWirePathAtSegment) cuts
                at whichever corner is the furthest one entirely crossed,
                never partway through a segment; "continuous"
                (splitWirePath) cuts exactly where the in-flight pulse
                currently is, tracking it smoothly rather than jumping
                corner to corner. No CSS transition on either piece; the
                geometry itself already animates frame to frame; a color
                transition on top would just blur the two together. */}
            {split
              ? <>
                  <path d={split.before} fill="none" stroke={w.pendingValue>0?'var(--high)':'var(--low)'}
                        strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                  <path d={split.after} fill="none" stroke={high?'var(--high)':'var(--low)'}
                        strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                </>
              : <path d={path} fill="none"
                      stroke={mismatch?'var(--err)':(high?'var(--high)':'var(--low)')}
                      strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"
                      strokeDasharray={mismatch?'5 4':undefined}
                      style={{transition:'stroke 100ms ease'}}/>}
            {/* Fat hit target — click to add branch */}
            <path d={path} fill="none" stroke="transparent" strokeWidth="16"
                  style={{cursor:'cell'}}
                  onMouseDown={e=>onWireEdgeDown(e,w)}
                  onContextMenu={e=>onWireContext(e,w)}/>
            {/* Particles — confined to whichever part of the wire is
                CURRENTLY actually high. Settled, that's simply the whole
                wire when `high`. Mid-transition, `high` alone isn't
                enough: it still reads true for the entire duration of a
                high-to-low transition (w.value doesn't drop until the
                full delay elapses), which would otherwise let particles
                keep flowing across a stretch that's already visually
                turned off, per the split above — so here they're confined
                to just the not-yet-reached suffix instead, shrinking in
                step with it. Arriving at high (pendingValue>0) is the
                mirror case: nothing's actually high yet except the
                already-reached prefix, which is where they start instead
                of waiting for the whole wire to settle. */}
            {pending
              ? (w.pendingValue>0
                  ? <ParticleStream a={a} b={b} pts={pts} range={[0,pendingT]}/>
                  : high && <ParticleStream a={a} b={b} pts={pts} range={[pendingT,1]}/>)
              : high && <ParticleStream a={a} b={b} pts={pts}/>}
            {/* In-flight pulse — the exact leading edge. Under "discrete"
                propagationStyle this runs a bit ahead of the segment
                coloring above, which only ever stops at a real corner;
                under "continuous" the two always agree exactly. */}
            {pending&&<InflightPulse a={a} b={b} pts={pts} pendingValue={w.pendingValue}
                                  pendingStart={w.pendingStart} delayMs={wireDelay}/>}
            {/* Free endpoint handles — light up with their wire like a pin
                does, junction or not; only the idle color differs (white
                here vs. bg for a waypoint) since that was already each
                handle's own resting color before signals entered into it.
                `from` sits at distance 0 (where the signal originates, so
                it flips to the new value almost the instant a transition
                starts) and `to` at the full wireLen (so it only flips
                once the signal has actually arrived there) — same
                isWireHighAt every other per-point light-up below uses. */}
            {!w.from.compId&&<circle cx={a.x} cy={a.y} r="6"
                      fill={isWireHighAt(progress,0)?'var(--high)':'white'}
                      stroke="var(--border-md)" strokeWidth="1.5"
                      style={{cursor:'move', transition:'fill 100ms ease'}}
                      onMouseDown={e=>onWireEndpointMouseDown(e,w,'from',a)}/>}
            {!w.to.compId&&<circle cx={b.x} cy={b.y} r="6"
                      fill={isWireHighAt(progress,progress.wireLen)?'var(--high)':'white'}
                      stroke="var(--border-md)" strokeWidth="1.5"
                      style={{cursor:'move', transition:'fill 100ms ease'}}
                      onMouseDown={e=>onWireEndpointMouseDown(e,w,'to',b)}/>}
          </g>;
        })}

        {/* Waypoint handles — a separate pass over every wire, rendered
            after (so painted on top of) every wire's free-endpoint handles
            above. A waypoint that's also a junction sits at the exact same
            point as the branch wire's free `from` endpoint; when both were
            rendered together per-wire, whichever wire was created later
            painted on top and silently ate every click there, making the
            original wire's own waypoint permanently unreachable — so a
            junction could never gain a second branch. Keeping all waypoint
            handles in one later pass means they always win that overlap,
            regardless of which wire they belong to or when it was made.
            Every corner lights up the same way a pin does — bg when idle,
            --high when its host wire is carrying a signal — junction or
            plain corner alike; neither dragging nor right-clicking a
            corner distinguishes the two anymore either — see
            onWaypointMouseDown/onWaypointContext. */}
        {wires.map(w=>(w.points||[]).map((pt,idx)=>{
          // Skip the one dot a branch drag has already visually pulled
          // away from — see draggedBranchAnchor above.
          if (draggedBranchAnchor && w.id===draggedBranchAnchor.parentWireId &&
              Math.abs(pt.x-draggedBranchAnchor.x)<1e-6 && Math.abs(pt.y-draggedBranchAnchor.y)<1e-6) return null;
          // Lights up the moment the signal actually reaches THIS corner
          // — pt is wire.points[idx], which sits at distances[idx+1] in
          // wireProgress (knot 0 is `from`) — rather than waiting for the
          // whole wire to finish settling, same as the free endpoints
          // above and the wire's own path (splitWirePathAtSegment/
          // splitWirePath, whichever propagationStyle picks).
          const progress = wireProgress.get(w.id);
          const pointHigh = isWireHighAt(progress, progress.distances[idx+1]);
          return <circle key={w.id+'_wp'+idx} cx={pt.x} cy={pt.y} r="5"
                  fill={pointHigh?'var(--high)':'var(--bg)'}
                  stroke="var(--border-md)" strokeWidth="1.5"
                  style={{cursor:'move', transition:'fill 100ms ease'}}
                  onMouseDown={e=>onWaypointMouseDown(e,w,idx,pt)}
                  onContextMenu={e=>onWaypointContext(e,w,idx)}/>;
        }))}

        {/* Components */}
        {components.map(comp=>{
          const vis=visForComp(comp),isSel=selectedId===comp.id;
          return <g key={comp.id} transform={`translate(${comp.x},${comp.y})`}
                    onMouseDown={e=>onCompMouseDown(e,comp)}
                    onContextMenu={e=>onCompContext(e,comp)}
                    style={{cursor:'move'}}>
            {isSel&&<rect x="-6" y="-6" width={vis.w+12} height={vis.h+12} rx="10"
                          fill="none" stroke="var(--ink)" strokeWidth="1.5"
                          strokeDasharray="4 3" opacity="0.35"
                          transform={comp.facing==='left'
                          ? `translate(${vis.w} 0) scale(-1 1)`
                          : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${rotationCenter(vis).cx} ${rotationCenter(vis).cy})`}/>}
            <GateBody comp={comp}/>
            {vis.inputs.map((_,i)=>{
              const abs=pinAbs(comp,'in',i);
              const px=abs.x-comp.x, py=abs.y-comp.y;
              return <g key={'in'+i}>
                <circle cx={px} cy={py} r="6"
                        fill={comp.inputVals[i]?'var(--high)':'var(--bg)'}
                        stroke="var(--border-md)" strokeWidth="1.5"/>
                {/* Fat invisible hit target — matches the wire hit-path pattern
                    above, so a drop that's a few px off the visible pin still
                    connects instead of landing as a free wire endpoint. */}
                <circle cx={px} cy={py} r="14" fill="transparent"
                        style={{cursor:'crosshair'}}
                        onMouseUp={e=>onInputPinUp(e,comp,i)}
                        onMouseDown={e=>e.stopPropagation()}/>
              </g>;
            })}
            {vis.outputs.map((_,i)=>{
              const abs=pinAbs(comp,'out',i);
              const px=abs.x-comp.x, py=abs.y-comp.y;
              return <g key={'out'+i}>
                <circle cx={px} cy={py} r="6"
                        fill={comp.outputVals[i]?'var(--high)':'var(--bg)'}
                        stroke="var(--border-md)" strokeWidth="1.5"/>
                <circle cx={px} cy={py} r="14" fill="transparent"
                        style={{cursor:'crosshair'}}
                        onMouseDown={e=>onOutputPinDown(e,comp,i)}
                        onMouseUp={e=>onOutputPinUp(e,comp,i)}/>
              </g>;
            })}
          </g>;
        })}

        {/* Wiring preview — routed with the same routeManhattanPoints(...,
            wf.dir||'h') call every onXxxUp handler uses to actually set
            wire.points on drop, so the corner shown while dragging is the
            one that will really result instead of always defaulting to
            horizontal-first regardless of which way the drag went.
            Skipped for type==='endpoint': that drag moves a real existing
            wire, which is already being live-updated (via
            computeEndpointRoute in onMove) and rendered in its actual
            colors below — this generic dashed overlay would just be a
            second, wrongly-routed line drawn on top of it. */}
        {wiringFrom&&wiringFrom.type!=='endpoint'&&
          <path d={wirePath(wiringFrom.x,wiringFrom.y,mousePos.x,mousePos.y,
                             routeManhattanPoints({x:wiringFrom.x,y:wiringFrom.y},{x:mousePos.x,y:mousePos.y},wiringFrom.dir||'h'))}
                fill="none" stroke="var(--high)" strokeWidth="2"
                strokeDasharray="6 4" opacity="0.7" pointerEvents="none"/>}

        {/* Palette drag ghost */}
        {paletteDrag&&(()=>{
          const vis=GATE_VIS[paletteDrag.kind];
          return <g transform={`translate(${snap(mousePos.x-vis.w/2,snapGrid)},${snap(mousePos.y-vis.h/2,snapGrid)})`}
                    opacity="0.6" pointerEvents="none">
            <GateBody comp={{kind:paletteDrag.kind,inputVals:new Array(GATE_DEFS[paletteDrag.kind].inputs).fill(0),outputVals:new Array(GATE_DEFS[paletteDrag.kind].outputs).fill(0),state:{value:0}}}/>
          </g>;
        })()}
      </g>
    </svg>
    {clockPanel}
    {ioPanel}
    {gatePanel}
    {regPanel}
  </>;
}

// `range` (default [0,1]) confines the particles to whichever fraction of
// the wire is CURRENTLY actually high — the whole thing when it's simply
// settled high, but only part of it mid-transition (see the render site):
// the already-reached prefix while arriving at high, or the not-yet-
// reached suffix while leaving it, matching the same signal-arrival
// tracking the wire's own color (splitWirePathAtSegment/splitWirePath)
// and its waypoints (isWireHighAt) already follow. `tt` (each particle's
// own 0-1 cycle position) gets remapped into that sub-range rather than
// sampled directly, so particles never wander onto a stretch that's
// already visually turned off.
function ParticleStream({a,b,pts=[],range}) {
  const [t,setT]=useState(0);
  useEffect(()=>{let r,l=performance.now();const fn=(now)=>{setT(p=>(p+(now-l)*.0006)%1);l=now;r=requestAnimationFrame(fn);};r=requestAnimationFrame(fn);return()=>cancelAnimationFrame(r);},[]);
  const N=state.widgetState.particleDensity??4; if(N===0)return null;
  const [t0,t1]=range||[0,1];
  return <g pointerEvents="none">{Array.from({length:N},(_,i)=>{
    const tt=(t+i/N)%1,[x,y]=sampleWire(a.x,a.y,b.x,b.y,pts,t0+tt*(t1-t0));
    return <circle key={i} cx={x} cy={y} r="2.4" fill="var(--high)" opacity=".8"/>;
  })}</g>;
}
function InflightPulse({a,b,pts=[],pendingValue,pendingStart,delayMs}) {
  const [now,setNow]=useState(performance.now());
  useEffect(()=>{let r;const l=()=>{setNow(performance.now());r=requestAnimationFrame(l);};r=requestAnimationFrame(l);return()=>cancelAnimationFrame(r);},[]);
  const t=Math.min(1,(now-(pendingStart||now))/delayMs);
  const[x,y]=sampleWire(a.x,a.y,b.x,b.y,pts,t);
  const col=pendingValue>0?'var(--high)':'var(--low-p)';
  return <g pointerEvents="none"><circle cx={x} cy={y} r="7" fill={col} opacity=".22"/><circle cx={x} cy={y} r="3.5" fill={col}/></g>;
}

return { Canvas };
});
</script>

<script type="text/babel">
/* ═══ PALETTE ══════════════════════════════════════════════════════════════ */
defineModule('palette', ['engine', 'gates'], (engine, gates) => {
'use strict';
const { GATE_DEFS } = engine;
const { GATE_VIS, GateBody } = gates;
const GROUPS=[
  {title:'Sources',   kinds:['INPUT','CLOCK','CONST']},
  {title:'Sinks',     kinds:['OUTPUT', 'SEVEN']},
  {title:'Logic',     kinds:['AND','OR','NOT','NAND','NOR','XOR','XNOR','MUX']},
  {title:'Flip-flops',kinds:['DFF','TFF','JKFF','SRFF']},
  {title:'Miscellaneous',kinds:['REG', 'SHFT', 'EXTND', 'SPLIT']}, //temp
  {title:'Custom',    kinds:[]},
];
function Thumb({kind}){

  const tw=62,th=44,sc=Math.min(tw/(vis.w+24),th/(vis.h+8));

  return <svg width={tw} height={th}><g transform={`translate(${tx2},${ty2}) scale(${sc})`}><GateBody comp={{kind,inputVals:new Array(def.inputs).fill(0),outputVals:new Array(def.outputs).fill(0),state:{value:0}}}/></g></svg>;
}
function Palette({onDragStart, onImportClick, onDeleteCustom, customKinds=[]}){
  return <div className="palette">{GROUPS.map(g=>{
    const isCustom = g.title === "Custom";

    <div className="pal-grid">
      {isCustom ? <button key={"import"} className="pal-item"
        onClick={onImportClick}>
        <svg width="62" height="44">
          <path d="M 28 7 H 34 V 19 H 46 V 25 H 34 V 37 H 28 V 25 H 16 V 19 H 28 Z" fill="var(--low)"/>
        </svg>
        <div className="pal-label">Import</div>
      </button> : null}
      {kinds.map(k=>isCustom ? (
        <div key={k} className="pal-item"
             onMouseDown={e=>{e.preventDefault();onDragStart(k);}}>
          <button className="pal-del-btn" title="Delete custom gate"
                  onMouseDown={e=>e.stopPropagation()}
                  onClick={e=>{e.stopPropagation();onDeleteCustom(k);}}>
            <svg width="8" height="8" viewBox="0 0 8 8">
              <line x1="1" y1="1" x2="7" y2="7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
              <line x1="7" y1="1" x2="1" y2="7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </button>
          <Thumb kind={k}/><div className="pal-label">{GATE_DEFS[k].label}</div>
        </div>
      ) : (
        <button key={k} className="pal-item"
        onMouseDown={e=>{e.preventDefault();onDragStart(k);}}>
        <Thumb kind={k}/><div className="pal-label">{GATE_DEFS[k].label}</div>
      </button>
      ))}</div>

  })}</div>;
}

return { Palette };
});
</script>

<script type="text/babel">
/* ═══ APP ══════════════════════════════════════════════════════════════════ */
defineModule('app', ['state', 'engine', 'gates', 'canvas', 'palette'], (state, engine, gates, canvas, palette) => {
'use strict';
const{useState,useEffect,useCallback,useRef}=React;
const{createCircuit,GATE_DEFS}=engine;
const{Canvas}=canvas;
const{Palette}=palette;

// Custom gates are only ever placed via the palette after an Import, so any
// custom kind referenced by a saved circuit was necessarily imported at some
// point — but registerCustomGate() only ever registered it in memory
// (GATE_DEFS/VIS), never persisted it. Loading that circuit in a later
// session (or before re-importing it in this one) crashed the moment
// addComponent() hit a kind with no registered definition. This registry
// makes Import durable across reloads instead of session-only.
function loadCustomRegistry() {
  try { return JSON.parse(localStorage.getItem('dss_customs_v1')||'[]'); } catch { return []; }
}
function upsertCustomRegistry(name, data) {
  const entries = loadCustomRegistry().filter(e=>e.name!==name);
  entries.push({name, data});
  localStorage.setItem('dss_customs_v1', JSON.stringify(entries));
}
function removeFromCustomRegistry(name) {
  localStorage.setItem('dss_customs_v1', JSON.stringify(loadCustomRegistry().filter(e=>e.name!==name)));
}
function extractCustomDeps(data) {
  const names = new Set();
  for (const c of (data.components||[])) {
    if (typeof c.kind === 'string' && c.kind.startsWith('CUSTOM:')) names.add(c.kind.slice('CUSTOM:'.length));
  }
  return names;
}
// Would redefining custom gate `name` as `data` make its own dependency
// chain loop back to itself (directly, or through other custom gates)?
// Checked against every OTHER custom gate's currently-registered
// definition, with `name`'s entry swapped for the proposed new one — since
// that's the only definition actually changing. Returns the cycle as a
// name chain (e.g. ['C','A','B','C']) for the warning message, or null.
function findCustomCycle(name, data) {
  const registryMap = new Map(loadCustomRegistry().map(e=>[e.name, e.data]));
  registryMap.set(name, data);
  const onPath = new Set();
  const path = [];
  function dfs(node) {
    if (onPath.has(node)) { path.push(node); return true; }
    onPath.add(node); path.push(node);
    for (const dep of extractCustomDeps(registryMap.get(node) || {})) {
      if (dfs(dep)) return true;
    }
    onPath.delete(node); path.pop();
    return false;
  }
  return dfs(name) ? path : null;
}
// Re-registers every previously-imported custom gate on startup. A custom
// gate's sub-circuit can itself contain another custom gate, and the
// registry has no guaranteed order, so this can't just register in list
// order — it retries whatever fails (missing dependency not registered yet)
// until a full pass makes no more progress.
function hydrateCustomGates() {
  let pending = loadCustomRegistry();
  const kinds = [];
  let progressed = true;
  while (pending.length && progressed) {
    progressed = false;
    const stillPending = [];
    for (const entry of pending) {
      try {
        kinds.push(gates.registerCustomGate(entry.name, entry.data));
        progressed = true;
      } catch {
        stillPending.push(entry);
      }
    }
    pending = stillPending;
  }
  if (pending.length) {
    console.warn('Could not register custom gate(s), missing dependency:', pending.map(e=>e.name));
  }
  return kinds;
}

function App(){
  const[circuit]=useState(()=>createCircuit());
  state.widgetState.circuit = circuit;
  const[,tick]=useState(0);
  const refresh=useCallback(()=>tick(n=>n+1),[]);
  const[selectedId,setSelectedId]=useState(null);
  const[palDrag,setPalDrag]=useState(null);
  const[delayMs,setDelayMs]=useState(600);
  const[saved,setSaved]=useState(()=>{try{return JSON.parse(localStorage.getItem('dss_v2')||'[]');}catch{return[];}});
  const[customKinds,setCustomKinds]=useState(()=>hydrateCustomGates());
  const[showSave,setShowSave]=useState(false);
  const[saveName,setSaveName]=useState('');
  // Bottom-of-screen confirmation shown right after a save completes; see
  // doSave. Keyed by `key` (not just text) so re-saving the same name back
  // to back restarts the fade-out instead of the old timer silently
  // clearing the brand-new toast.
  const[toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  const showToast=(text)=>{
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({text,key:Date.now()});
    toastTimer.current=setTimeout(()=>setToast(null),2400);
  };
  const[showLoad,setShowLoad]=useState(false);
  const[showEquation, setShowEquation]=useState(false);
  const[equation,setEquation]=useState('');
  const[equationToLoad,setEquationToLoad]=useState('');
  const[showSettings, setShowSettings]=useState(false);
  const[propagationMode, setPropagationMode]=useState("length");
  // "continuous": the wire's lit boundary tracks the in-flight pulse's
  // exact position (splitWirePath). "discrete": it only advances once a
  // whole segment is entirely crossed (splitWirePathAtSegment). See the
  // "Signal color" render site in Canvas for where this actually gets read.
  const[propagationStyle, setPropagationStyle]=useState("continuous");


  state.widgetState.delayMs=delayMs;
  state.widgetState.propagationMode=propagationMode;
  state.widgetState.propagationStyle=propagationStyle;
  state.widgetState.particleDensity=4;

  // Sim loop
  useEffect(()=>{
    let r;const l=()=>{circuit.step(performance.now(),delayMs);r=requestAnimationFrame(l);};
    r=requestAnimationFrame(l);return()=>cancelAnimationFrame(r);
  },[delayMs]);

  // Beamer+ state persistence protocol
  useEffect(()=>{
    const cfg = window.WIDGET_CONFIG || {};
    const wid = cfg.id || 'circuit-sim';
    const handler=(e)=>{
      if(!e.data) return;
      if(e.data.type==='widget-get-state'){
        window.parent.postMessage({type:'widget-state',widgetId:wid,state:circuit.serialize()},'*');
      } else if(e.data.type==='widget-set-state' && e.data.state){
        circuit.load(e.data.state);refresh();
      }
    };
    window.addEventListener('message',handler);
    return()=>window.removeEventListener('message',handler);
  },[]);

  // Keyboard delete
  useEffect(()=>{
    const fn=(e)=>{
      if((e.key==='Delete'||e.key==='Backspace')&&selectedId){
        if(e.target.tagName==='INPUT')return;
        // selectedId is either a real component id, or (see segSelId) a
        // '<wireId>#seg<n>' composite naming a selected wire segment —
        // mirrors right-clicking that exact same target: a component just
        // goes, a selected segment deletes itself and every segment after
        // it (toward wire.to), leaving everything before it alone, and
        // cascades to every branch reading from the part being cut (see
        // onWireContext / truncateWireAtSegment) rather than taking the
        // whole host wire.
        const hashIdx = selectedId.indexOf('#seg');
        if (hashIdx===-1) {
          circuit.removeComponent(selectedId);
        } else {
          const wire = circuit.wires.get(selectedId.slice(0,hashIdx));
          const segIndex = Number(selectedId.slice(hashIdx+4));
          if (wire) engine.truncateWireAtSegment(wire, segIndex, circuit);
        }
        setSelectedId(null);refresh();
      }
    };
    window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn);
  },[selectedId]);

  // Ctrl/Cmd+S opens the save dialog instead of triggering the browser's
  // save-page action.
  useEffect(()=>{
    const fn=(e)=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&circuit.components.size!==0){
        e.preventDefault();
        setShowSave(true);
      }
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){
        e.preventDefault();
        setShowLoad(true);
      }
    };
    window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn);
  },[]);

  const doSave=()=>{
    const name=saveName.trim()||`Circuit ${saved.length+1}`;
    const data=circuit.serialize();
    // Saving over an existing name replaces that saved circuit, and if it's
    // also a registered custom gate, updates that gate's definition too
    // (below) — which can loop the custom-gate dependency graph back on
    // itself (A uses B, B uses C, and this save would make C use A again).
    // Check before touching anything, so a blocked save leaves both the
    // saved-circuits list and the custom registry untouched.
    if (customKinds.includes('CUSTOM:'+name)) {
      const cycle = findCustomCycle(name, data);
      if (cycle) {
        alert(`Can't save "${name}" — it would make the "${name}" custom gate depend on itself:\n${cycle.join(' → ')}\n\nBreak that chain (edit one of the gates so it no longer loops back to "${name}") before saving.`);
        return;
      }
    }
    const isUpdate=saved.some(s=>s.name===name);
    const next=[...saved.filter(s=>s.name!==name),{name,data,ts:Date.now()}];
    setSaved(next);localStorage.setItem('dss_v2',JSON.stringify(next));setShowSave(false);setSaveName('');
    if (customKinds.includes('CUSTOM:'+name)) {
      gates.registerCustomGate(name, data);
      upsertCustomRegistry(name, data);
    }
    showToast(`"${name}" ${isUpdate?'updated':'saved'}`);
  };
  const doLoad=(s)=>{circuit.load(s.data);setShowLoad(false);refresh();};
  // This only stops a custom kind from being placed again — it deliberately
  // doesn't touch GATE_DEFS/VIS, so components of that kind already sitting
  // on the canvas keep simulating instead of crashing on the next step().
  const removeCustomKind=(name)=>{
    removeFromCustomRegistry(name);
    setCustomKinds(prev=>prev.filter(k=>k!=='CUSTOM:'+name));
  };
  const delSaved=(name)=>{
    const n=saved.filter(s=>s.name!==name);
    setSaved(n);localStorage.setItem('dss_v2',JSON.stringify(n));
    // A saved circuit and an imported custom gate are linked only by name,
    // so drop the matching custom-gate registration too — otherwise it'd
    // keep reappearing in the palette (and rehydrating on reload) after its
    // source circuit is gone.
    removeCustomKind(name);
  };
  const onDeleteCustom=(kind)=>{
    if(!confirm('Remove the custom gate "' + kind.slice(7) + '" from the palette?'))return;
    removeCustomKind(kind.slice('CUSTOM:'.length));
  };
  const doImport=(s)=>{
    const kind=gates.registerCustomGate(s.name,s.data);
    upsertCustomRegistry(s.name,s.data);
    setCustomKinds(prev=>prev.includes(kind)?prev:[...prev,kind]);
  };
  const doClear=()=>{
    if(!confirm('Clear canvas?'))return;
    [...circuit.components.keys()].forEach(id=>circuit.removeComponent(id));
    refresh();
  };
  const generateEquation=()=>{

    const inputs = Array.from(circuit.ioComponents.values()).
      filter(c=>c.kind==='INPUT').
      sort((a,b)=>a.ioId.localeCompare(b.ioId));
    const outputs = Array.from(circuit.ioComponents.values()).
      filter(c=>c.kind==='OUTPUT').
      sort((a,b)=>a.ioId.localeCompare(b.ioId));

    if (inputs.length == 0) {
      alert('Your circuit has no inputs.');
      return;
    }

    let labels = new Set();
    for (let ioComp of inputs.concat(outputs)) {
      if (labels.has(ioComp.label)) {
        alert('Your circuit has duplicate labels.');
        break;
      } else { labels.add(ioComp.label); }
    }

    const outputMinterms = new Map(outputs.map(o=>[o, []]));
    const originalInputValues = inputs.map(inp=>inp.state.value);

    const combinations = 1 << inputs.length;
    for (let mask = 0; mask < combinations; mask++) {
      inputs.forEach((inp, idx)=>{ inp.state.value = (mask >> idx) & 1; });
      settleCircuit(circuit, 10);

      for (const output of outputs) {
        if (output.inputVals[0] === 1) {
          outputMinterms.get(output).push(mask);
        }
      }
    }

    inputs.forEach((inp, idx)=>{ inp.state.value = originalInputValues[idx]; });
    settleCircuit(circuit, 10);

    const equations = outputs.map(output=>{
      const terms = outputMinterms.get(output);
      const rhs = terms.length ? quineMcCluskey(terms, inputs.length, inputs.map((item) => (item.label.length === 1 ? item.label : `(${item.label})`))).expression : '0';
      return `${output.label} = ${rhs}`;
    });

    setEquation(equations.join('\n'));
  };

  function settleCircuit(circuit, maxSteps = 10) {
    for (let i = 0; i < maxSteps; i++) {
      circuit.step(performance.now(), 0, true);
    }
  }

  const loadEquation=()=>{
    const eq = equationToLoad.trim();
    const match = /^([A-Za-z])\s*=\s*(.+)$/.exec(eq);
    if (!match) {
      alert('Enter an equation like A = B + C\'');
      return;
    }

    const outputLabel = match[1];
    const rhs = match[2];
    const literalLabels = [...new Set((rhs.match(/[A-Za-z]/g) || []))].filter(l => l !== outputLabel);

    circuit.components.clear(); circuit.ioComponents.clear(); circuit.wires.clear();

    const labelsToComps = new Map();
    literalLabels.forEach((label, idx) => {
      const comp = circuit.addComponent("INPUT", 0, idx * 60, label);
      labelsToComps.set(label, comp);
    });

    const outputComp = circuit.addComponent("OUTPUT", 400, 0, outputLabel);

    let numAnds = 0;
    let numNots = 0;

    const wireFrom = (comp, pin=0) => ({compId: comp.id, pin});
    const parseLiteral = (literal) => {
      const label = literal[0];
      const comp = labelsToComps.get(label);
      if (!comp) throw new Error(`Unknown input label ${label}`);
      if (literal.endsWith("'")) {
        const notComp = circuit.addComponent("NOT", 100, numNots * 70);
        numNots++;
        circuit.addWire(wireFrom(comp), wireFrom(notComp));
        return wireFrom(notComp);
      }
      return wireFrom(comp);
    };

    const createAndTerm = (term) => {
      const literals = term.match(/[A-Za-z]'?/g) || [];
      if (literals.length === 0) return null;
      let current = parseLiteral(literals[0]);
      for (let i = 1; i < literals.length; i++) {
        const next = parseLiteral(literals[i]);
        const andComp = circuit.addComponent("AND", 200, numAnds * 70);
        numAnds++;
        circuit.addWire(current, {compId: andComp.id, pin: 0});
        circuit.addWire(next, {compId: andComp.id, pin: 1});
        current = {compId: andComp.id, pin: 0};
      }
      return current;
    };

    const orTerms = rhs.split('+').map(t => t.trim()).filter(Boolean);
    if (orTerms.length === 0) {
      alert('No terms found in the equation');
      return;
    }

    let outputSource = createAndTerm(orTerms[0]);
    for (let i = 1; i < orTerms.length; i++) {
      const nextTerm = createAndTerm(orTerms[i]);
      const orComp = circuit.addComponent("OR", 300, i * 70);
      circuit.addWire(outputSource, {compId: orComp.id, pin: 0});
      circuit.addWire(nextTerm, {compId: orComp.id, pin: 1});
      outputSource = {compId: orComp.id, pin: 0};
    }

    circuit.addWire(outputSource, {compId: outputComp.id, pin: 0});
    setShowLoad(false);
  }

  const n=circuit.components.size;

  return <div className="app">
    <div className="tb">
      <span className="tb-title">Circuit Simulator</span>
      {/* Save / Load / Clear */}
      <div className="tb-sep"/>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowSave(true)} disabled={n===0}>Save</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowLoad(true)}>Load</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={doClear} disabled={n===0}>Clear</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowEquation(true)}>Equation</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowSettings(true)}>Settings</button>
      {/* Propagation delay */}
      <div className="tb-delay">
        <span>Propagation Delay</span>
        <input type="range" min="10" max="2000" step="10" value={delayMs}
               onChange={e=>setDelayMs(Number(e.target.value))}/>
        <span className="tb-delay-val">{delayMs}ms</span>
      </div>
    </div>

    <div className="main">
      <Palette onDragStart={kind=>setPalDrag({kind})} onImportClick={()=>setShowLoad(true)} onDeleteCustom={onDeleteCustom} customKinds={customKinds}/>
      <div className="canvas-wrap">
        <Canvas circuit={circuit}
                selectedId={selectedId}
                onSelect={setSelectedId}
                paletteDrag={palDrag}
                onClearPaletteDrag={()=>setPalDrag(null)}
                onComponentChanged={refresh}
                snapGrid={true}/>
        <div className="fc">
          <span className="fc-n">{n}</span><span className="fc-lbl">gates</span>
          <span className="fc-div"/>
          <span className="fc-n">{circuit.wires.size}</span><span className="fc-lbl">wires</span>
        </div>
      </div>
    </div>

    {toast&&<div key={toast.key} className="toast">{toast.text}</div>}

    {showSave&&<Dialog title="Save circuit" onClose={()=>setShowSave(false)}>
      <input className="text-input" placeholder="My circuit" value={saveName} autoFocus
             onChange={e=>setSaveName(e.target.value)}
             onKeyDown={e=>e.key==='Enter'&&doSave()}/>
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>setShowSave(false)}>Cancel</button>
        <button className="btn primary" onClick={doSave}>Save</button>
      </div>
    </Dialog>}

    {showLoad&&<Dialog title="Saved circuits" onClose={()=>setShowLoad(false)}>
      {saved.length===0
        ? <div className="empty">No saved circuits yet.</div>
        : <div className="saved-list">{saved.map(s=><div key={s.name} className="saved-item">
            <div>
              <div className="saved-name">{s.name}</div>
              <div className="saved-meta">{s.data.components.length} gates · {s.data.wires.length} wires</div>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn ghost danger" onClick={()=>delSaved(s.name)}>Delete</button>
              <button className="btn ghost" onClick={()=>doImport(s)}>Import</button>
              <button className="btn primary" onClick={()=>doLoad(s)}>Load</button>
            </div>
          </div>)}</div>}
      <br/>
      <div className="modal-title">Load from Equation</div>
      <input className="text-input" placeholder="A = B" value={equationToLoad} autoFocus
             onChange={e=>setEquationToLoad(e.target.value)}
             onKeyDown={e=>e.key==='Enter'&&loadEquation()}/>
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>setShowLoad(false)}>Cancel</button>
        <button className="btn primary" onClick={loadEquation}>Load</button>
      </div>
    </Dialog>}

    {showEquation&&<Dialog title="Generate Boolean Equation" onClose={()=>setShowEquation(false)}>
      {equation === '' ? "No equation generated." : equation}
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>generateEquation()}>{equation === '' ? "Generate" : "Regenerate"}</button>
        <button className="btn ghost" onClick={()=>setShowEquation(false)}>Exit</button>
      </div>
    </Dialog>}

    {showSettings&&<Dialog title="Settings" onClose={()=>setShowSettings(false)}>
      {/* .prop-grid so both rows' selects start at the same x position —
          without it each row is its own flex line, and "Propagation Mode"
          vs "Propagation Style" being different lengths would leave the
          two dropdowns staggered instead of lined up. */}
      <div className="prop-grid">
        <div className="prop-option">
          <span className="prop-label">Propagation Mode</span>
          <select className="prop-input"
                    value={propagationMode}
                    onChange={e=>{setPropagationMode(e.target.value == "length" ? "length" : "component");onComponentChanged?.();}}>
              <option value="length">Length-Based Speed</option>
              <option value="component">Component-Based Speed</option>
          </select>
        </div>
        <div className="prop-option">
          <span className="prop-label">Propagation Style</span>
          <select className="prop-input"
                    value={propagationStyle}
                    onChange={e=>{setPropagationStyle(e.target.value == "discrete" ? "discrete" : "continuous");onComponentChanged?.();}}>
              <option value="continuous">Continuous</option>
              <option value="discrete">Discrete</option>
          </select>
        </div>
      </div>
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>setShowSettings(false)}>Exit</button>
      </div>
    </Dialog>}

  </div>;
}

function Dialog({title,children,onClose}){
  return <div className="modal-bg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">{title}</div>
      {children}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body>
</html>
