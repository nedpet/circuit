<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Circuit Simulator — Beamer+</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script src="quine_mccluskey.js"></script>
<script src="modules.js"></script>

<!--
  Load order matters: each defineModule() call resolves its deps eagerly
  against modules already registered (see modules.js), so a module must
  appear after everything it depends on.

  state.js/engine.js are plain JS (no JSX) and load as external files just
  fine over file://. gates/canvas/palette/app below contain JSX, so they
  have to stay inline: Babel standalone transforms inline <script
  type="text/babel"> blocks directly, but for src="..." it fetches the file
  itself via XHR, which Chrome blocks as a cross-origin request when the
  page is opened as a local file (same restriction that rules out native
  ES modules here). Splitting those four into real files would require
  serving this over http(s) instead of opening it directly.
-->
<script src="state.js"></script>
<script src="engine.js"></script>

<script type="text/babel">
/* ═══ GATES ════════════════════════════════════════════════════════════════ */
defineModule('gates', ['engine'], (engine) => {
  'use strict';
  const { GATE_DEFS } = engine;

  const FAMILY_FILL = { and:'#fffae3', or:'#e8f5ee', not:'#ede8f7', xor:'#e4eef8', mux: '#fff1e3', seq:'#fce8ee', io:'#fefce8', misc:'#ede8f7' };
  const VIS = {};
  const W=80,H=80,BX=12,YT=20,YB=60,YO=40,BT=6,BB=74;

  // Fills in left-to-right as a pending output counts down its gate delay,
  // so the bar reads as a progress indicator for the value about to land.
  function PendingBar({pendingStart, delay, value}) {
    const [now, setNow] = React.useState(performance.now());
    React.useEffect(()=>{
      let r; const l=()=>{setNow(performance.now()); r=requestAnimationFrame(l);};
      r=requestAnimationFrame(l); return ()=>cancelAnimationFrame(r);
    }, []);
    const t = delay>0 ? Math.min(1,(now-(pendingStart||now))/delay) : 1;
    return <rect x="20" y="-5" width={40*t} height="5" fill={value ? "var(--high)" : "var(--low)"}/>;
  }

  // Shared by every gate's body: renders the PendingBar above the shape
  // when the gate's single output is counting down its gate delay.
  function pendingBar(comp) {
    return comp.pendingOutputVals && comp.pendingOutputVals[0]!==undefined &&
      <PendingBar pendingStart={comp.pendingOutputStart[0]} delay={comp.delay||0} value={comp.pendingOutputVals[0]}/>;
  }

  VIS.AND  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} H ${W*.5} a ${(BB-BT)/2} ${(BB-BT)/2} 0 0 1 0 ${BB-BT} H ${BX} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
    </g> };
  VIS.OR   = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.5} ${BB}, ${W-2} ${YO} Q ${W*.5} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
    </g> };
  VIS.NOT  = { w:80,h:40, inputs:[{x:0,y:20}], outputs:[{x:80,y:20}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d="M 12 6 L 60 20 L 12 34 Z" fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx="66" cy="20" r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  VIS.NAND = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} H ${W*.45} a ${(BB-BT)/2} ${(BB-BT)/2} 0 0 1 0 ${BB-BT} H ${BX} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx={W-7} cy={YO} r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  VIS.NOR  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.45} ${BB}, ${W-12} ${YO} Q ${W*.45} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx={W-7} cy={YO} r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  VIS.XOR  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX-6} ${BT} Q ${BX+8} ${YO}, ${BX-6} ${BB}`} fill="none" stroke="var(--ink)" strokeWidth="2"/>
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.5} ${BB}, ${W-2} ${YO} Q ${W*.5} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
    </g> };
  VIS.XNOR = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f, comp)=><g>
      {pendingBar(comp)}
      <path d={`M ${BX-6} ${BT} Q ${BX+8} ${YO}, ${BX-6} ${BB}`} fill="none" stroke="var(--ink)" strokeWidth="2"/>
      <path d={`M ${BX} ${BT} Q ${BX+14} ${YO}, ${BX} ${BB} Q ${W*.45} ${BB}, ${W-12} ${YO} Q ${W*.45} ${BT}, ${BX} ${BT} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      <circle cx={W-7} cy={YO} r="5" fill={f} stroke="var(--ink)" strokeWidth="2"/>
    </g> };
  // MUX's data-input count (2-4) is per-instance, unlike every other gate's
  // fixed arity — the select pin always sits one slot past the last data
  // pin, so it moves down as inputs are added. Vertical pin spacing (40px,
  // matching YB-YT for the original 2-input layout) and the 20px top/bottom
  // margin stay constant; only the body height grows to fit, with the
  // output re-centered — never touching W, BX or the other gates' shared
  // YT/YB/BT/BB constants.
  const MUX_PIN_GAP=40, MUX_TOP_MARGIN=20;
  function buildMuxVis(n, bottom) {
    const h = n*MUX_PIN_GAP; // 80 for n=2, matching the original fixed H
    const inputs = Array.from({length:n},(_,i)=>({x:0,y:MUX_TOP_MARGIN+i*MUX_PIN_GAP}));
    const outY = h/2, bt=6, bb=h-6;
    // The body's top edge is the diagonal from (BX,bt) to (W-BX,bt+bb*.25);
    // at x=W*0.5 (the select pin's x) that line sits at bt+bb/8. Placing the
    // pin 12px above that (the same fixed stub length pinStub uses for every
    // other pin) makes its stub land exactly on the edge instead of the
    // fixed y=5 that only happened to line up for the original 2-input size
    // — without this, taller bodies (3-4 inputs) pull the edge down but the
    // stub stayed put, opening a visible gap above the select pin.
    // The bottom edge is the mirror-image diagonal, from (W-BX,bb*.75) to
    // (BX,bb); by the same symmetry it sits at bb*7/8 under the select pin's
    // x, and since the pin now points 'down' (away from the body, toward
    // larger y) the 12px stub sits 12px *below* that edge instead of above.
    const selectY = bottom ? (bb*.75 + bb/8) + 12 : (bt + bb/8) - 12;
    inputs.push({x:W*0.5,y:selectY,dir: bottom ? 'down' : 'up'});
    return { w:W, h, inputs, outputs:[{x:W,y:outY}],
      body:(f, comp)=><g>
        {pendingBar(comp)}
        <path d={`M ${BX} ${bt} L ${W - BX} ${bt + bb*.25} V ${bb*.75} L ${BX} ${bb} Z`} fill={f} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round"/>
      </g> };
  }
  const muxVisCache = {};
  function muxVis(n, selectLocation) {
    const count = Math.max(2, Math.min(4, n|0||2));
    const bottom = selectLocation==='bottom';
    const key = count+(bottom?'b':'t');
    return muxVisCache[key] || (muxVisCache[key] = buildMuxVis(count, bottom));
  }
  VIS.MUX = muxVis(2);

  // SPLIT, in its default 'split' type, fans a single multi-bit bus out
  // into `bits` (2-8) individual 1-bit pins. It's deliberately drawn as
  // bare wire, not a gate body: a vertical "trunk" with each tap every
  // `space` grid cells (reusing the standard 12px pin stub for each tap's
  // little leg), starting right where a one-grid-cell 45° lead-in from the
  // single `bits`-wide pin meets the trunk. Tap i reads/writes bit i (0 =
  // topmost, nearest the diagonal = LSB) — arbitrary but fixed, so wiring
  // is predictable; engine.js's SPLIT compute() matches this order. Each
  // tap is labeled with its bit index, on whichever side of the trunk its
  // stub *isn't* on, so the label never sits under the pin's own leg.
  // 'merge' type is the exact reverse in every sense: the taps become
  // inputs (many 1-bit values combining into one) and the diagonal pin
  // becomes the output, AND the whole shape mirrors horizontally (taps
  // move to the left, diagonal to the right) — so a right-facing 'merge'
  // reads as the mirror image of a right-facing 'split' (equivalently: the
  // same picture a left-facing 'split' already draws), making the two
  // types visually distinguishable at a glance even before you trace which
  // way the pins point.
  // All three of bits/space/type are per-instance like MUX's muxInputs, so
  // geometry is built/cached the same way.
  const SPLIT_UNIT = 20; // matches Canvas' GRID (20px snap), so the diagonal lands on a clean cell and taps line up with the grid
  function buildSplitVis(n, space, merge) {
    const gap = space*SPLIT_UNIT, topY = SPLIT_UNIT;
    const w = SPLIT_UNIT + 12; // total width is the same either way — just mirrored
    // 'split': diagonal at (0,0), trunk at x=20, taps at x=32 (right).
    // 'merge': the horizontal mirror of that (x -> w-x): diagonal at
    // (32,0), trunk at x=12, taps at x=0 (left).
    const trunkX = merge ? w-SPLIT_UNIT : SPLIT_UNIT;
    const tapX   = merge ? 0 : w;
    const diagX  = merge ? w : 0;
    const taps = Array.from({length:n}, (_,i)=>({x:tapX, y:topY+i*gap}));
    // The diagonal's far end is this pin's whole connector, drawn in full
    // by body() below — GateBody's generic (cardinal-only) stub renderer
    // is skipped for it (noStub) instead of adding a second, wrongly-angled leg.
    const diagPin = {x:diagX, y:0, dir:'up', noStub:true};
    const lastY = topY + (n-1)*gap;
    return { w, h: lastY,
      inputs:  merge ? taps : [diagPin],
      outputs: merge ? [diagPin] : taps,
      body:()=><g>
        {/* Invisible fat hit-area — the visible body is just two thin
            strokes with nothing to fill, so without this, clicking to
            select/drag the component anywhere off those exact pixels (the
            wire-like point of the whole design) would silently miss it. */}
        <rect x="0" y="0" width={w} height={lastY} fill="transparent"/>
        <line x1={trunkX} y1={topY} x2={diagX} y2="0" stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>
        <line x1={trunkX} y1={topY} x2={trunkX} y2={lastY} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>
        {taps.map((p,i)=>(
          <text key={i} x={merge ? trunkX+6 : trunkX-6} y={p.y+3} textAnchor={merge ? 'start' : 'end'}
                fontFamily="var(--mono)" fontSize="8" fontWeight="600" fill="var(--ink)" opacity="0.6">{i}</text>
        ))}
      </g> };
  }
  const splitVisCache = {};
  function splitVis(n, space, type) {
    const bits = Math.max(2, Math.min(8, n|0||2));
    const sp = Math.max(1, Math.min(8, space|0||1));
    const merge = type==='merge';
    const key = bits+'_'+sp+'_'+(merge?'m':'s');
    return splitVisCache[key] || (splitVisCache[key] = buildSplitVis(bits, sp, merge));
  }
  VIS.SPLIT = splitVis(2, 1, 'split');


  VIS.INPUT = { w:60,h:40, inputs:[], outputs:[{x:60,y:20}],
    body:(f,comp)=>{
      const on=comp.state.value;
      return <g>
        <rect x="4" y="4" width="52" height="32" rx="16" fill={on?'#fef3c7':'#f3f3f1'} stroke="var(--ink)" strokeWidth="2"/>
        <circle cx={on?40:20} cy="20" r="11" fill="white" stroke="var(--ink)" strokeWidth="1.5"/>
      </g>;
    },
    // Rendered directly by GateBody (see mirrorTexts there) instead of
    // through vis.body, so a facing:'left' INPUT doesn't pay
    // unmirrorText's recursive walk-and-clone cost across its whole body
    // just to keep these two upright — with many INPUTs on screen (e.g.
    // one per bit of a wide bus, all facing left for a tidy layout) that
    // cost multiplies badly, frame after frame.
    mirrorTexts:(comp)=>{
      const on=comp.state.value;
      return [
        {x:on?18:38, y:24, anchor:'middle', fontSize:11, opacity:0.45, text:on?'1':'0'},
        {x:-15, y:26, anchor:'end', fontSize:16, opacity:0.8, text:comp.label},
      ];
    },
  };

  // Multi-bit INPUT/OUTPUT: each pin still carries exactly one bus value (an
  // integer, masked to comp.bitWidth in engine.js), so pin *count* never
  // changes — only how wide the component is drawn to show that many bits.
  // Cells render leftmost = most-significant bit. `data-bit` is read back by
  // Canvas's existing drag/click detection (onCompMouseDown/onUp) via plain
  // DOM event-target bubbling, so no extra handler plumbing is needed here.
  const BIT_CELL_W=18, BIT_CELL_H=24, BIT_GAP=3, BIT_PAD=8;
  function bitsRowWidth(n) { return BIT_PAD*2 + n*BIT_CELL_W + Math.max(0,n-1)*BIT_GAP; }
  function BitCells({ n, value, editable }) {
    const cy=20;
    return Array.from({length:n},(_,i)=>{
      const bit=n-1-i;
      const on=(value>>>bit)&1;
      const cx=BIT_PAD+i*(BIT_CELL_W+BIT_GAP);
      return <g key={bit}>
        <rect x={cx} y={cy-BIT_CELL_H/2} width={BIT_CELL_W} height={BIT_CELL_H} rx="4"
              data-bit={editable?bit:undefined}
              fill={on?'#fef3c7':'#f3f3f1'} stroke="var(--low)" strokeWidth="1.5"
              style={editable?{cursor:'pointer'}:undefined}/>
        <text x={cx+BIT_CELL_W/2} y={cy+4} textAnchor="middle" fontFamily="var(--mono)" fontSize="12"
              fontWeight="600" fill="var(--ink)" opacity="0.55" pointerEvents="none">{on?'1':'0'}</text>
      </g>;
    });
  }
  // One cell per hex digit (4 bits/cell) instead of one cell per bit, so a
  // hex-mode INPUT/OUTPUT is narrower than its binary counterpart — reuses
  // regValueText's zero-padded string so the digits always match the text
  // readout used elsewhere (e.g. REG). `data-shift` (the low bit of that
  // digit's nibble) is read back the same way BitCells' `data-bit` is, and
  // clicking bumps the whole nibble by 1 rather than toggling a single bit.
  function HexCells({ n, value, editable }) {
    const cy=20, text=regValueText(value, n, 'hex'), digits=text.length;
    return text.split('').map((ch,i)=>{
      const shift=(digits-1-i)*4;
      const cx=BIT_PAD+i*(BIT_CELL_W+BIT_GAP);
      return <g key={i}>
        <rect x={cx} y={cy-BIT_CELL_H/2} width={BIT_CELL_W} height={BIT_CELL_H} rx="4"
              data-shift={editable?shift:undefined}
              fill="#f3f3f1" stroke="var(--low)" strokeWidth="1.5"
              style={editable?{cursor:'pointer'}:undefined}/>
        <text x={cx+BIT_CELL_W/2} y={cy+4} textAnchor="middle" fontFamily="var(--mono)" fontSize="12"
              fontWeight="600" fill="var(--ink)" opacity="0.55" pointerEvents="none">{ch}</text>
      </g>;
    });
  }
  // BitCells/HexCells always draw MSB-leftmost/LSB-rightmost; that reading
  // order needs to stay put regardless of which way the component faces, so
  // flipping facing right<->left doesn't relabel which physical slot shows
  // which bit. GateBody mirrors a facing:'left' component with
  // `translate(w,0) scale(-1,1)`; applying that same transform a second
  // time here cancels it (two mirrors = identity), so the cell row renders
  // identically either way. Tagged data-stable so unmirrorText — which
  // otherwise counter-mirrors every <text> it finds — leaves this subtree
  // alone instead of correcting it a second time.
  function stableBlock(comp, w, children) {
    return comp.facing==='left'
      ? <g data-stable="true" transform={`translate(${w} 0) scale(-1 1)`}>{children}</g>
      : <g>{children}</g>;
  }
  // hex mode packs 4 bits/cell, so its cell count (and thus w) differs from
  // binary's one-cell-per-bit layout — cached per (bitWidth, mode) pair since
  // the box width itself changes, not just the digits drawn inside it.
  function buildInputVis(n, hex) {
    const cellCount = hex ? Math.ceil(n/4) : n;
    const w=bitsRowWidth(cellCount), h=40;
    return { w, h, inputs:[], outputs:[{x:w,y:20}],
      body:(f,comp)=><g>
        <rect x="2" y="4" width={w-4} height="32" rx="8" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
        {stableBlock(comp, w, hex ? HexCells({n, value:comp.state.value||0, editable:true}) : BitCells({n, value:comp.state.value||0, editable:true}))}
      </g>,
      // See VIS.INPUT's mirrorTexts comment.
      mirrorTexts:(comp)=>[{x:-15, y:26, anchor:'end', fontSize:16, opacity:0.8, text:comp.label}],
    };
  }
  // Same hex/binary cell-count split as buildInputVis. The input pin sits at
  // x=0 regardless, so resizing never moves a wire.
  function buildOutputVis(n, hex) {
    const cellCount = hex ? Math.ceil(n/4) : n;
    const w=bitsRowWidth(cellCount), h=40;
    return { w, h, inputs:[{x:0,y:20}], outputs:[],
      body:(f,comp)=><g>
        <rect x="2" y="4" width={w-4} height="32" rx="8" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
        {stableBlock(comp, w, hex ? HexCells({n, value:comp.inputVals[0]||0}) : BitCells({n, value:comp.inputVals[0]||0, editable:false}))}
      </g>,
      // See VIS.OUTPUT's mirrorTexts comment.
      mirrorTexts:(comp)=>[{x:w+15, y:26, anchor:'start', fontSize:16, opacity:0.8, text:comp.label}],
    };
  }
  const inputVisCache={}, outputVisCache={};
  function inputVis(bw, mode) {
    const n=Math.max(1,Math.min(32,bw|0||1));
    if (n<=1) return VIS.INPUT;
    const hex = mode==='hex';
    const key = n+(hex?'h':'b');
    return inputVisCache[key] || (inputVisCache[key]=buildInputVis(n, hex));
  }
  function outputVis(bw, mode) {
    const n=Math.max(1,Math.min(32,bw|0||1));
    if (n<=1) return VIS.OUTPUT;
    const hex = mode==='hex';
    const key = n+(hex?'h':'b');
    return outputVisCache[key] || (outputVisCache[key]=buildOutputVis(n, hex));
  }
  // CONST's multi-bit body deliberately does NOT reuse INPUT/OUTPUT's
  // per-bit cell grid — that made a multi-bit CONST visually indistinguishable
  // from a multi-bit INPUT/OUTPUT at a glance. Instead it's just one string
  // (the same regValueText formatting REG's readout uses), echoing the
  // plain single-digit look the 1-bit CONST circle already has. Digit count
  // — and so box width — depends only on n/hex (regValueText zero-pads to a
  // fixed length), not on the actual value, so it can be sized here same as
  // bitsRowWidth is for the cell-grid components.
  const CONST_CHAR_W=9, CONST_PAD=12;
  function buildConstVis(n, hex) {
    const digits = hex ? Math.ceil(n/4) : n;
    const w=Math.max(40, digits*CONST_CHAR_W + CONST_PAD*2), h=40;
    return { w, h, inputs:[], outputs:[{x:w,y:20}],
      body:(f,comp)=>{
        const text = regValueText(comp.state.value||0, n, hex?'hex':'bin');
        return <g>
          <rect x="2" y="7" width={w-4} height="26" rx="10" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
          <text x={w/2} y="26" fontFamily="var(--mono)" fontSize="16" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity="0.8">{text}</text>
        </g>;
      }
    };
  }
  const constVisCache={};
  function constVis(bw, mode) {
    const n=Math.max(1,Math.min(32,bw|0||1));
    if (n<=1) return VIS.CONST;
    const hex = mode==='hex';
    const key = n+(hex?'h':'b');
    return constVisCache[key] || (constVisCache[key]=buildConstVis(n, hex));
  }
  // Single point every consumer (rendering, pin geometry, wiring) should go
  // through instead of `VIS[comp.kind]` directly, since INPUT/OUTPUT/CONST,
  // MUX and SPLIT no longer have a fixed size — everything else still does.
  function visForComp(comp) {
    if (comp.kind==='INPUT') return inputVis(comp.bitWidth, comp.displayMode);
    if (comp.kind==='OUTPUT') return outputVis(comp.bitWidth, comp.displayMode);
    if (comp.kind==='CONST') return constVis(comp.bitWidth, comp.displayMode);
    if (comp.kind==='MUX') return muxVis(comp.muxInputs, comp.muxSelectLocation);
    if (comp.kind==='SPLIT') return splitVis(comp.bits, comp.space, comp.splitType);
    return VIS[comp.kind];
  }

  VIS.CLOCK = { w:60,h:40, inputs:[], outputs:[{x:60,y:20}],
    body:(f,comp)=>{
      const on=comp.state.value, paused=comp.state.paused;
      return <g>
        <rect x="4" y="4" width="52" height="32" rx="8" fill={paused?'#f3f3f1':'#fefce8'} stroke="var(--ink)" strokeWidth="2"/>
        {paused ? <>
          <rect x="20" y="13" width="6" height="14" rx="2" fill="var(--ink)" opacity="0.3"/>
          <rect x="30" y="13" width="6" height="14" rx="2" fill="var(--ink)" opacity="0.3"/>
        </> : <path d="M 12 28 L 18 28 L 18 14 L 28 14 L 28 28 L 38 28 L 38 14 L 44 14"
              fill="none" stroke={on?'var(--high)':'var(--ink)'}
              strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
      </g>;
    }
  };

  VIS.CONST = { w:40,h:40, inputs:[], outputs:[{x:38,y:20}],
    body:(f,comp)=>{
      const on=comp.state.value;
      return <g>
        <circle cx="18" cy="20" r="13" fill={on==1?'#fde68a':'#f3f3f1'} stroke="var(--ink)" strokeWidth="2"/>
        <text x="18" y="26" fontFamily="var(--mono)" fontSize="16" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity="0.8">{comp.state.value}</text>
      </g>;
    }
  };

  VIS.OUTPUT = { w:40,h:40, inputs:[{x:0,y:20}], outputs:[],
    body:(f,comp)=>{
      const on=comp.inputVals[0];
      return <g>
        {on?<circle cx="22" cy="20" r="20" fill="#fef3c7" opacity="0.55"/>:null}
        <circle cx="22" cy="20" r="13" fill={on?'#fde68a':'#f3f3f1'} stroke="var(--ink)" strokeWidth="2"/>
        <path d="M 17 26 L 17 30 L 27 30 L 27 26" fill="none" stroke="var(--ink)" strokeWidth="1.5" strokeLinecap="round"/>
        {on?<g stroke="#d97706" strokeWidth="1.5" strokeLinecap="round">
          <line x1="22" y1="3"  x2="22" y2="6"/><line x1="37" y1="20" x2="40" y2="20"/>
          <line x1="4"  y1="20" x2="7"  y2="20"/><line x1="33" y1="9"  x2="35" y2="7"/>
          <line x1="11" y1="9"  x2="9"  y2="7"/>
        </g>:null}
      </g>;
    },
    // Rendered directly by GateBody (see mirrorTexts there) instead of
    // through vis.body, so a facing:'left' OUTPUT doesn't pay
    // unmirrorText's recursive walk-and-clone cost across its whole body
    // just to keep these two upright — with many OUTPUTs on screen (e.g.
    // one per bit of a wide bus, all facing left for a tidy layout) that
    // cost multiplies badly, frame after frame.
    mirrorTexts:(comp)=>{
      const on=comp.inputVals[0];
      return [
        {x:55, y:26, anchor:'start', fontSize:16, opacity:0.8, text:comp.label},
        {x:22, y:24, anchor:'middle', fontSize:11, opacity:0.45, text:on?'1':'0'},
      ];
    },
  };

  VIS.SEVEN = { w:W, h:H*1.5, inputs:[{x:W*0.2,y:0,dir:'up'}, {x:W*0.4,y:0,dir:'up'}, {x:W*0.6,y:0,dir:'up'}, {x:W*0.8,y:0,dir:'up'}, {x:W*0.2,y:H*1.5,dir:'down'}, {x:W*0.4,y:H*1.5,dir:'down'}, {x:W*0.6,y:H*1.5,dir:'down'}], outputs:[],
    body:(f,comp)=><g>
        <rect x="6" y="10" width="68" height="100" rx="7" fill="#f3f3f1" stroke="var(--ink)" strokeWidth="2"/>
        <rect x="22" y="16" width="36" height="8" fill={comp.inputVals[2]?'#ff3333':'#aeaeae'}/>
        <rect x="22" y="56" width="36" height="8" fill={comp.inputVals[0]?'#ff3333':'#aeaeae'}/>
        <rect x="22" y="96" width="36" height="8" fill={comp.inputVals[5]?'#ff3333':'#aeaeae'}/>
        <rect x="12" y="22" width="8" height="36" fill={comp.inputVals[1]?'#ff3333':'#aeaeae'}/>
        <rect x="12" y="62" width="8" height="36" fill={comp.inputVals[4]?'#ff3333':'#aeaeae'}/>
        <rect x="60" y="22" width="8" height="36" fill={comp.inputVals[3]?'#ff3333':'#aeaeae'}/>
        <rect x="60" y="62" width="8" height="36" fill={comp.inputVals[6]?'#ff3333':'#aeaeae'}/>
      </g>
  };

  function ffRect(f,h){return<rect x="6" y="6" width="68" height={h-12} rx="7" fill={f} stroke="var(--ink)" strokeWidth="2"/>;}
  const ffTxt=(x,y,t)=><text x={x} y={y} fontFamily="var(--mono)" fontSize="12" fill="var(--ink)">{t}</text>;
  const ffSub=(t)=><text x="40" y="70" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">{t}</text>;

  VIS.DFF  = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}],            outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,80)}{ffTxt(14,24,'D')}{ffTxt(14,64,'▷')}{ffTxt(62,44,'Q')}{ffSub('D')}</g>};
  VIS.TFF  = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}],            outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,80)}{ffTxt(14,24,'T')}{ffTxt(14,64,'▷')}{ffTxt(62,44,'Q')}{ffSub('T')}</g>};
  VIS.SRFF = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}],            outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,80)}{ffTxt(14,24,'S')}{ffTxt(14,64,'R')}{ffTxt(62,44,'Q')}{ffSub('SR')}</g>};
  VIS.JKFF = {w:80,h:120, inputs:[{x:0,y:20},{x:0,y:60},{x:0,y:100}],outputs:[{x:80,y:40}], body:(f,comp)=><g>{pendingBar(comp)}{ffRect(f,120)}{ffTxt(14,24,'J')}{ffTxt(14,64,'K')}{ffTxt(14,104,'▷')}{ffTxt(62,44,'Q')}<text x="40" y="110" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">JK</text></g>};

  // REG's D input and Q output are the only pins that scale with bitWidth
  // (EN/CLK/RESET stay 1-bit control lines — enforced in engine.js), so only
  // the little value readout above the box needs to grow; the box itself and
  // its pin layout stay fixed, unlike INPUT/OUTPUT's whole-body resize.
  function regValueText(value, bitWidth, mode) {
    const v = (value||0) >>> 0;
    if (mode === 'hex') return v.toString(16).toUpperCase().padStart(Math.ceil(bitWidth/4), '0');
    return v.toString(2).padStart(bitWidth, '0');
  }
  const REG_CHAR_W=7, REG_VAL_PAD=6;
  VIS.REG =  {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:40},{x:0,y:60},{x:40,y:84,dir:'down'}], outputs:[{x:80,y:40}],
    body:(f,comp)=>{
      const bw=comp.bitWidth||1, text=regValueText(comp.state.q, bw, comp.displayMode||'bin');
      const valW=Math.max(12, text.length*REG_CHAR_W + REG_VAL_PAD*2);
      return <g>
        {pendingBar(comp)}
        {ffRect(f,80)}
        {ffTxt(10,24,'D')}
        {ffTxt(10,44,'EN')}
        {ffTxt(10,64,'▷')}
        {ffTxt(36,70,'R')}
        {ffTxt(64,44,'Q')}
        <rect x={40-valW/2} y="-14" width={valW} height="16" rx="2" fill="var(--low)" opacity="0.75"/>
        <text x="40" y="-2" fontFamily="var(--mono)" fontSize="11" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity="0.45">{text}</text>
        <text x="40" y="44" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">REG</text>
      </g>;
    }};

  VIS.SHFT = {w:80,h:80,  inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
      body:(f,comp)=>{
        return <g>
          {ffRect(f,80)}
          <text x="40" y="44" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">SHIFT</text>
          {comp.shiftMode === "right" ? <path d="M 46 65 L 40 61 L 40 63 L 34 63 L 34 67 L 40 67 L 40 69 Z" fill="var(--ink)" opacity="0.85"/>
            : comp.shiftMode === "arith" ? <g><path d="M 46 65 L 40 61 L 40 63 L 38 63 L 38 67 L 40 67 L 40 69 Z" fill="var(--ink)" opacity="0.85"/><path d="M 37 63 L 37 67 L 34 67 L 34 63 Z" fill="var(--ink)" opacity="0.85"/></g>
            : <path d="M 34 65 L 40 61 L 40 63 L 46 63 L 46 67 L 40 67 L 40 69 Z" fill="var(--ink)" opacity="0.85"/>
          }
          
        </g>;
      }};

  // Single in/out (unlike SHFT's value+shift-amount pair), centered to match
  // the output's y=40 — GATE_DEFS.EXTND has inputs:1.
  VIS.EXTND = {w:80,h:80,  inputs:[{x:0,y:40}], outputs:[{x:80,y:40}],
      body:(f,comp)=>{
        return <g>
          {ffRect(f,80)}
          <text x="40" y="44" fontFamily="var(--ui)" fontSize="9" textAnchor="middle" fill="var(--ink)" opacity="0.38">EXTEND</text>
          <path d="M 32 65 L 37 61 L 37 63 L 43 63 L 43 61 L 48 65 L 43 69 L 43 67 L 37 67 L 37 69 Z" fill="var(--ink)" opacity="0.85"/>
        </g>;
      }};

  // Per-pin facing: each pin stub normally points 'left' (inputs) or 'right'
  // (outputs) toward the gate body, but a pin can override this with its own
  // `dir` ('left'|'right'|'up'|'down') to poke out a different side — e.g. a
  // mux's select pin facing 'up' — independent of the whole gate's `facing`.
  const PIN_DIR_VEC = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] };
  function pinStub(p, defaultDir) {
    const [dx,dy] = PIN_DIR_VEC[p.dir||defaultDir];
    return { x1:p.x-dx*12, y1:p.y-dy*12, x2:p.x, y2:p.y };
  }

  // Facing 'left' draws the gate body under `scale(-1 1)` so the shape and
  // pins mirror correctly — but that flips glyphs too, rendering labels as
  // mirror-writing. This walks the body's element tree and wraps every
  // <text> in its own local counter-scale (pivoting on that text's own x),
  // which cancels the ancestor flip for the glyphs while leaving the text's
  // position subject to the same mirroring as everything else. textAnchor
  // is flipped start<->end to match: a label anchored to grow rightward off
  // its pin should grow leftward once that pin is on the mirrored side.
  // Only recurses into plain SVG host elements (string types) and
  // Fragments — real components (e.g. <PendingBar/>) are opaque here since
  // their output doesn't exist until they render, so they're left under the
  // ordinary mirror transform, same as before.
  //
  // A recursive walk-and-clone of the *entire* body, run fresh every
  // frame, is fine for gates that show up a handful at a time, but INPUT
  // and OUTPUT are routinely placed dozens deep (one per bus bit) — so
  // they skip this altogether and apply the exact same wrapper directly,
  // to just their own known label text, via vis.mirrorTexts (see
  // GateBody). This still runs for whatever's left in their body (a rect,
  // some circles), which is why it needs to stay correct in general, not
  // just fast for the common case.
  function unmirrorText(node) {
    if (Array.isArray(node)) return node.map(unmirrorText);
    if (!React.isValidElement(node)) return node;
    // Already self-corrected (see stableBlock) — reprocessing its <text>
    // descendants here would cancel that correction back out.
    if (node.props?.['data-stable']) return node;
    if (node.type === 'text') {
      const x = node.props.x || 0;
      const anchor = node.props.textAnchor;
      const flipped = anchor==='start' ? 'end' : anchor==='end' ? 'start' : anchor;
      // Carries the original element's key onto this wrapper — needed
      // whenever the text came from a keyed list (e.g. SPLIT's per-tap bit
      // labels), since `key` lives outside `.props` and isn't copied by
      // just nesting the old element inside a new one.
      return <g key={node.key} transform={`translate(${x} 0) scale(-1 1) translate(${-x} 0)`}>
        {React.cloneElement(node, {textAnchor: flipped})}
      </g>;
    }
    if ((typeof node.type === 'string' || node.type === React.Fragment) && node.props?.children != null) {
      const processed = unmirrorText(node.props.children);
      // Spread array children back into positional args — passing a bare
      // array as the sole child triggers React's "list needs keys" check
      // (it assumes a .map() result), which the original static JSX
      // children list never hit.
      return Array.isArray(processed)
        ? React.cloneElement(node, {}, ...processed)
        : React.cloneElement(node, {}, processed);
    }
    return node;
  }

  function GateBody({ comp }) {
    const def=GATE_DEFS[comp.kind], vis=visForComp(comp);
    if (!vis) return null;
    const fill=FAMILY_FILL[def.family]||'#fff';
    const mirrored = comp.facing==='left';
    const body = <>
      {vis.body(fill,comp)}
      {['AND','OR','NAND','NOR','XOR','XNOR','MUX'].includes(comp.kind)&&
        <text x={vis.w/2+2} y={vis.h/2+4} textAnchor="middle" fontFamily="var(--mono)" fontSize="10" fontWeight="600" fill="var(--ink)" opacity="0.35" pointerEvents="none">{def.label}</text>}
    </>;
    return <g transform={mirrored
                          ? `translate(${vis.w} 0) scale(-1 1)`
                          : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${vis.w/2} ${vis.h/2})`}>
      {vis.inputs.map((p,i)=>{if(p.noStub) return null; const s=pinStub(p,'left');return <line key={'i'+i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>;})}
      {vis.outputs.map((p,i)=>{if(p.noStub) return null; const s=pinStub(p,'right');return <line key={'o'+i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke="var(--ink)" strokeWidth="2" strokeLinecap="round"/>;})}
      {mirrored ? unmirrorText(body) : body}
      {/* Same glyphs-upright trick unmirrorText uses, but authored directly
          for these known, fixed-position texts instead of discovered by
          recursively walking and cloning the whole body every frame — see
          vis.mirrorTexts on VIS.INPUT/VIS.OUTPUT/buildInputVis/
          buildOutputVis, the kinds dense enough (one per bus bit, often
          all facing left for a tidy layout) for that walk's cost to
          actually add up frame over frame. When facing isn't 'left'
          there's nothing to correct — GateBody's outer transform is a
          rotation there, not a mirror — so the text renders plain. */}
      {vis.mirrorTexts && vis.mirrorTexts(comp).map((t,i)=>{
        const text = <text x={t.x} y={t.y}
              textAnchor={mirrored ? (t.anchor==='start'?'end':t.anchor==='end'?'start':t.anchor) : t.anchor}
              fontFamily="var(--mono)" fontSize={t.fontSize} fontWeight={t.fontWeight||600}
              fill="var(--ink)" opacity={t.opacity}>{t.text}</text>;
        return mirrored
          ? <g key={i} transform={`translate(${t.x} 0) scale(-1 1) translate(${-t.x} 0)`}>{text}</g>
          : <React.Fragment key={i}>{text}</React.Fragment>;
      })}
    </g>;
  }

  // Registers a saved circuit as a placeable gate: a white rounded box sized
  // to fit its inputs (left) / outputs (right), simulated as a black box by
  // running a private nested circuit to settling on every compute() call.
  const CUSTOM_PIN_MARGIN = 20, CUSTOM_PIN_GAP = 30;
  function customPinYs(n, h) {
    if (n <= 1) return [h/2];
    const usable = h - CUSTOM_PIN_MARGIN*2;
    return Array.from({length:n}, (_,i)=>CUSTOM_PIN_MARGIN + usable*i/(n-1));
  }
  // Greedy word-wrap for the gate-name label, sized for a monospace font at
  // fontSize 10 (~6px/char); a single word longer than the line is hard-broken
  // so it can't overflow the box regardless.
  function wrapLabel(text, maxChars) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur+' '+w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; } else { cur = test; }
    }
    if (cur) lines.push(cur);
    return lines.flatMap(line => {
      if (line.length <= maxChars) return [line];
      const chunks = [];
      for (let i=0;i<line.length;i+=maxChars) chunks.push(line.slice(i,i+maxChars));
      return chunks;
    });
  }
  function registerCustomGate(name, data) {
    const kindKey = 'CUSTOM:'+name;
    const tmp = engine.createCircuit();
    tmp.load(data);
    // Ordered by y so the box's pin stack visually matches how the inputs/
    // outputs were laid out top-to-bottom in the saved circuit, not by
    // creation order.
    const ins  = [...tmp.ioComponents.values()].filter(c=>c.kind==='INPUT').sort((a,b)=>a.y-b.y);
    const outs = [...tmp.ioComponents.values()].filter(c=>c.kind==='OUTPUT').sort((a,b)=>a.y-b.y);
    const inIds=ins.map(c=>c.ioId), outIds=outs.map(c=>c.ioId);
    const inLabels=ins.map(c=>c.label), outLabels=outs.map(c=>c.label);

    const h = Math.max(H, CUSTOM_PIN_MARGIN*2 + (Math.max(inIds.length,outIds.length,1)-1)*CUSTOM_PIN_GAP);
    const inYs = customPinYs(inIds.length, h), outYs = customPinYs(outIds.length, h);

    const nameLines = wrapLabel(name, Math.max(3, Math.floor((W-16)/6)));
    const nameLineH = 12;
    const nameStartY = h/2 - (nameLines.length-1)*nameLineH/2 + 4;

    GATE_DEFS[kindKey] = {
      kind:kindKey, label:name, inputs:inIds.length, outputs:outIds.length, family:'custom',
      compute(inputVals, state) {
        if (!state.sub) { state.sub = engine.createCircuit(); state.sub.load(data); }
        const sub = state.sub;
        inIds.forEach((ioId,i)=>{ const c=sub.ioComponents.get(ioId); if (c) c.state.value = inputVals[i]?1:0; });
        for (let i=0;i<10;i++) sub.step(performance.now(), 0, true);
        return outIds.map(ioId=>{ const c=sub.ioComponents.get(ioId); return c ? (c.inputVals[0]||0) : 0; });
      }
    };

    VIS[kindKey] = {
      w:W, h,
      inputs: inYs.map(y=>({x:0,y})),
      outputs: outYs.map(y=>({x:W,y})),
      body:(f,comp)=><g>
        <rect x="0" y="0" width={W} height={h} rx="6" fill="#fff" stroke="var(--ink)" strokeWidth="2"/>
        <text x={W/2} textAnchor="middle" fontFamily="var(--mono)" fontSize="10" fontWeight="600" fill="var(--ink)" opacity="0.6">
          {nameLines.map((line,i)=><tspan key={i} x={W/2} y={nameStartY+i*nameLineH}>{line}</tspan>)}
        </text>
        {inLabels.map((lbl,i)=><text key={'i'+i} x="8" y={inYs[i]+4} fontFamily="var(--mono)" fontSize="10" fill="var(--ink)" opacity="0.7">{lbl}</text>)}
        {outLabels.map((lbl,i)=><text key={'o'+i} x={W-8} y={outYs[i]+4} textAnchor="end" fontFamily="var(--mono)" fontSize="10" fill="var(--ink)" opacity="0.7">{lbl}</text>)}
      </g>
    };

    return kindKey;
  }

  return { GATE_VIS: VIS, FAMILY_FILL, GateBody, registerCustomGate, visForComp };
});
</script>

<script type="text/babel">
/* ═══ CANVAS ═══════════════════════════════════════════════════════════════ */
defineModule('canvas', ['state', 'engine', 'gates'], (state, engine, gates) => {
'use strict';
const { useState, useEffect, useRef, useCallback } = React;
const { GATE_VIS, GateBody, visForComp } = gates;
const {
  GATE_DEFS,
  projectOrthogonalPoint, terminalCoords, wireKnots, resolveWire, wirePath,
  sampleWire, distToSeg, wireSegmentPoints, findNearestWirePoint,
  insertBranchPoint, routeManhattanPoints, pinAbs, wireDelayForLength,
  branchRouteFrom, syncWireEndCorners,
  segmentMoveSnapshot, computeSegmentMove, clampSegmentMoveDelta, finalizeSegmentMove,
} = engine;

// A selected wire segment is identified by a composite string distinct
// from any component id (which are plain 'c<n>'), so it can travel
// through the same single selectedId/onSelect prop components already use
// without the two ever colliding.
const segSelId = (wireId, segIndex) => `${wireId}#seg${segIndex}`;

const GRID = 20;
const snap = (v, on=true) => on ? Math.round(v/GRID)*GRID : v;

// A plain controlled `<input type="number" value={x} onChange={...}>` fights
// the user mid-edit: clearing "1" to type "8" makes the field momentarily
// empty, Number('')||fallback immediately clamps that back to a valid
// number, and the resulting re-render snaps the field's text back before
// the next keystroke lands — so e.g. going from 1 to 8 only works by typing
// the 8 *before* deleting the 1, never the more natural backspace-then-type
// order. This decouples the field's displayed text from the committed
// value: keystrokes that don't yet parse to a number in [min,max] (empty
// included) update the local text only, without calling onCommit, so nothing
// snaps back until the user actually reaches a valid value. Blurring with an
// invalid/abandoned edit still in progress reverts the display to the last
// committed value rather than leaving it stuck looking invalid.
function NumberField({ className, value, min, max, onCommit }) {
  const [text, setText] = useState(String(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setText(String(value)); }, [value]);
  const inRange = (n) => !Number.isNaN(n) && (min==null || n>=min) && (max==null || n<=max);
  return <input className={className} type="number" min={min} max={max}
    value={text}
    onFocus={()=>{focused.current=true;}}
    onChange={e=>{
      const t = e.target.value;
      setText(t);
      const n = Number(t);
      if (t.trim()!=='' && inRange(n)) onCommit(n);
    }}
    onBlur={()=>{focused.current=false; setText(String(value));}}/>;
}

// Dragging a wire's endpoint should never disturb the rest of the wire —
// only the one segment at the dragged end. `d` (built once at drag-start by
// onWireEndpointMouseDown, before anything is touched) captures that
// original shape: `neighbor` is the fixed point just before this endpoint
// (the nearest existing waypoint, or the wire's other end if it has none),
// `axis` is which way ('h'/'v') the segment leading into this endpoint
// already ran, and `basePoints` is every other point on the wire, left
// completely alone. Moving `newPos` along that same axis just slides the
// endpoint — extend/shorten, no new point. Moving it off that axis appends
// exactly one corner point beyond `neighbor` (new segment), and nothing
// before `neighbor` is ever touched either way.
function computeEndpointRoute(d, newPos) {
  const EPS = 1e-6;
  const aligned = d.axis==='h' ? Math.abs(newPos.y-d.neighbor.y)<EPS : Math.abs(newPos.x-d.neighbor.x)<EPS;
  if (aligned) {
    // Dragged all the way back onto the fixed point behind it (both
    // coordinates, not just the on-axis one) — the final segment has
    // shrunk to nothing. If that point was one of the wire's own
    // waypoints, it's now a redundant duplicate of the endpoint sitting
    // right on top of it, so it's dropped and that point becomes the
    // endpoint outright — case (b): if it was already a junction, the
    // junction stays put, now doubling as the endpoint. If there was no
    // waypoint there at all — the fixed point was the wire's *other*
    // end — the whole wire has collapsed to zero length; flagged via
    // collapsedToZero rather than acted on here, since a live preview
    // frame shouldn't delete anything — only finalizeEndpointRoute, at
    // drop, does that (case (c) when the fixed point is a branch's own
    // branchpoint junction).
    const collapsed = Math.abs(newPos.x-d.neighbor.x)<EPS && Math.abs(newPos.y-d.neighbor.y)<EPS;
    if (collapsed) {
      if (d.basePoints.length===0) return { points: [], corner: null, collapsedToZero: true };
      const points = d.side==='to' ? d.basePoints.slice(0,-1) : d.basePoints.slice(1);
      return { points, corner: null };
    }
    return { points: d.basePoints, corner: null };
  }
  const corner = d.axis==='h' ? {x:newPos.x, y:d.neighbor.y} : {x:d.neighbor.x, y:newPos.y};
  const points = d.side==='to' ? [...d.basePoints, corner] : [corner, ...d.basePoints];
  return { points, corner };
}

// Commits computeEndpointRoute's result to `wire` and, only if it actually
// produced a new corner, registers a junction there (skipping if an
// equivalent one is already registered) so that corner is immediately
// branchable — same reasoning as before, just now scoped to the one new
// corner this drag may have added, since everything else about the wire is
// left alone and any junctions elsewhere on it are therefore still valid.
function finalizeEndpointRoute(wire, d, newPos, circuit) {
  const {points, corner, collapsedToZero} = computeEndpointRoute(d, newPos);
  if (collapsedToZero) {
    // Both ends now sit on the same point — nothing left to draw. Going
    // through circuit.removeWire (rather than just leaving an empty-points
    // wire in place) runs its junction cleanup too, so retracting a
    // branch back onto its own branchpoint takes that junction down with
    // it if it was the last branch there (case (c)).
    circuit.removeWire(wire.id);
    return true;
  }
  wire.points = points;
  if (corner) {
    const dup = [...circuit.junctions].some(j=>j.sourceWireId===wire.id && Math.abs(j.x-corner.x)<1e-6 && Math.abs(j.y-corner.y)<1e-6);
    if (!dup) circuit.junctions.add({x:corner.x, y:corner.y, sourceWireId:wire.id});
  }
  return false;
}

function Canvas({ circuit, onSelect, selectedId, paletteDrag, onClearPaletteDrag, onComponentChanged, snapGrid=true }) {
  const svgRef = useRef(null);
  const [view, setView] = useState({x:0,y:0,zoom:1});
  const [wiringFrom, setWiringFrom] = useState(null);
  const [mousePos, setMousePos] = useState({x:0,y:0});
  const [isPanning, setIsPanning] = useState(false);

  // Drag state in refs to avoid stale closures
  const panRef         = useRef(null); // {sx,sy,vx,vy}
  const compDragRef    = useRef(null); // {id,ox,oy,startSX,startSY,moved}
  const endpointDragRef= useRef(null); // {wireId,side,ox,oy}
  const segDragRef     = useRef(null); // {snapshot (engine's segmentMoveSnapshot), startWX, startWY}

  // Stable refs for values needed in effects
  const viewRef          = useRef(view);
  const paletteDragRef   = useRef(paletteDrag);
  const snapGridRef      = useRef(snapGrid);
  const onChangedRef     = useRef(onComponentChanged);
  const onClearPalRef    = useRef(onClearPaletteDrag);
  const onSelectRef      = useRef(onSelect);
  const wiringFromRef    = useRef(wiringFrom);
  useEffect(()=>{viewRef.current=view;},[view]);
  useEffect(()=>{paletteDragRef.current=paletteDrag;},[paletteDrag]);
  useEffect(()=>{snapGridRef.current=snapGrid;},[snapGrid]);
  useEffect(()=>{onChangedRef.current=onComponentChanged;},[onComponentChanged]);
  useEffect(()=>{onClearPalRef.current=onClearPaletteDrag;},[onClearPaletteDrag]);
  useEffect(()=>{onSelectRef.current=onSelect;},[onSelect]);
  useEffect(()=>{wiringFromRef.current=wiringFrom;},[wiringFrom]);

  // Re-render every frame for live simulation display
  const [, tick] = useState(0);
  useEffect(()=>{let r; const l=()=>{tick(n=>n+1);r=requestAnimationFrame(l);}; r=requestAnimationFrame(l); return()=>cancelAnimationFrame(r);},[]);

  const screenToWorld = useCallback((sx,sy)=>{
    const r=svgRef.current.getBoundingClientRect(),v=viewRef.current;
    return{x:(sx-r.left)/v.zoom-v.x, y:(sy-r.top)/v.zoom-v.y};
  },[]);

  // Global mouse move / up
  useEffect(()=>{
    // The (dx,dy) for a segment drag at world point `w` — snapped so the
    // segment's own FINAL position lands on the grid (matching every other
    // drag in this file, e.g. component drag's `snap(w.x-d.ox,...)`),
    // rather than snapping the raw mouse delta itself, which could still
    // leave an off-grid result if the original position wasn't already a
    // grid multiple. Shared by the live-preview and finalize handlers below
    // so they can't drift apart from computing this two different ways.
    const segMoveDelta = (d, w) => {
      const orig = d.snapshot.knots[d.snapshot.segIndex];
      if (d.snapshot.axis==='h') {
        const perp = snap(orig.y+(w.y-d.startWY), snapGridRef.current) - orig.y;
        return {dx:0, dy:perp};
      }
      const perp = snap(orig.x+(w.x-d.startWX), snapGridRef.current) - orig.x;
      return {dx:perp, dy:0};
    };
    const onMove=(e)=>{
      const w=screenToWorld(e.clientX,e.clientY);
      setMousePos(w);
      if (wiringFromRef.current && !wiringFromRef.current.dir) {
        const wf=wiringFromRef.current;
        const dx=w.x-wf.startX, dy=w.y-wf.startY;
        if (Math.hypot(dx,dy)>6) {
          const dir=Math.abs(dx)>Math.abs(dy)?'h':'v';
          setWiringFrom(prev=>prev?{...prev,dir}:prev);
        }
      }
      if (panRef.current) {
        const p=panRef.current;
        setView(v=>({...v, x:p.vx+(e.clientX-p.sx)/v.zoom, y:p.vy+(e.clientY-p.sy)/v.zoom}));
      }
      if (compDragRef.current) {
        const d=compDragRef.current;
        if (Math.hypot(e.clientX-d.startSX,e.clientY-d.startSY)>4) {
          d.moved=true;
          const c=circuit.components.get(d.id);
          if(c){c.x=snap(w.x-d.ox,snapGridRef.current);c.y=snap(w.y-d.oy,snapGridRef.current);onChangedRef.current?.();}
        }
      }
      if (endpointDragRef.current) {
        const d=endpointDragRef.current, wire=circuit.wires.get(d.wireId);
        if (wire) {
          const coord={x:snap(w.x+d.ox,snapGridRef.current),y:snap(w.y+d.oy,snapGridRef.current)};
          // Live preview only — points, not junctions, so a fast drag
          // doesn't thrash circuit.junctions every frame. The real
          // (junction-registering) commit happens once at drop, in onUp /
          // onInputPinUp / onOutputPinUp via finalizeEndpointRoute.
          wire.points = computeEndpointRoute(d, coord).points;
          wire[d.side]=coord;
          onChangedRef.current?.();
        }
      }
      if (segDragRef.current) {
        const d=segDragRef.current, wire=circuit.wires.get(d.snapshot.wireId);
        if (wire) {
          // Live preview only — this wire's own shape, not the junction
          // carry-along other wires might need (finalizeSegmentMove, at
          // drop) — same "don't thrash the junction registry every frame"
          // reasoning as the endpoint drag above. computeSegmentMove is
          // always relative to the frozen drag-start snapshot, never to
          // this wire's current (already-live-updated) shape, so calling
          // it repeatedly here with a growing delta never compounds.
          //
          // The delta is clamped *before* computeSegmentMove, not after —
          // computeSegmentMove always moves a segment's two knots by
          // exactly the same amount, so a branch anchor that can't take
          // the full move has to be reflected in the delta itself, or the
          // segment's other knot still travels the full distance and the
          // branch ends up reaching just as far as if nothing had been
          // clamped at all.
          const raw = segMoveDelta(d, w);
          const {dx,dy} = clampSegmentMoveDelta(d.snapshot, raw.dx, raw.dy, circuit);
          const {points, from, to, segIndex} = computeSegmentMove(d.snapshot, dx, dy);
          wire.points = points;
          if (from) wire.from = from;
          if (to) wire.to = to;
          // A stub grown out to a pinned end shifts this same segment's
          // own index up by one (see computeSegmentMove) — keep the
          // selection (and thus the bounding box) pointed at it either
          // way. Re-asserting the unchanged value when nothing shifted is
          // a no-op React bails out of, so this is safe to call every
          // frame rather than only on the transition.
          onSelectRef.current?.(segSelId(d.snapshot.wireId, segIndex));
          onChangedRef.current?.();
        }
      }
    };

    const onUp=(e)=>{
      const w=screenToWorld(e.clientX,e.clientY);
      if (wiringFromRef.current) {
        const wf=wiringFromRef.current;
        if (wf.handled) {
          wiringFromRef.current=null;
          setWiringFrom(null);
        } else {
          const dist = wf.startSX!=null && wf.startSY!=null
            ? Math.hypot(wf.startSX - e.clientX, wf.startSY - e.clientY)
            : Math.hypot(wf.startX - w.x, wf.startY - w.y);
          if (wf.type==='branch' && dist>6) {
            const wire=circuit.wires.get(wf.wireId);
            if (wire) {
              const target={x:snap(w.x,snapGridRef.current),y:snap(w.y,snapGridRef.current)};
              // Junction goes wherever the route stops retracing the wire; a
              // null route retraces it the whole way, so there's nothing to add.
              const route = branchRouteFrom(wire,{x:wf.x,y:wf.y},target,wf.dir||'h',circuit);
              if (route) {
                const branchPoint = insertBranchPoint(wire,route.start.x,route.start.y,circuit);
                const branch = branchPoint ? circuit.addWire({x:branchPoint.x,y:branchPoint.y},target) : null;
                if(branch) branch.points = route.points;
                onChangedRef.current?.();
              }
            }
          } else if (wf.type==='pin' && dist>6) {
            const target={x:snap(w.x,snapGridRef.current),y:snap(w.y,snapGridRef.current)};
            const wire=circuit.addWire({compId:wf.compId,pin:wf.pin,type:'out'},target);
            if(wire) wire.points=routeManhattanPoints(terminalCoords(wire.from,circuit),terminalCoords(wire.to,circuit),wf.dir||'h');
            onChangedRef.current?.();
          } else if (wf.type==='endpoint' && dist>6) {
            // Endpoint released on empty canvas (still free) rather than
            // dropped onto a new pin — those cases already ran
            // finalizeEndpointRoute inside onInputPinUp/onOutputPinUp and
            // marked wf.handled, so this only fires here.
            const wire=circuit.wires.get(wf.wireId), d=endpointDragRef.current;
            if (wire && d) { finalizeEndpointRoute(wire, d, wire[d.side], circuit); onChangedRef.current?.(); }
          } else if (wf.type==='branch' && wf.segIndex!=null) {
            // The press went back up as a plain click rather than a drag
            // (dist<=6, so no branch got created above) — *now* the
            // segment it landed on selects, per onWireEdgeDown's comment.
            // wf.segIndex is only set there — a branch drag started from a
            // waypoint dot instead (onWaypointMouseDown) has no segment of
            // its own to select, so it's left alone here.
            onSelectRef.current?.(segSelId(wf.wireId, wf.segIndex));
          }
          wiringFromRef.current=null;
          setWiringFrom(null);
        }
      }
      // Drop from palette
      if (paletteDragRef.current) {
        const pd=paletteDragRef.current;
        const vis=GATE_VIS[pd.kind];
        circuit.addComponent(pd.kind,snap(w.x-vis.w/2,snapGridRef.current),snap(w.y-vis.h/2,snapGridRef.current));
        onChangedRef.current?.(); onClearPalRef.current?.();
      }
      // Component drag end — maybe it was a click
      if (compDragRef.current) {
        const d=compDragRef.current;
        if (!d.moved) {
          const comp=circuit.components.get(d.id);
          if (comp?.kind==='INPUT') {
            // A stray click on the multi-bit body's padding (not a bit cell)
            // has no single-bit meaning — only single-bit INPUTs toggle from
            // an unspecific click; wide ones require hitting an actual cell.
            if ((comp.bitWidth||1)>1) {
              if (comp.displayMode==='hex') { if (d.digitShift!=null) circuit.incrementInputDigit(comp.id,d.digitShift); }
              else if (d.bitIndex!=null) circuit.toggleInputBit(comp.id,d.bitIndex);
            }
            else circuit.toggleInput(comp.id);
            onChangedRef.current?.();
          }
          if (comp?.kind==='CLOCK')  { circuit.toggleClock(comp.id);  onChangedRef.current?.(); }
        } else {
          // The component actually moved — any wire attached to one of
          // its pins may need its near-pin corner reconciled: added,
          // removed, or shifted to a new position if it was already a
          // corner but not this one anymore (see syncWireEndCorners,
          // which loops both ends to convergence rather than fixing each
          // once — needed since e.g. an OUTPUT, only ever a wire's `to`,
          // is fixed second, and a single pass never rechecks whatever
          // `from` resolved to earlier in that same pass).
          for (const w of circuit.wires.values()) {
            if (w.from.compId===d.id || w.to.compId===d.id) syncWireEndCorners(w, circuit);
          }
          onChangedRef.current?.();
        }
        compDragRef.current=null;
      }
      // Segment move end — geometry's already live-committed above every
      // frame; this just runs the one thing deferred to drop, same as an
      // endpoint drag's junction registration: carrying along whatever
      // was reading from a junction at either end that actually moved.
      if (segDragRef.current) {
        const d=segDragRef.current, wire=circuit.wires.get(d.snapshot.wireId);
        if (wire) {
          const raw = segMoveDelta(d, w);
          const {dx,dy} = clampSegmentMoveDelta(d.snapshot, raw.dx, raw.dy, circuit);
          // Re-commit the geometry for this exact final (dx,dy) — usually
          // identical to what the last onMove frame already wrote, but a
          // mouseup isn't guaranteed to be preceded by a mousemove at the
          // very same point, so this is the one guaranteed-fresh
          // computation to key the final selection off.
          const {points, from, to, segIndex} = computeSegmentMove(d.snapshot, dx, dy);
          wire.points = points;
          if (from) wire.from = from;
          if (to) wire.to = to;
          onSelectRef.current?.(segSelId(d.snapshot.wireId, segIndex));
          finalizeSegmentMove(wire, d.snapshot, dx, dy, circuit);
          onChangedRef.current?.();
        }
        segDragRef.current=null;
      }
      panRef.current=null; endpointDragRef.current=null;
      setIsPanning(false);
    };

    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[circuit, screenToWorld]);

  // Scroll to zoom
  const onWheel=(e)=>{
    e.preventDefault();
    const r=svgRef.current.getBoundingClientRect(),v=viewRef.current;
    const cx=(e.clientX-r.left)/v.zoom-v.x, cy=(e.clientY-r.top)/v.zoom-v.y;
    const nz=Math.max(.3,Math.min(2.5,v.zoom*Math.exp(-e.deltaY*.0015)));
    setView(()=>({x:(e.clientX-r.left)/nz-cx, y:(e.clientY-r.top)/nz-cy, zoom:nz}));
  };

  const onMouseDownBg=(e)=>{
    if(e.button!==0&&e.button!==1)return;
    if(e.target!==svgRef.current&&!e.target.classList?.contains('canvas-bg'))return;
    panRef.current={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    wiringFromRef.current=null;
    setIsPanning(true); setWiringFrom(null); onSelect(null);
  };

  const onCompMouseDown=(e,comp)=>{
    e.stopPropagation(); if(e.button===2)return;
    const w=screenToWorld(e.clientX,e.clientY);
    // Bit cells (multi-bit INPUT) tag themselves with data-bit, hex-digit
    // cells with data-shift; reading it off the real event target lets the
    // browser's own hit-testing tell us which cell was pressed,
    // transform/rotation and all, instead of re-deriving it.
    const bitAttr = e.target && e.target.dataset ? e.target.dataset.bit : undefined;
    const shiftAttr = e.target && e.target.dataset ? e.target.dataset.shift : undefined;
    const bitIndex = bitAttr!==undefined ? Number(bitAttr) : null;
    const digitShift = shiftAttr!==undefined ? Number(shiftAttr) : null;
    compDragRef.current={id:comp.id,ox:w.x-comp.x,oy:w.y-comp.y,startSX:e.clientX,startSY:e.clientY,moved:false,bitIndex,digitShift};
    onSelect(comp.id);
  };
  const onCompContext=(e,comp)=>{e.preventDefault();circuit.removeComponent(comp.id);onComponentChanged?.();};
  const onWireContext=(e,wireId)=>{e.preventDefault();e.stopPropagation();circuit.removeWire(wireId);onComponentChanged?.();};

  const onOutputPinDown=(e,comp,idx)=>{
    e.stopPropagation();
    const p=pinAbs(comp,'out',idx);
    const wf={type:'pin',compId:comp.id,pin:idx,x:p.x,y:p.y,startX:p.x,startY:p.y,startSX:e.clientX,startSY:e.clientY};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onInputPinUp=(e,comp,idx)=>{
    e.stopPropagation();
    const wf = wiringFromRef.current;
    if (!wf) return;
    if (wf.type==='branch') {
      const wire=circuit.wires.get(wf.wireId);
      if (wire) {
        const to={compId:comp.id,pin:idx,type:'in'};
        // Same trimming as a drop on empty canvas — see the onUp branch case.
        const route = branchRouteFrom(wire,{x:wf.x,y:wf.y},terminalCoords(to,circuit),wf.dir||'h',circuit);
        if (route) {
          const branchPoint = insertBranchPoint(wire,route.start.x,route.start.y,circuit);
          const branch = branchPoint ? circuit.addWire({x:branchPoint.x,y:branchPoint.y}, to) : null;
          if (branch) branch.points=route.points;
        }
        wiringFromRef.current=null;
        onComponentChanged?.(); setWiringFrom(null); return;
      }
    }
    if (wf.type==='endpoint' && wf.side==='to') {
      const wire=circuit.wires.get(wf.wireId);
      if (wire) {
        wire.to={compId:comp.id,pin:idx,type:'in'};
        if (endpointDragRef.current) finalizeEndpointRoute(wire, endpointDragRef.current, terminalCoords(wire.to,circuit), circuit);
        endpointDragRef.current=null;
        wiringFromRef.current={...wf, handled:true};
        onComponentChanged?.(); setWiringFrom(null); return;
      }
    }
    if (wf.type==='endpoint' && wf.side==='from') {
      const wire=circuit.wires.get(wf.wireId);
      if (wire) {
        wire.from={compId:comp.id,pin:idx,type:'out'};
        if (endpointDragRef.current) finalizeEndpointRoute(wire, endpointDragRef.current, terminalCoords(wire.from,circuit), circuit);
        endpointDragRef.current=null;
        wiringFromRef.current={...wf, handled:true};
        onComponentChanged?.(); setWiringFrom(null); return;
      }
    }
    if (wf.type==='pin') {
      const wire = circuit.addWire({compId:wf.compId,pin:wf.pin,type:'out'},{compId:comp.id,pin:idx,type:'in'});
      if (wire) wire.points = routeManhattanPoints(terminalCoords(wire.from,circuit),terminalCoords(wire.to,circuit),wf.dir||'h');
      wiringFromRef.current=null;
      onComponentChanged?.(); setWiringFrom(null);
    }
  };
  const onOutputPinUp=(e,comp,idx)=>{
    e.stopPropagation();
    const wf = wiringFromRef.current;
    if (!wf) return;
      if (wf.type==='endpoint' && wf.side==='from') {
        const wire=circuit.wires.get(wf.wireId);
        if (wire) {
          wire.from={compId:comp.id,pin:idx,type:'out'};
          if (endpointDragRef.current) finalizeEndpointRoute(wire, endpointDragRef.current, terminalCoords(wire.from,circuit), circuit);
          endpointDragRef.current=null;
          wiringFromRef.current={...wf, handled:true};
          onComponentChanged?.(); setWiringFrom(null); return;
        }
      }
  };
  const onWireEdgeDown=(e,wire)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    const nearest=findNearestWirePoint(wire,w.x,w.y,circuit);
    const segIndex=nearest.index;
    // Unlike a component (which selects immediately on mousedown, drag or
    // not), a segment only selects once the press goes back up as a plain
    // click — see the wf.type==='branch' (no dist>6) case in onUp below —
    // so a drag that turns into a branch doesn't also select the segment
    // it came from. The one exception is a SECOND press on an ALREADY
    // selected segment: that starts a move immediately (constrained to
    // its own perpendicular axis), same as before.
    const wasSelected = selectedId===segSelId(wire.id,segIndex);
    if (wasSelected) {
      const snapshot = segmentMoveSnapshot(wire, segIndex, circuit);
      if (snapshot) segDragRef.current={snapshot, startWX:w.x, startWY:w.y};
      return;
    }
    const wf={type:'branch',wireId:wire.id,segIndex,x:nearest.point.x,y:nearest.point.y,startX:w.x,startY:w.y,startSX:e.clientX,startSY:e.clientY};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onWireEndpointMouseDown=(e,wire,side,pt)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    // Snapshot the wire's shape *before* this drag touches it — see
    // computeEndpointRoute's comment for what neighbor/axis/basePoints mean.
    const otherSide = side==='to' ? 'from' : 'to';
    const basePoints = wire.points ? [...wire.points] : [];
    const neighbor = basePoints.length
      ? (side==='to' ? basePoints[basePoints.length-1] : basePoints[0])
      : terminalCoords(wire[otherSide], circuit);
    const axis = Math.abs(pt.y-neighbor.y) < 1e-6 ? 'h' : (Math.abs(pt.x-neighbor.x) < 1e-6 ? 'v' : 'h');
    endpointDragRef.current={wireId:wire.id,side,ox:pt.x-w.x,oy:pt.y-w.y,neighbor,axis,basePoints};
    const wf={type:'endpoint',wireId:wire.id,side,x:pt.x,y:pt.y,startX:pt.x,startY:pt.y};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onWireClick=(e,wire)=>{
    // Only add waypoint if we're not coming from a pan
    if(isPanning) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    const a=terminalCoords(wire.from,circuit),b=terminalCoords(wire.to,circuit);
    insertBranchPoint(wire,snap(w.x,snapGrid),snap(w.y,snapGrid));
    onComponentChanged?.();
  };
  const onWaypointMouseDown=(e,wire,idx,pt)=>{
    if (e.button!==0) return;
    e.stopPropagation();
    const w=screenToWorld(e.clientX,e.clientY);
    // A corner is never draggable-to-relocate anymore, junction or not —
    // dragging one instead starts a NEW branch from it, same as dragging
    // off a wire's body via onWireEdgeDown, just already pinned exactly to
    // this corner instead of needing findNearestWirePoint to locate it.
    // Leaves this point (and anything already branching from it, if it's
    // already a junction) exactly where it is; insertBranchPoint (run at
    // drop) won't insert a duplicate waypoint here since one already
    // exists.
    const wf={type:'branch',wireId:wire.id,x:pt.x,y:pt.y,startX:w.x,startY:w.y,startSX:e.clientX,startSY:e.clientY};
    wiringFromRef.current=wf;
    setWiringFrom(wf);
  };
  const onWaypointContext=(e,wire,idx)=>{
    e.preventDefault(); e.stopPropagation();
    // A corner can no longer be picked off by itself — junction or plain —
    // right-clicking its dot now falls through to the same "delete the
    // whole wire" action as right-clicking anywhere else on the wire's
    // body, rather than singling out just this point. A junction, in
    // particular, only ever goes away as a side effect of removing
    // whatever made it one — every branch reading from it (engine's
    // pruneDeadJunctions, run from removeWire), this wire itself going
    // away, or a wire's own endpoint getting dragged back onto one
    // (computeEndpointRoute/finalizeEndpointRoute) — never by itself.
    circuit.removeWire(wire.id); onComponentChanged?.();
  };

  const components=[...circuit.components.values()];
  const wires=[...circuit.wires.values()];
  const tx=view.x*view.zoom, ty=view.y*view.zoom;

  // Clock overlay
  const selComp = selectedId ? circuit.components.get(selectedId) : null;
  const clockPanel = selComp?.kind==='CLOCK' ? (()=>{
    const vis=GATE_VIS.CLOCK;
    const sx=(selComp.x+vis.w/2+view.x)*view.zoom;
    const sy=(selComp.y+vis.h+10+view.y)*view.zoom;
    return (
      <div className="clk-panel" style={{left:sx,top:sy}}
           onMouseDown={e=>e.stopPropagation()}>
        <div className="clk-header">
          <span className="clk-label">Clock</span>
          <span className="clk-status">{selComp.state.paused?'paused':`${selComp.state.period}ms`}</span>
        </div>
        <div className="clk-period">
          <span style={{fontSize:10.5,color:'var(--ink-3)',fontFamily:'var(--mono)'}}>100</span>
          <input type="range" min="100" max="4000" step="100"
                 value={selComp.state.period}
                 onChange={e=>{circuit.setClockPeriod(selComp.id,Number(e.target.value));onComponentChanged?.();}}/>
          <span className="clk-period-val">{selComp.state.period}ms</span>
        </div>
      </div>
    );
  })() : null;
  // INPUT/OUTPUT/CONST share the same Bits/Format/Facing controls (CONST
  // is bit-width-aware for the same reason INPUT is), and differ only in
  // their very first row: INPUT/OUTPUT are named circuit ports (Label),
  // while CONST is a fixed, unnamed tie-in value (Value) — everything else
  // is identical, so one panel covers all three instead of two
  // near-duplicates drifting apart.
  const ioPanel = selComp?.kind==='INPUT' || selComp?.kind==='OUTPUT' || selComp?.kind==='CONST' ? (()=>{
    const isConst = selComp.kind==='CONST';
    const maxVal = (selComp.bitWidth||1) >= 32 ? 0xFFFFFFFF : (2**(selComp.bitWidth||1) - 1);
    return (
      <div className="prop-panel" onMouseDown={e=>e.stopPropagation()}>
        <div className="prop-title">{isConst ? 'Constant' : selComp.kind} Properties</div>
        {isConst ? (
          <div className="prop-option">
            <span className="prop-label">Value</span>
            <NumberField className="prop-input" min={0} max={maxVal}
                    value={selComp.state.value||0}
                    onCommit={n=>{circuit.setConstValue(selComp.id,n);onComponentChanged?.();}}/>
          </div>
        ) : (
          <div className="prop-option">
            <span className="prop-label">Label</span>
            <input  className="prop-input"
                    value={selComp.label}
                    onChange={e=>{circuit.setIOLabel(selComp.id,e.target.value);onComponentChanged?.();}}/>
          </div>
        )}
        <div className="prop-option">
          <span className="prop-label">Bits</span>
          <NumberField className="prop-input" min={1} max={32}
                  value={selComp.bitWidth||1}
                  onCommit={n=>{circuit.setBitWidth(selComp.id,n);onComponentChanged?.();}}/>
        </div>
        <div className="prop-option">
          <span className="prop-label">Format</span>
          <select className="prop-input"
                  value={selComp.displayMode||'bin'}
                  onChange={e=>{circuit.setDisplayMode(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="bin">Binary</option>
            <option value="hex">Hexadecimal</option>
          </select>
        </div>
        <div className="prop-option">
          <span className="prop-label">Facing</span>
          <select className="prop-input"
                  value={selComp.facing}
                  onChange={e=>{circuit.setFacing(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="right">Right</option>
            <option value="left">Left</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
          </select>
        </div>
      </div>
    )
  })() : null;
  const gatePanel = ['NOT', 'AND','OR','NAND','NOR','XOR','XNOR','MUX','SHFT','EXTND','SPLIT'].includes(selComp?.kind) ? (()=>{
    return (
      <div className="prop-panel" onMouseDown={e=>e.stopPropagation()}>
        <div className="prop-title">{selComp.kind} Properties</div>
        {selComp.kind==='EXTND' ? <>
          <div className="prop-option">
            <span className="prop-label">Bits In</span>
            <NumberField className="prop-input" min={1} max={32}
                    value={selComp.bitWidthIn||1}
                    onCommit={n=>{circuit.setExtBitWidthIn(selComp.id,n);onComponentChanged?.();}}/>
          </div>
          <div className="prop-option">
            <span className="prop-label">Bits Out</span>
            <NumberField className="prop-input" min={1} max={32}
                    value={selComp.bitWidthOut||1}
                    onCommit={n=>{circuit.setExtBitWidthOut(selComp.id,n);onComponentChanged?.();}}/>
          </div>
        </> : selComp.kind==='SPLIT' ? <>
          <div className="prop-option">
            <span className="prop-label">Type</span>
            <select className="prop-input"
                    value={selComp.splitType||'split'}
                    onChange={e=>{circuit.setSplitType(selComp.id,e.target.value);onComponentChanged?.();}}>
              <option value="split">Split</option>
              <option value="merge">Merge</option>
            </select>
          </div>
          <div className="prop-option">
            <span className="prop-label">Bits</span>
            <NumberField className="prop-input" min={2} max={8}
                    value={selComp.bits||2}
                    onCommit={n=>{circuit.setSplitBits(selComp.id,n);onComponentChanged?.();}}/>
          </div>
          <div className="prop-option">
            <span className="prop-label">Space</span>
            <NumberField className="prop-input" min={1} max={8}
                    value={selComp.space||1}
                    onCommit={n=>{circuit.setSplitSpace(selComp.id,n);onComponentChanged?.();}}/>
          </div>
        </> : <div className="prop-option">
          <span className="prop-label">Bits</span>
          <NumberField className="prop-input" min={1} max={32}
                  value={selComp.bitWidth||1}
                  onCommit={n=>{circuit.setBitWidth(selComp.id,n);onComponentChanged?.();}}/>
        </div>}
        {selComp.kind==='MUX' && <div className="prop-option">
          <span className="prop-label">Inputs</span>
          <select className="prop-input"
                  value={selComp.muxInputs||2}
                  onChange={e=>{circuit.setMuxInputs(selComp.id,Number(e.target.value));onComponentChanged?.();}}>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>}
        {selComp.kind==='MUX' && <div className="prop-option">
          <span className="prop-label">Select</span>
          <select className="prop-input"
                  value={selComp.muxSelectLocation||'top'}
                  onChange={e=>{circuit.setMuxSelectLocation(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
          </select>
        </div>}
        {selComp.kind==='SHFT' && <div className="prop-option">
          <span className="prop-label">Mode</span>
          <select className="prop-input"
                  value={selComp.shiftMode||'left'}
                  onChange={e=>{circuit.setShiftMode(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="left">Logical Left</option>
            <option value="right">Logical Right</option>
            <option value="arith">Arithmetic Right</option>
          </select>
        </div>}
        <div className="prop-option">
          <span className="prop-label">Facing</span>
          <select className="prop-input"
                  value={selComp.facing}
                  onChange={e=>{circuit.setFacing(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="right">Right</option>
            <option value="left">Left</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
          </select>
        </div>
        {selComp.kind!=='SPLIT' && <div className="prop-option">
          <span className="prop-label">Delay</span>
          <div className="prop-range">
            <input type="range" min="0" max="2000" step="100"
                   value={selComp.delay}
                   onChange={e=>{circuit.setDelay(selComp.id,Number(e.target.value));onComponentChanged?.();}}/>
            <span className="tb-delay-val">{selComp.delay}ms</span>
          </div>
        </div>}
      </div>
    )
  })() : null;
  const regPanel = selComp?.kind==='REG' ? (()=>{
    return (
      <div className="prop-panel" onMouseDown={e=>e.stopPropagation()}>
        <div className="prop-title">REG Properties</div>
        <div className="prop-option">
          <span className="prop-label">Bits</span>
          <NumberField className="prop-input" min={1} max={32}
                  value={selComp.bitWidth||1}
                  onCommit={n=>{circuit.setBitWidth(selComp.id,n);onComponentChanged?.();}}/>
        </div>
        <div className="prop-option">
          <span className="prop-label">Format</span>
          <select className="prop-input"
                  value={selComp.displayMode||'bin'}
                  onChange={e=>{circuit.setDisplayMode(selComp.id,e.target.value);onComponentChanged?.();}}>
            <option value="bin">Binary</option>
            <option value="hex">Hexadecimal</option>
          </select>
        </div>
      </div>
    )
  })() : null;

  return <>
    <svg ref={svgRef} className="canvas"
         style={{width:'100%',height:'100%',cursor:isPanning?'grabbing':'default',background:'transparent'}}
         onMouseDown={onMouseDownBg}
         onWheel={onWheel}
         onContextMenu={e=>e.preventDefault()}>
      <defs>
        <pattern id="grid-dots" x="0" y="0" width={GRID} height={GRID} patternUnits="userSpaceOnUse">
          <circle cx={GRID/2} cy={GRID/2} r="1" fill="var(--grid)"/>
        </pattern>
      </defs>
      <rect className="canvas-bg" x="-5000" y="-5000" width="10000" height="10000"
            fill="url(#grid-dots)"
            transform={`translate(${tx},${ty}) scale(${view.zoom})`}/>

      <g transform={`translate(${tx},${ty}) scale(${view.zoom})`}>
        {/* Wires */}
        {wires.map(w=>{
          const a=terminalCoords(w.from,circuit), b=terminalCoords(w.to,circuit);
          const pts=w.points||[];
          const path=wirePath(a.x,a.y,b.x,b.y,pts);
          const high=w.value>0;
          const mismatch=w.bitMismatch;
          // Which of this wire's segments (if any) selectedId names — a
          // composite id ('<wireId>#seg<index>', see segSelId), distinct
          // from any component id, so it rides the same selectedId prop
          // components use without colliding with one.
          const selPrefix = w.id+'#seg';
          const selSeg = selectedId && selectedId.startsWith(selPrefix) ? Number(selectedId.slice(selPrefix.length)) : null;
          const selKnots = selSeg!=null ? wireKnots(a.x,a.y,b.x,b.y,pts) : null;
          const selA = selKnots && selKnots[selSeg], selB = selKnots && selKnots[selSeg+1];
          return <g key={w.id}>
            {/* Selection bounding box — same dashed-rect language as a
                selected component, padded around just the one selected
                segment (not the whole wire) since selection is per-segment. */}
            {selA && selB && <rect
                  x={Math.min(selA.x,selB.x)-8} y={Math.min(selA.y,selB.y)-8}
                  width={Math.abs(selB.x-selA.x)+16} height={Math.abs(selB.y-selA.y)+16}
                  rx="6" fill="none" stroke="var(--ink)" strokeWidth="1.5"
                  strokeDasharray="4 3" opacity="0.35"/>}
            {/* Shadow */}
            <path d={path} fill="none" stroke="var(--ink)" strokeWidth="3.5"
                  strokeLinejoin="round" strokeLinecap="round" opacity="0.07"/>
            {/* Signal color — red instead of low/high when the pins on
                either end disagree on bit width; the signal is held at 0
                rather than crossing, so `high` is never true here too. */}
            <path d={path} fill="none"
                  stroke={mismatch?'var(--err)':(high?'var(--high)':'var(--low)')}
                  strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"
                  strokeDasharray={mismatch?'5 4':undefined}
                  style={{transition:'stroke 100ms ease'}}/>
            {/* Fat hit target — click to add branch */}
            <path d={path} fill="none" stroke="transparent" strokeWidth="16"
