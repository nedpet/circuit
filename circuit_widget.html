                  style={{cursor:'cell'}}
                  onMouseDown={e=>onWireEdgeDown(e,w)}
                  onContextMenu={e=>onWireContext(e,w.id)}/>
            {/* Particles on HIGH */}
            {high&&<ParticleStream a={a} b={b} pts={pts}/>}
            {/* In-flight pulse */}
            {typeof w.pendingValue!=='undefined'&&(()=>{
              const knots = wireSegmentPoints(w, circuit);
              let wireLen = 0;
              for (let i = 0; i < knots.length - 1; i++) {
                wireLen += Math.hypot(knots[i+1].x - knots[i].x, knots[i+1].y - knots[i].y);
              }
              const wireDelay = wireDelayForLength(wireLen, state.widgetState.delayMs);
              return <InflightPulse a={a} b={b} pts={pts} pendingValue={w.pendingValue}
                                    pendingStart={w.pendingStart} delayMs={wireDelay}/>;
            })()}
            {/* Free endpoint handles — light up with their wire like a pin
                does, junction or not; only the idle color differs (white
                here vs. bg for a waypoint) since that was already each
                handle's own resting color before signals entered into it. */}
            {!w.from.compId&&<circle cx={a.x} cy={a.y} r="6"
                      fill={high?'var(--high)':'white'}
                      stroke="var(--border-md)" strokeWidth="1.5"
                      style={{cursor:'move', transition:'fill 100ms ease'}}
                      onMouseDown={e=>onWireEndpointMouseDown(e,w,'from',a)}/>}
            {!w.to.compId&&<circle cx={b.x} cy={b.y} r="6"
                      fill={high?'var(--high)':'white'}
                      stroke="var(--border-md)" strokeWidth="1.5"
                      style={{cursor:'move', transition:'fill 100ms ease'}}
                      onMouseDown={e=>onWireEndpointMouseDown(e,w,'to',b)}/>}
          </g>;
        })}

        {/* Waypoint handles — a separate pass over every wire, rendered
            after (so painted on top of) every wire's free-endpoint handles
            above. A waypoint that's also a junction sits at the exact same
            point as the branch wire's free `from` endpoint; when both were
            rendered together per-wire, whichever wire was created later
            painted on top and silently ate every click there, making the
            original wire's own waypoint permanently unreachable — so a
            junction could never gain a second branch. Keeping all waypoint
            handles in one later pass means they always win that overlap,
            regardless of which wire they belong to or when it was made.
            Every corner lights up the same way a pin does — bg when idle,
            --high when its host wire is carrying a signal — junction or
            plain corner alike; neither dragging nor right-clicking a
            corner distinguishes the two anymore either — see
            onWaypointMouseDown/onWaypointContext. */}
        {wires.map(w=>(w.points||[]).map((pt,idx)=>(
          <circle key={w.id+'_wp'+idx} cx={pt.x} cy={pt.y} r="5"
                  fill={w.value>0?'var(--high)':'var(--bg)'}
                  stroke="var(--border-md)" strokeWidth="1.5"
                  style={{cursor:'move', transition:'fill 100ms ease'}}
                  onMouseDown={e=>onWaypointMouseDown(e,w,idx,pt)}
                  onContextMenu={e=>onWaypointContext(e,w,idx)}/>
        )))}

        {/* Components */}
        {components.map(comp=>{
          const vis=visForComp(comp),isSel=selectedId===comp.id;
          return <g key={comp.id} transform={`translate(${comp.x},${comp.y})`}
                    onMouseDown={e=>onCompMouseDown(e,comp)}
                    onContextMenu={e=>onCompContext(e,comp)}
                    style={{cursor:'move'}}>
            {isSel&&<rect x="-6" y="-6" width={vis.w+12} height={vis.h+12} rx="10"
                          fill="none" stroke="var(--ink)" strokeWidth="1.5"
                          strokeDasharray="4 3" opacity="0.35"
                          transform={comp.facing==='left'
                          ? `translate(${vis.w} 0) scale(-1 1)`
                          : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${vis.w/2} ${vis.h/2})`}/>}
            <GateBody comp={comp}/>
            {vis.inputs.map((_,i)=>{
              const abs=pinAbs(comp,'in',i);
              const px=abs.x-comp.x, py=abs.y-comp.y;
              return <g key={'in'+i}>
                <circle cx={px} cy={py} r="6"
                        fill={comp.inputVals[i]?'var(--high)':'var(--bg)'}
                        stroke="var(--border-md)" strokeWidth="1.5"/>
                {/* Fat invisible hit target — matches the wire hit-path pattern
                    above, so a drop that's a few px off the visible pin still
                    connects instead of landing as a free wire endpoint. */}
                <circle cx={px} cy={py} r="14" fill="transparent"
                        style={{cursor:'crosshair'}}
                        onMouseUp={e=>onInputPinUp(e,comp,i)}
                        onMouseDown={e=>e.stopPropagation()}/>
              </g>;
            })}
            {vis.outputs.map((_,i)=>{
              const abs=pinAbs(comp,'out',i);
              const px=abs.x-comp.x, py=abs.y-comp.y;
              return <g key={'out'+i}>
                <circle cx={px} cy={py} r="6"
                        fill={comp.outputVals[i]?'var(--high)':'var(--bg)'}
                        stroke="var(--border-md)" strokeWidth="1.5"/>
                <circle cx={px} cy={py} r="14" fill="transparent"
                        style={{cursor:'crosshair'}}
                        onMouseDown={e=>onOutputPinDown(e,comp,i)}
                        onMouseUp={e=>onOutputPinUp(e,comp,i)}/>
              </g>;
            })}
          </g>;
        })}

        {/* Wiring preview — routed with the same routeManhattanPoints(...,
            wf.dir||'h') call every onXxxUp handler uses to actually set
            wire.points on drop, so the corner shown while dragging is the
            one that will really result instead of always defaulting to
            horizontal-first regardless of which way the drag went.
            Skipped for type==='endpoint': that drag moves a real existing
            wire, which is already being live-updated (via
            computeEndpointRoute in onMove) and rendered in its actual
            colors below — this generic dashed overlay would just be a
            second, wrongly-routed line drawn on top of it. */}
        {wiringFrom&&wiringFrom.type!=='endpoint'&&
          <path d={wirePath(wiringFrom.x,wiringFrom.y,mousePos.x,mousePos.y,
                             routeManhattanPoints({x:wiringFrom.x,y:wiringFrom.y},{x:mousePos.x,y:mousePos.y},wiringFrom.dir||'h'))}
                fill="none" stroke="var(--high)" strokeWidth="2"
                strokeDasharray="6 4" opacity="0.7" pointerEvents="none"/>}

        {/* Palette drag ghost */}
        {paletteDrag&&(()=>{
          const vis=GATE_VIS[paletteDrag.kind];
          return <g transform={`translate(${snap(mousePos.x-vis.w/2,snapGrid)},${snap(mousePos.y-vis.h/2,snapGrid)})`}
                    opacity="0.6" pointerEvents="none">
            <GateBody comp={{kind:paletteDrag.kind,inputVals:new Array(GATE_DEFS[paletteDrag.kind].inputs).fill(0),outputVals:new Array(GATE_DEFS[paletteDrag.kind].outputs).fill(0),state:{value:0}}}/>
          </g>;
        })()}
      </g>
    </svg>
    {clockPanel}
    {ioPanel}
    {gatePanel}
    {regPanel}
  </>;
}

function ParticleStream({a,b,pts=[]}) {
  const [t,setT]=useState(0);
  useEffect(()=>{let r,l=performance.now();const fn=(now)=>{setT(p=>(p+(now-l)*.0006)%1);l=now;r=requestAnimationFrame(fn);};r=requestAnimationFrame(fn);return()=>cancelAnimationFrame(r);},[]);
  const N=state.widgetState.particleDensity??4; if(N===0)return null;
  return <g pointerEvents="none">{Array.from({length:N},(_,i)=>{
    const tt=(t+i/N)%1,[x,y]=sampleWire(a.x,a.y,b.x,b.y,pts,tt);
    return <circle key={i} cx={x} cy={y} r="2.4" fill="var(--high)" opacity=".8"/>;
  })}</g>;
}
function InflightPulse({a,b,pts=[],pendingValue,pendingStart,delayMs}) {
  const [now,setNow]=useState(performance.now());
  useEffect(()=>{let r;const l=()=>{setNow(performance.now());r=requestAnimationFrame(l);};r=requestAnimationFrame(l);return()=>cancelAnimationFrame(r);},[]);
  const t=Math.min(1,(now-(pendingStart||now))/delayMs);
  const[x,y]=sampleWire(a.x,a.y,b.x,b.y,pts,t);
  const col=pendingValue>0?'var(--high)':'var(--low-p)';
  return <g pointerEvents="none"><circle cx={x} cy={y} r="7" fill={col} opacity=".22"/><circle cx={x} cy={y} r="3.5" fill={col}/></g>;
}

return { Canvas };
});
</script>

<script type="text/babel">
/* ═══ PALETTE ══════════════════════════════════════════════════════════════ */
defineModule('palette', ['engine', 'gates'], (engine, gates) => {
'use strict';
const { GATE_DEFS } = engine;
const { GATE_VIS, GateBody } = gates;
const GROUPS=[
  {title:'Sources',   kinds:['INPUT','CLOCK','CONST']},
  {title:'Sinks',     kinds:['OUTPUT', 'SEVEN']},
  {title:'Logic',     kinds:['AND','OR','NOT','NAND','NOR','XOR','XNOR','MUX']},
  {title:'Flip-flops',kinds:['DFF','TFF','JKFF','SRFF']},
  {title:'Miscellaneous',kinds:['REG', 'SHFT', 'EXTND', 'SPLIT']}, //temp
  {title:'Custom',    kinds:[]},
];
function Thumb({kind}){
  const vis=GATE_VIS[kind],def=GATE_DEFS[kind];
  const tw=62,th=44,sc=Math.min(tw/(vis.w+24),th/(vis.h+8));
  const tx2=(tw-(vis.w+12)*sc)/2,ty2=(th-vis.h*sc)/2;
  return <svg width={tw} height={th}><g transform={`translate(${tx2},${ty2}) scale(${sc})`}><GateBody comp={{kind,inputVals:new Array(def.inputs).fill(0),outputVals:new Array(def.outputs).fill(0),state:{value:0}}}/></g></svg>;
}
function Palette({onDragStart, onImportClick, onDeleteCustom, customKinds=[]}){
  return <div className="palette">{GROUPS.map(g=>{
    const isCustom = g.title === "Custom";
    const kinds = isCustom ? customKinds : g.kinds;
    return <div className="pal-group" key={g.title}>
    <div className="pal-group-title">{g.title}</div>
    <div className="pal-grid">
      {isCustom ? <button key={"import"} className="pal-item"
        onClick={onImportClick}>
        <svg width="62" height="44">
          <path d="M 28 7 H 34 V 19 H 46 V 25 H 34 V 37 H 28 V 25 H 16 V 19 H 28 Z" fill="var(--low)"/>
        </svg>
        <div className="pal-label">Import</div>
      </button> : null}
      {kinds.map(k=>isCustom ? (
        <div key={k} className="pal-item"
             onMouseDown={e=>{e.preventDefault();onDragStart(k);}}>
          <button className="pal-del-btn" title="Delete custom gate"
                  onMouseDown={e=>e.stopPropagation()}
                  onClick={e=>{e.stopPropagation();onDeleteCustom(k);}}>
            <svg width="8" height="8" viewBox="0 0 8 8">
              <line x1="1" y1="1" x2="7" y2="7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
              <line x1="7" y1="1" x2="1" y2="7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </button>
          <Thumb kind={k}/><div className="pal-label">{GATE_DEFS[k].label}</div>
        </div>
      ) : (
        <button key={k} className="pal-item"
        onMouseDown={e=>{e.preventDefault();onDragStart(k);}}>
        <Thumb kind={k}/><div className="pal-label">{GATE_DEFS[k].label}</div>
      </button>
      ))}</div>
  </div>;
  })}</div>;
}

return { Palette };
});
</script>

<script type="text/babel">
/* ═══ APP ══════════════════════════════════════════════════════════════════ */
defineModule('app', ['state', 'engine', 'gates', 'canvas', 'palette'], (state, engine, gates, canvas, palette) => {
'use strict';
const{useState,useEffect,useCallback}=React;
const{createCircuit,GATE_DEFS}=engine;
const{Canvas}=canvas;
const{Palette}=palette;

// Custom gates are only ever placed via the palette after an Import, so any
// custom kind referenced by a saved circuit was necessarily imported at some
// point — but registerCustomGate() only ever registered it in memory
// (GATE_DEFS/VIS), never persisted it. Loading that circuit in a later
// session (or before re-importing it in this one) crashed the moment
// addComponent() hit a kind with no registered definition. This registry
// makes Import durable across reloads instead of session-only.
function loadCustomRegistry() {
  try { return JSON.parse(localStorage.getItem('dss_customs_v1')||'[]'); } catch { return []; }
}
function upsertCustomRegistry(name, data) {
  const entries = loadCustomRegistry().filter(e=>e.name!==name);
  entries.push({name, data});
  localStorage.setItem('dss_customs_v1', JSON.stringify(entries));
}
function removeFromCustomRegistry(name) {
  localStorage.setItem('dss_customs_v1', JSON.stringify(loadCustomRegistry().filter(e=>e.name!==name)));
}
function extractCustomDeps(data) {
  const names = new Set();
  for (const c of (data.components||[])) {
    if (typeof c.kind === 'string' && c.kind.startsWith('CUSTOM:')) names.add(c.kind.slice('CUSTOM:'.length));
  }
  return names;
}
// Would redefining custom gate `name` as `data` make its own dependency
// chain loop back to itself (directly, or through other custom gates)?
// Checked against every OTHER custom gate's currently-registered
// definition, with `name`'s entry swapped for the proposed new one — since
// that's the only definition actually changing. Returns the cycle as a
// name chain (e.g. ['C','A','B','C']) for the warning message, or null.
function findCustomCycle(name, data) {
  const registryMap = new Map(loadCustomRegistry().map(e=>[e.name, e.data]));
  registryMap.set(name, data);
  const onPath = new Set();
  const path = [];
  function dfs(node) {
    if (onPath.has(node)) { path.push(node); return true; }
    onPath.add(node); path.push(node);
    for (const dep of extractCustomDeps(registryMap.get(node) || {})) {
      if (dfs(dep)) return true;
    }
    onPath.delete(node); path.pop();
    return false;
  }
  return dfs(name) ? path : null;
}
// Re-registers every previously-imported custom gate on startup. A custom
// gate's sub-circuit can itself contain another custom gate, and the
// registry has no guaranteed order, so this can't just register in list
// order — it retries whatever fails (missing dependency not registered yet)
// until a full pass makes no more progress.
function hydrateCustomGates() {
  let pending = loadCustomRegistry();
  const kinds = [];
  let progressed = true;
  while (pending.length && progressed) {
    progressed = false;
    const stillPending = [];
    for (const entry of pending) {
      try {
        kinds.push(gates.registerCustomGate(entry.name, entry.data));
        progressed = true;
      } catch {
        stillPending.push(entry);
      }
    }
    pending = stillPending;
  }
  if (pending.length) {
    console.warn('Could not register custom gate(s), missing dependency:', pending.map(e=>e.name));
  }
  return kinds;
}

function App(){
  const[circuit]=useState(()=>createCircuit());
  state.widgetState.circuit = circuit;
  const[,tick]=useState(0);
  const refresh=useCallback(()=>tick(n=>n+1),[]);
  const[selectedId,setSelectedId]=useState(null);
  const[palDrag,setPalDrag]=useState(null);
  const[delayMs,setDelayMs]=useState(600);
  const[saved,setSaved]=useState(()=>{try{return JSON.parse(localStorage.getItem('dss_v2')||'[]');}catch{return[];}});
  const[customKinds,setCustomKinds]=useState(()=>hydrateCustomGates());
  const[showSave,setShowSave]=useState(false);
  const[saveName,setSaveName]=useState('');
  const[showLoad,setShowLoad]=useState(false);
  const[showEquation, setShowEquation]=useState(false);
  const[equation,setEquation]=useState('');
  const[equationToLoad,setEquationToLoad]=useState('');
  const[showSettings, setShowSettings]=useState(false);
  const[propagationMode, setPropagationMode]=useState("length");


  state.widgetState.delayMs=delayMs;
  state.widgetState.propagationMode=propagationMode;
  state.widgetState.particleDensity=4;

  // Sim loop
  useEffect(()=>{
    let r;const l=()=>{circuit.step(performance.now(),delayMs);r=requestAnimationFrame(l);};
    r=requestAnimationFrame(l);return()=>cancelAnimationFrame(r);
  },[delayMs]);

  // Beamer+ state persistence protocol
  useEffect(()=>{
    const cfg = window.WIDGET_CONFIG || {};
    const wid = cfg.id || 'circuit-sim';
    const handler=(e)=>{
      if(!e.data) return;
      if(e.data.type==='widget-get-state'){
        window.parent.postMessage({type:'widget-state',widgetId:wid,state:circuit.serialize()},'*');
      } else if(e.data.type==='widget-set-state' && e.data.state){
        circuit.load(e.data.state);refresh();
      }
    };
    window.addEventListener('message',handler);
    return()=>window.removeEventListener('message',handler);
  },[]);

  // Keyboard delete
  useEffect(()=>{
    const fn=(e)=>{
      if((e.key==='Delete'||e.key==='Backspace')&&selectedId){
        if(e.target.tagName==='INPUT')return;
        // selectedId is either a real component id, or (see segSelId) a
        // '<wireId>#seg<n>' composite naming a selected wire segment —
        // deleting that deletes its whole host wire, same as right-clicking
        // anywhere on the wire's body would.
        const hashIdx = selectedId.indexOf('#seg');
        if (hashIdx===-1) circuit.removeComponent(selectedId);
        else circuit.removeWire(selectedId.slice(0,hashIdx));
        setSelectedId(null);refresh();
      }
    };
    window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn);
  },[selectedId]);

  const doSave=()=>{
    const name=saveName.trim()||`Circuit ${saved.length+1}`;
    const data=circuit.serialize();
    // Saving over an existing name replaces that saved circuit, and if it's
    // also a registered custom gate, updates that gate's definition too
    // (below) — which can loop the custom-gate dependency graph back on
    // itself (A uses B, B uses C, and this save would make C use A again).
    // Check before touching anything, so a blocked save leaves both the
    // saved-circuits list and the custom registry untouched.
    if (customKinds.includes('CUSTOM:'+name)) {
      const cycle = findCustomCycle(name, data);
      if (cycle) {
        alert(`Can't save "${name}" — it would make the "${name}" custom gate depend on itself:\n${cycle.join(' → ')}\n\nBreak that chain (edit one of the gates so it no longer loops back to "${name}") before saving.`);
        return;
      }
    }
    const next=[...saved.filter(s=>s.name!==name),{name,data,ts:Date.now()}];
    setSaved(next);localStorage.setItem('dss_v2',JSON.stringify(next));setShowSave(false);setSaveName('');
    if (customKinds.includes('CUSTOM:'+name)) {
      gates.registerCustomGate(name, data);
      upsertCustomRegistry(name, data);
    }
  };
  const doLoad=(s)=>{circuit.load(s.data);setShowLoad(false);refresh();};
  // This only stops a custom kind from being placed again — it deliberately
  // doesn't touch GATE_DEFS/VIS, so components of that kind already sitting
  // on the canvas keep simulating instead of crashing on the next step().
  const removeCustomKind=(name)=>{
    removeFromCustomRegistry(name);
    setCustomKinds(prev=>prev.filter(k=>k!=='CUSTOM:'+name));
  };
  const delSaved=(name)=>{
    const n=saved.filter(s=>s.name!==name);
    setSaved(n);localStorage.setItem('dss_v2',JSON.stringify(n));
    // A saved circuit and an imported custom gate are linked only by name,
    // so drop the matching custom-gate registration too — otherwise it'd
    // keep reappearing in the palette (and rehydrating on reload) after its
    // source circuit is gone.
    removeCustomKind(name);
  };
  const onDeleteCustom=(kind)=>{
    if(!confirm('Remove the custom gate "' + kind.slice(7) + '" from the palette?'))return;
    removeCustomKind(kind.slice('CUSTOM:'.length));
  };
  const doImport=(s)=>{
    const kind=gates.registerCustomGate(s.name,s.data);
    upsertCustomRegistry(s.name,s.data);
    setCustomKinds(prev=>prev.includes(kind)?prev:[...prev,kind]);
  };
  const doClear=()=>{if(!confirm('Clear canvas?'))return;[...circuit.components.keys()].forEach(id=>circuit.removeComponent(id));refresh();};
  const generateEquation=()=>{

    const inputs = Array.from(circuit.ioComponents.values()).
      filter(c=>c.kind==='INPUT').
      sort((a,b)=>a.ioId.localeCompare(b.ioId));
    const outputs = Array.from(circuit.ioComponents.values()).
      filter(c=>c.kind==='OUTPUT').
      sort((a,b)=>a.ioId.localeCompare(b.ioId));

    if (inputs.length == 0) {
      alert('Your circuit has no inputs.');
      return;
    }

    let labels = new Set();
    for (let ioComp of inputs.concat(outputs)) {
      if (labels.has(ioComp.label)) {
        alert('Your circuit has duplicate labels.');
        break;
      } else { labels.add(ioComp.label); }
    }

    const outputMinterms = new Map(outputs.map(o=>[o, []]));
    const originalInputValues = inputs.map(inp=>inp.state.value);

    const combinations = 1 << inputs.length;
    for (let mask = 0; mask < combinations; mask++) {
      inputs.forEach((inp, idx)=>{ inp.state.value = (mask >> idx) & 1; });
      settleCircuit(circuit, 10);

      for (const output of outputs) {
        if (output.inputVals[0] === 1) {
          outputMinterms.get(output).push(mask);
        }
      }
    }

    inputs.forEach((inp, idx)=>{ inp.state.value = originalInputValues[idx]; });
    settleCircuit(circuit, 10);

    const equations = outputs.map(output=>{
      const terms = outputMinterms.get(output);
      const rhs = terms.length ? quineMcCluskey(terms, inputs.length, inputs.map((item) => (item.label.length === 1 ? item.label : `(${item.label})`))).expression : '0';
      return `${output.label} = ${rhs}`;
    });

    setEquation(equations.join('\n'));
  };

  function settleCircuit(circuit, maxSteps = 10) {
    for (let i = 0; i < maxSteps; i++) {
      circuit.step(performance.now(), 0, true);
    }
  }

  const loadEquation=()=>{
    const eq = equationToLoad.trim();
    const match = /^([A-Za-z])\s*=\s*(.+)$/.exec(eq);
    if (!match) {
      alert('Enter an equation like A = B + C\'');
      return;
    }

    const outputLabel = match[1];
    const rhs = match[2];
    const literalLabels = [...new Set((rhs.match(/[A-Za-z]/g) || []))].filter(l => l !== outputLabel);

    circuit.components.clear(); circuit.ioComponents.clear(); circuit.wires.clear();

    const labelsToComps = new Map();
    literalLabels.forEach((label, idx) => {
      const comp = circuit.addComponent("INPUT", 0, idx * 60, label);
      labelsToComps.set(label, comp);
    });

    const outputComp = circuit.addComponent("OUTPUT", 400, 0, outputLabel);

    let numAnds = 0;
    let numNots = 0;

    const wireFrom = (comp, pin=0) => ({compId: comp.id, pin});
    const parseLiteral = (literal) => {
      const label = literal[0];
      const comp = labelsToComps.get(label);
      if (!comp) throw new Error(`Unknown input label ${label}`);
      if (literal.endsWith("'")) {
        const notComp = circuit.addComponent("NOT", 100, numNots * 70);
        numNots++;
        circuit.addWire(wireFrom(comp), wireFrom(notComp));
        return wireFrom(notComp);
      }
      return wireFrom(comp);
    };

    const createAndTerm = (term) => {
      const literals = term.match(/[A-Za-z]'?/g) || [];
      if (literals.length === 0) return null;
      let current = parseLiteral(literals[0]);
      for (let i = 1; i < literals.length; i++) {
        const next = parseLiteral(literals[i]);
        const andComp = circuit.addComponent("AND", 200, numAnds * 70);
        numAnds++;
        circuit.addWire(current, {compId: andComp.id, pin: 0});
        circuit.addWire(next, {compId: andComp.id, pin: 1});
        current = {compId: andComp.id, pin: 0};
      }
      return current;
    };

    const orTerms = rhs.split('+').map(t => t.trim()).filter(Boolean);
    if (orTerms.length === 0) {
      alert('No terms found in the equation');
      return;
    }

    let outputSource = createAndTerm(orTerms[0]);
    for (let i = 1; i < orTerms.length; i++) {
      const nextTerm = createAndTerm(orTerms[i]);
      const orComp = circuit.addComponent("OR", 300, i * 70);
      circuit.addWire(outputSource, {compId: orComp.id, pin: 0});
      circuit.addWire(nextTerm, {compId: orComp.id, pin: 1});
      outputSource = {compId: orComp.id, pin: 0};
    }

    circuit.addWire(outputSource, {compId: outputComp.id, pin: 0});
    setShowLoad(false);
  }

  const n=circuit.components.size;

  return <div className="app">
    <div className="tb">
      <span className="tb-title">Circuit Simulator</span>
      {/* Save / Load / Clear */}
      <div className="tb-sep"/>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowSave(true)} disabled={n===0}>Save</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowLoad(true)}>Load</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={doClear} disabled={n===0}>Clear</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowEquation(true)}>Boolean Equation</button>
      <button className="btn ghost" style={{height:26,fontSize:12}} onClick={()=>setShowSettings(true)}>Settings</button>
      {/* Propagation delay */}
      <div className="tb-delay">
        <span>Propagation Delay</span>
        <input type="range" min="10" max="2000" step="10" value={delayMs}
               onChange={e=>setDelayMs(Number(e.target.value))}/>
        <span className="tb-delay-val">{delayMs}ms</span>
      </div>
    </div>

    <div className="main">
      <Palette onDragStart={kind=>setPalDrag({kind})} onImportClick={()=>setShowLoad(true)} onDeleteCustom={onDeleteCustom} customKinds={customKinds}/>
      <div className="canvas-wrap">
        <Canvas circuit={circuit}
                selectedId={selectedId}
                onSelect={setSelectedId}
                paletteDrag={palDrag}
                onClearPaletteDrag={()=>setPalDrag(null)}
                onComponentChanged={refresh}
                snapGrid={true}/>
        <div className="fc">
          <span className="fc-n">{n}</span><span className="fc-lbl">gates</span>
          <span className="fc-div"/>
          <span className="fc-n">{circuit.wires.size}</span><span className="fc-lbl">wires</span>
        </div>
      </div>
    </div>

    {showSave&&<Dialog title="Save circuit" onClose={()=>setShowSave(false)}>
      <input className="text-input" placeholder="My circuit" value={saveName} autoFocus
             onChange={e=>setSaveName(e.target.value)}
             onKeyDown={e=>e.key==='Enter'&&doSave()}/>
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>setShowSave(false)}>Cancel</button>
        <button className="btn primary" onClick={doSave}>Save</button>
      </div>
    </Dialog>}

    {showLoad&&<Dialog title="Saved circuits" onClose={()=>setShowLoad(false)}>
      {saved.length===0
        ? <div className="empty">No saved circuits yet.</div>
        : <div className="saved-list">{saved.map(s=><div key={s.name} className="saved-item">
            <div>
              <div className="saved-name">{s.name}</div>
              <div className="saved-meta">{s.data.components.length} gates · {s.data.wires.length} wires</div>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn ghost danger" onClick={()=>delSaved(s.name)}>Delete</button>
              <button className="btn ghost" onClick={()=>doImport(s)}>Import</button>
              <button className="btn primary" onClick={()=>doLoad(s)}>Load</button>
            </div>
          </div>)}</div>}
      <br/>
      <div className="modal-title">Load from Equation</div>
      <input className="text-input" placeholder="A = B" value={equationToLoad} autoFocus
             onChange={e=>setEquationToLoad(e.target.value)}
             onKeyDown={e=>e.key==='Enter'&&loadEquation()}/>
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>setShowLoad(false)}>Cancel</button>
        <button className="btn primary" onClick={loadEquation}>Load</button>
      </div>
    </Dialog>}

    {showEquation&&<Dialog title="Generate Boolean Equation" onClose={()=>setShowEquation(false)}>
      {equation === '' ? "No equation generated." : equation}
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>generateEquation()}>{equation === '' ? "Generate" : "Regenerate"}</button>
        <button className="btn ghost" onClick={()=>setShowEquation(false)}>Exit</button>
      </div>
    </Dialog>}

    {showSettings&&<Dialog title="Settings" onClose={()=>setShowSettings(false)}>
      <div className="prop-option">
        <span className="prop-label">Propagation Mode</span>
        <select className="prop-input"
                  value={propagationMode}
                  onChange={e=>{setPropagationMode(e.target.value == "length" ? "length" : "component");onComponentChanged?.();}}>
            <option value="length">Length-Based Speed</option>
            <option value="component">Component-Based Speed</option>
        </select>
      </div>
      <div className="dialog-actions">
        <button className="btn ghost" onClick={()=>setShowSettings(false)}>Exit</button>
      </div>
    </Dialog>}

  </div>;
}

function Dialog({title,children,onClose}){
  return <div className="modal-bg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-title">{title}</div>
      {children}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body>
</html>
